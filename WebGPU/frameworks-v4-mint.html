const RENDER_SHADER = `
struct Uniforms {
  viewProj: mat4x4<f32>,
  cursor: vec3<f32>,
  showCursor: f32,
};

struct Instance {
  px: f32, py: f32, pz: f32, scale: f32,
  rx: f32, ry: f32, rz: f32, colorIdx: u32,
  ux: f32, uy: f32, uz: f32, flags: u32,
  nx: f32, ny: f32, nz: f32, frameId: u32,
};

@group(0) @binding(0) var<uniform> u: Uniforms;
@group(0) @binding(1) var<storage, read> visible: array<u32>;
@group(0) @binding(2) var<storage, read> instances: array<Instance>;
@group(0) @binding(3) var<storage, read> palette: array<vec4<f32>>;

struct V2F { @builtin(position) pos: vec4<f32>, @location(0) col: vec4<f32> };

@vertex fn vs_frame(@location(0) lp: vec4<f32>, @builtin(instance_index) ii: u32) -> V2F {
  let idx = visible[ii];
  let inst = instances[idx];

  let basis = mat3x3<f32>(
    vec3<f32>(inst.rx, inst.ry, inst.rz),
    vec3<f32>(inst.ux, inst.uy, inst.uz),
    vec3<f32>(inst.nx, inst.ny, inst.nz),
  );

  // Scale only the centerline, keep perp offset fixed (constant line thickness)
  let center = vec3<f32>(lp.x * inst.scale, lp.y * inst.scale, 0.0);
  let perp   = vec3<f32>(lp.z, lp.w, 0.0);
  var p = basis * (center + perp);
  p += vec3<f32>(inst.px, inst.py, inst.pz);

  var o: V2F;
  o.pos = u.viewProj * vec4<f32>(p, 1.0);

  var c = palette[inst.colorIdx % 80u];
  if ((inst.flags & 1u) != 0u) { c = mix(c, vec4<f32>(1.0,1.0,1.0,1.0), 0.4); }
  o.col = c;
  return o;
}

@fragment fn fs_frame(v: V2F) -> @location(0) vec4<f32> { return v.col; }

@vertex fn vs_cursor(@location(0) lp: vec3<f32>) -> V2F {
  var p = lp * 0.15 + u.cursor;
  var o: V2F;
  o.pos = u.viewProj * vec4<f32>(p, 1.0);
  o.col = vec4<f32>(1.0, 1.0, 1.0, 0.7);
  if (u.showCursor < 0.5) { o.pos = vec4<f32>(0.0, 0.0, -2.0, 1.0); }
  return o;
}
@fragment fn fs_cursor(v: V2F) -> @location(0) vec4<f32> { return v.col; }
`;

const CULL_SHADER = `
struct CullUniforms {
  planes: array<vec4<f32>, 6>,
  totalInstances: u32,
};

struct Instance {
  px: f32, py: f32, pz: f32, scale: f32,
  rx: f32, ry: f32, rz: f32, colorIdx: u32,
  ux: f32, uy: f32, uz: f32, flags: u32,
  nx: f32, ny: f32, nz: f32, frameId: u32,
};

struct IndirectArgs {
  indexCount: u32,
  instanceCount: atomic<u32>,
  firstIndex: u32,
  baseVertex: u32,
  firstInstance: u32,
};

@group(0) @binding(0) var<uniform> cu: CullUniforms;
@group(0) @binding(1) var<storage, read> instances: array<Instance>;
@group(0) @binding(2) var<storage, read_write> visible: array<u32>;
@group(0) @binding(3) var<storage, read_write> indirect: IndirectArgs;

@compute @workgroup_size(256)
fn cull_main(@builtin(global_invocation_id) gid: vec3<u32>) {
  let i = gid.x;
  if (i >= cu.totalInstances) { return; }

  let inst = instances[i];
  let pos = vec3<f32>(inst.px, inst.py, inst.pz);
  let radius = inst.scale * 0.9;

  var inside = true;
  for (var p = 0u; p < 6u; p++) {
    let plane = cu.planes[p];
    let dist = dot(plane.xyz, pos) + plane.w;
    if (dist < -radius) {
      inside = false;
      break;
    }
  }

  if (inside && (inst.flags & 2u) != 0u) {
    let slot = atomicAdd(&indirect.instanceCount, 1u);
    visible[slot] = i;
  }
}
`;

// ============================================================
// FRUSTUM PLANE EXTRACTION
// ============================================================
function extractFrustumPlanes(vp) {
  const r0 = [vp[0], vp[4], vp[8],  vp[12]];
  const r1 = [vp[1], vp[5], vp[9],  vp[13]];
  const r2 = [vp[2], vp[6], vp[10], vp[14]];
  const r3 = [vp[3], vp[7], vp[11], vp[15]];

  const planes = new Float32Array(24);
  function setPlane(idx, a, b, c, d) {
    const len = sqrt(a*a + b*b + c*c);
    planes[idx*4]=a/len; planes[idx*4+1]=b/len; planes[idx*4+2]=c/len; planes[idx*4+3]=d/len;
  }
  setPlane(0, r3[0]+r0[0], r3[1]+r0[1], r3[2]+r0[2], r3[3]+r0[3]);
  setPlane(1, r3[0]-r0[0], r3[1]-r0[1], r3[2]-r0[2], r3[3]-r0[3]);
  setPlane(2, r3[0]+r1[0], r3[1]+r1[1], r3[2]+r1[2], r3[3]+r1[3]);
  setPlane(3, r3[0]-r1[0], r3[1]-r1[1], r3[2]-r1[2], r3[3]-r1[3]);
  setPlane(4, r3[0]+r2[0], r3[1]+r2[1], r3[2]+r2[2], r3[3]+r2[3]);
  setPlane(5, r3[0]-r2[0], r3[1]-r2[1], r3[2]-r2[2], r3[3]-r2[3]);
  return planes;
}

// ============================================================
// CAMERA CONTROLLER
// ============================================================
class Camera {
  constructor(canvas) {
    this.theta = PI/4; this.phi = PI/6; this.dist = 30;
    this.fov = PI/4;
    this.target = [0, 0, 0];
    this.eye = new Float32Array(3);
    this.view = new Float32Array(16);
    this.proj = new Float32Array(16);
    this.vp = new Float32Array(16);
    this._dirty = true;
    this._dragging = false; this._panning = false;
    this._lx = 0; this._ly = 0;

    canvas.addEventListener('mousedown', e => {
      if (e.button === 0 && !e.altKey) { this._dragging = true; }
      else if (e.button === 2 || (e.button === 0 && e.altKey)) { this._panning = true; }
      this._lx = e.clientX; this._ly = e.clientY; e.preventDefault();
    });
    window.addEventListener('mousemove', e => {
      if (!this._dragging && !this._panning) return;
      const dx = e.clientX - this._lx, dy = e.clientY - this._ly;
      this._lx = e.clientX; this._ly = e.clientY;
      if (this._dragging) {
        this.theta -= dx * 0.005;
        this.phi = clamp(this.phi + dy * 0.005, -PI/2+0.01, PI/2-0.01);
        this._dirty = true;
      } else {
        const s = this.dist * 0.002;
        const rx = -cos(this.theta), rz = sin(this.theta);
        const ux = -sin(this.phi)*sin(this.theta), uy = cos(this.phi), uz = -sin(this.phi)*cos(this.theta);
        this.target[0] += (-dx*rx + dy*ux)*s;
        this.target[1] += dy*uy*s;
        this.target[2] += (-dx*rz + dy*uz)*s;
        this._dirty = true;
      }
    });
    window.addEventListener('mouseup', () => { this._dragging = false; this._panning = false; });
    canvas.addEventListener('wheel', e => {
      this.dist = clamp(this.dist * (1 + e.deltaY * 0.001), 0.5, 2000);
      this._dirty = true; e.preventDefault();
    }, { passive: false });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
  }

  update(aspect) {
    this.eye[0] = this.target[0] + this.dist * cos(this.phi) * sin(this.theta);
    this.eye[1] = this.target[1] + this.dist * sin(this.phi);
    this.eye[2] = this.target[2] + this.dist * cos(this.phi) * cos(this.theta);
    // Derive up from theta so it never degenerates at the poles.
    // right = [cos(theta), 0, -sin(theta)] (always horizontal, never collinear with eye-target)
    // up = right × forward
    const rx = cos(this.theta), rz = -sin(this.theta);
    const fx = this.target[0]-this.eye[0], fy = this.target[1]-this.eye[1], fz = this.target[2]-this.eye[2];
    const fl = sqrt(fx*fx+fy*fy+fz*fz);
    const fdx=fx/fl, fdy=fy/fl, fdz=fz/fl;
    let ux = 0*fdz - rz*fdy,  // right × forward
        uy = rz*fdx - rx*fdz,
        uz = rx*fdy - 0*fdx;
    const ul = sqrt(ux*ux+uy*uy+uz*uz); ux/=ul; uy/=ul; uz/=ul;
    mat4LookAt(this.view, this.eye, this.target, [ux,uy,uz]);
    mat4Perspective(this.proj, this.fov, aspect, 0.1, 2000);
    mat4Mul(this.vp, this.proj, this.view);
    const d = this._dirty; this._dirty = false; return d;
  }

  invalidate() { this._dirty = true; }
}

// ============================================================
// WEBGPU INIT + COMMAND STRING LOADER
// ============================================================
async function main() {
  const canvas = document.getElementById('canvas');
  const labelCanvas = document.getElementById('label-canvas');
  const labelCtx = labelCanvas.getContext('2d');
  let showLabels = false;
  const errEl = document.getElementById('error-msg');

  if (!navigator.gpu) { errEl.style.display='block'; errEl.textContent='WebGPU not supported. Use Chrome 113+.'; return; }
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) { errEl.style.display='block'; errEl.textContent='No WebGPU adapter.'; return; }

  const limits = adapter.limits;
  const device = await adapter.requestDevice({
    requiredLimits: {
      maxStorageBufferBindingSize: min(MAX_INSTANCES * BYTES_PER_INSTANCE, limits.maxStorageBufferBindingSize),
      maxBufferSize: min(MAX_INSTANCES * BYTES_PER_INSTANCE, limits.maxBufferSize),
      maxComputeWorkgroupsPerDimension: limits.maxComputeWorkgroupsPerDimension,
    },
  });

  const ctx = canvas.getContext('webgpu');
  const fmt = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format: fmt, alphaMode: 'opaque' });

  const frameGeo = buildFrameGeo();
  const frameVB = device.createBuffer({ size: frameGeo.verts.byteLength, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(frameVB, 0, frameGeo.verts);
  const frameIB = device.createBuffer({ size: frameGeo.idx.byteLength, usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(frameIB, 0, frameGeo.idx);
  const frameIdxCount = frameGeo.idx.length;

  const curGeo = buildCursorGeo();
  const curVB = device.createBuffer({ size: curGeo.verts.byteLength, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(curVB, 0, curGeo.verts);
  const curIB = device.createBuffer({ size: curGeo.idx.byteLength, usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(curIB, 0, curGeo.idx);
  const curIdxCount = curGeo.idx.length;

  const maxBytes = MAX_INSTANCES * BYTES_PER_INSTANCE;

  const instanceBuf = device.createBuffer({ size: maxBytes, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const visibleBuf = device.createBuffer({ size: MAX_INSTANCES * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const indirectBuf = device.createBuffer({ size: 20, usage: GPUBufferUsage.INDIRECT | GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC });
  const paletteBuf = device.createBuffer({ size: PALETTE_DATA.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(paletteBuf, 0, PALETTE_DATA);

  const uniformBuf = device.createBuffer({ size: 80, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const cullUniformBuf = device.createBuffer({ size: 112, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const readbackBuf = device.createBuffer({ size: 20, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });

  const renderShader = device.createShaderModule({ code: RENDER_SHADER });
  const cullShader = device.createShaderModule({ code: CULL_SHADER });

  const renderBGL = device.createBindGroupLayout({ entries: [
    { binding: 0, visibility: GPUShaderStage.VERTEX, buffer: { type: 'uniform' } },
    { binding: 1, visibility: GPUShaderStage.VERTEX, buffer: { type: 'read-only-storage' } },
    { binding: 2, visibility: GPUShaderStage.VERTEX, buffer: { type: 'read-only-storage' } },
    { binding: 3, visibility: GPUShaderStage.VERTEX, buffer: { type: 'read-only-storage' } },
  ]});

  const renderBG = device.createBindGroup({ layout: renderBGL, entries: [
    { binding: 0, resource: { buffer: uniformBuf } },
    { binding: 1, resource: { buffer: visibleBuf } },
    { binding: 2, resource: { buffer: instanceBuf } },
    { binding: 3, resource: { buffer: paletteBuf } },
  ]});

  const vbl      = { arrayStride: 12, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }] };
  const frameVbl = { arrayStride: 16, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x4' }] };
  const depthFormat = 'depth24plus';
  const SAMPLE_COUNT = 4;

  const framePipeline = device.createRenderPipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts: [renderBGL] }),
    vertex: { module: renderShader, entryPoint: 'vs_frame', buffers: [frameVbl] },
    fragment: { module: renderShader, entryPoint: 'fs_frame', targets: [{ format: fmt }] },
    primitive: { topology: 'triangle-list', cullMode: 'none' },
    depthStencil: { format: depthFormat, depthWriteEnabled: true, depthCompare: 'less' },
    multisample: { count: SAMPLE_COUNT },
  });

  const cursorPipeline = device.createRenderPipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts: [renderBGL] }),
    vertex: { module: renderShader, entryPoint: 'vs_cursor', buffers: [vbl] },
    fragment: { module: renderShader, entryPoint: 'fs_cursor', targets: [{ format: fmt }] },
    primitive: { topology: 'triangle-list', cullMode: 'none' },
    depthStencil: { format: depthFormat, depthWriteEnabled: true, depthCompare: 'less' },
    multisample: { count: SAMPLE_COUNT },
  });

  const cullBGL = device.createBindGroupLayout({ entries: [
    { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
    { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'read-only-storage' } },
    { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
    { binding: 3, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
  ]});

  const cullBG = device.createBindGroup({ layout: cullBGL, entries: [
    { binding: 0, resource: { buffer: cullUniformBuf } },
    { binding: 1, resource: { buffer: instanceBuf } },
    { binding: 2, resource: { buffer: visibleBuf } },
    { binding: 3, resource: { buffer: indirectBuf } },
  ]});

  const cullPipeline = device.createComputePipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts: [cullBGL] }),
    compute: { module: cullShader, entryPoint: 'cull_main' },
  });

  let depthTex, msaaTex;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    labelCanvas.width = canvas.width;
    labelCanvas.height = canvas.height;
    if (depthTex) depthTex.destroy();
    if (msaaTex) msaaTex.destroy();
    depthTex = device.createTexture({ size: [canvas.width, canvas.height], format: depthFormat, sampleCount: SAMPLE_COUNT, usage: GPUTextureUsage.RENDER_ATTACHMENT });
    msaaTex = device.createTexture({ size: [canvas.width, canvas.height], format: fmt, sampleCount: SAMPLE_COUNT, usage: GPUTextureUsage.RENDER_ATTACHMENT });
  }
  window.addEventListener('resize', resize);
  resize();

  // App state
  const store = new FrameStore();
  const palette = new PaletteManager();
  const cam = new Camera(canvas);
  const executor = new CommandExecutor(store, palette, cam);
  executor.onNameWritten = () => { showLabels = true; };
  executor.gpuLineUpdate = (hw, ext) => {
    const geo = buildFrameGeo(hw, ext);
    device.queue.writeBuffer(frameVB, 0, geo.verts);
  };

  // Auto-execute: when loaded as an on-chain token the renderer injects
  // `let autoExecuteCommand = '...'` before this script runs.
  let showUI = true;
  // Stores the condensed command string for minting.
  // Set to the literal bar input when executed via the command bar,
  // or re-condensed from keystrokes when built interactively.
  let mintCommandString = '';
  if (typeof autoExecuteCommand !== 'undefined' && autoExecuteCommand) {
    executor.executeCommandString(autoExecuteCommand);
    store.deselectAll();
    mintCommandString = autoExecuteCommand;
    showUI = false;
    document.getElementById('command-bar').style.display = 'none';
  }

  // Build palette grid
  const paletteGrid = document.getElementById('palette-grid');
  for (let i = 0; i < 80; i++) {
    const cell = document.createElement('div');
    cell.className = 'palette-cell';
    const r = (PALETTE_DATA[i*4] * 255)|0;
    const g = (PALETTE_DATA[i*4+1] * 255)|0;
    const b = (PALETTE_DATA[i*4+2] * 255)|0;
    cell.style.background = `rgb(${r},${g},${b})`;
    paletteGrid.appendChild(cell);
  }

  // Command bar controls
  const commandInput = document.getElementById('command-input');
  const btnExecute = document.getElementById('btn-execute');
  const btnExport = document.getElementById('btn-export');
  const btnCopyHash = document.getElementById('btn-copy-hash');

  btnExecute.addEventListener('click', () => {
    const cmd = commandInput.value.trim();
    if (cmd) {
      store.clear();
      palette.reset();
      executor.resetAll();
      mintCommandString = cmd;
      executor.executeCommandString(cmd);
      if (mintPanel.classList.contains('active')) updateMintCommand();
    }
  });

  document.getElementById('bracket-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      executor.selectionContext.submitBracketInput(e.target.value);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      executor.selectionContext.closeBracketInput();
    }
  });

  document.getElementById('slash-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const cmd = e.target.value.trim();
      const overlay = document.getElementById('slash-overlay');
      overlay.classList.remove('active');
      if (cmd) {
        executor.executeCommandString(cmd);
        const existing = commandInput.value.trim();
        commandInput.value = existing ? existing + ' ' + cmd : cmd;
        mintCommandString = commandInput.value;
      }
    } else if (e.key === 'Escape') {
      e.preventDefault();
      document.getElementById('slash-overlay').classList.remove('active');
    }
  });

  commandInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const cmd = commandInput.value.trim();
      if (cmd) {
        store.clear();
        palette.reset();
        executor.resetAll();
        mintCommandString = cmd;
        executor.executeCommandString(cmd);
        if (mintPanel.classList.contains('active')) updateMintCommand();
      }
      commandInput.blur();
    } else if (e.key === 'Escape') {
      commandInput.blur();
      e.preventDefault();
    }
  });

  btnExport.addEventListener('click', () => {
    const seq = executor.commandTree.getCurrentCommandSequence();
    const joined = seq.join('');
    const condensed = executor.condenseCommandString(joined);
    commandInput.value = condensed;
    console.log('Exported command string:', condensed);
  });

  btnCopyHash.addEventListener('click', () => {
    const seq = executor.commandTree.getCurrentCommandSequence();
    const joined = seq.join('');
    const condensed = executor.condenseCommandString(joined);
    const url = `${window.location.origin}${window.location.pathname}#${encodeURIComponent(condensed)}`;
    navigator.clipboard.writeText(url).then(() => {
      console.log('Copied to clipboard:', url);
      alert('Hash URL copied to clipboard!');
    });
  });

  // URL hash loader
  window.addEventListener('load', () => {
    const hash = window.location.hash.slice(1);
    if (hash) {
      const cmd = decodeURIComponent(hash);
      commandInput.value = cmd;
      console.log('Loading command string from URL hash:', cmd);
      executor.executeCommandString(cmd);
    }
  });

  // Input - wire CommandExecutor
  window.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === '?') {
      showUI = !showUI;
      document.getElementById('command-bar').style.display = showUI ? '' : 'none';
      if (!showUI) document.getElementById('mint-panel').classList.remove('active');
      if (showUI && mintCommandString && !commandInput.value) {
        commandInput.value = mintCommandString;
      }
      return;
    }
    if (e.key === '/') {
      e.preventDefault();
      const overlay = document.getElementById('slash-overlay');
      const input = document.getElementById('slash-input');
      overlay.classList.add('active');
      setTimeout(() => { input.value = ''; input.focus(); }, 0);
      return;
    }
    if (e.key === '%') {
      const camCtx = executor.cameraContext;
      if (camCtx.autoOrbit && !showUI) {
        // Already in presentation mode — exit
        camCtx.autoOrbit = false;
        showUI = true;
        document.getElementById('command-bar').style.display = '';
      } else {
        // Enter presentation mode: fit camera, start orbit, hide UI
        if (store.count > 0) {
          const bbox = store.getBoundingBox();
          cam.target = [bbox.centerX, bbox.centerY, bbox.centerZ];
          const span = Math.max(bbox.maxX - bbox.minX, bbox.maxY - bbox.minY, bbox.maxZ - bbox.minZ);
          cam.dist = span * 1.8;
          cam.theta = Math.PI / 4;
          cam.phi = Math.PI / 6;
          cam.invalidate();
        }
        camCtx.autoOrbit = true;
        camCtx.autoOrbitPaused = false;
        camCtx.orbitTheta = cam.theta;
        camCtx.orbitPhi = cam.phi;
        camCtx.orbitVelocityTheta = 0.15;
        camCtx.orbitVelocityPhi = 0;
        store.deselectAll();
        showUI = false;
        document.getElementById('command-bar').style.display = 'none';
        document.getElementById('mint-panel').classList.remove('active');
      }
      return;
    }
    if (e.key === 'Tab') {
      e.preventDefault();
      showLabels = !showLabels;
      return;
    }
    executor.executeKey(e.key, e.shiftKey);
  });

  // Render loop
  let visibleCount = 0;
  let pendingReadback = false;
  let mapInFlight = false;
  let fpsFrames = 0, fpsLast = performance.now(), fps = 0;

  const indirectReset = new Uint32Array([frameIdxCount, 0, 0, 0, 0]);

  let lastFrameTime = performance.now();
  function frame() {
    requestAnimationFrame(frame);

    fpsFrames++;
    const now = performance.now();
    const deltaTime = (now - lastFrameTime) / 1000; // Convert to seconds
    lastFrameTime = now;
    if (now - fpsLast > 500) { fps = (fpsFrames / (now-fpsLast) * 1000)|0; fpsFrames=0; fpsLast=now; }

    executor.updateAnimation(now);
    executor.cameraContext.updateAutoOrbit(deltaTime);

    const n = store.count;

    const dirty = store.getDirtyRange();
    if (dirty && n > 0) {
      device.queue.writeBuffer(instanceBuf, dirty.offset, store.data, dirty.offset, dirty.length);
      store.clearDirty();
    }

    const aspect = canvas.width / canvas.height;
    cam.fov = executor.cameraContext.fov;
    cam.update(aspect);

    const uniformData = new Float32Array(20);
    uniformData.set(cam.vp, 0);
    uniformData[16] = executor.cursor.x; uniformData[17] = executor.cursor.y; uniformData[18] = executor.cursor.z;
    uniformData[19] = showUI ? 1 : 0;
    device.queue.writeBuffer(uniformBuf, 0, uniformData);

    const planes = extractFrustumPlanes(cam.vp);
    const cullData = new ArrayBuffer(112);
    const cullF32 = new Float32Array(cullData);
    const cullU32 = new Uint32Array(cullData);
    cullF32.set(planes, 0);
    cullU32[24] = n;
    device.queue.writeBuffer(cullUniformBuf, 0, cullData);

    device.queue.writeBuffer(indirectBuf, 0, indirectReset);

    const enc = device.createCommandEncoder();

    if (n > 0) {
      const cp = enc.beginComputePass();
      cp.setPipeline(cullPipeline);
      cp.setBindGroup(0, cullBG);
      cp.dispatchWorkgroups(ceil(n / 256));
      cp.end();
    }

    const tv = ctx.getCurrentTexture().createView();
    const rp = enc.beginRenderPass({
      colorAttachments: [{
        view: msaaTex.createView(),
        resolveTarget: tv,
        clearValue: { r:0.035, g:0.035, b:0.05, a:1 },
        loadOp:'clear', storeOp:'discard',
      }],
      depthStencilAttachment: { view: depthTex.createView(), depthClearValue: 1, depthLoadOp:'clear', depthStoreOp:'discard' },
    });

    if (n > 0) {
      rp.setPipeline(framePipeline);
      rp.setBindGroup(0, renderBG);
      rp.setVertexBuffer(0, frameVB);
      rp.setIndexBuffer(frameIB, 'uint16');
      rp.drawIndexedIndirect(indirectBuf, 0);
    }

    if (showUI) {
      rp.setPipeline(cursorPipeline);
      rp.setBindGroup(0, renderBG);
      rp.setVertexBuffer(0, curVB);
      rp.setIndexBuffer(curIB, 'uint16');
      rp.drawIndexed(curIdxCount, 1);
    }

    rp.end();

    if (!pendingReadback && fpsFrames % 30 === 0 && n > 0) {
      enc.copyBufferToBuffer(indirectBuf, 0, readbackBuf, 0, 20);
      pendingReadback = true;
    }

    device.queue.submit([enc.finish()]);

    if (pendingReadback && !mapInFlight) {
      mapInFlight = true;
      readbackBuf.mapAsync(GPUMapMode.READ).then(() => {
        const d = new Uint32Array(readbackBuf.getMappedRange().slice(0));
        readbackBuf.unmap();
        visibleCount = d[1];
        pendingReadback = false;
        mapInFlight = false;
      }).catch(() => {
        pendingReadback = false;
        mapInFlight = false;
      });
    }

    // HUD
    if (showUI) {
      let modeText = executor.mode;
      if (executor.colorContext.active) modeText = 'color';
      if (executor.cameraContext.active) modeText = 'camera';
      if (executor.selectionContext.active) modeText = 'selection';
      if (executor.commandTree.inCommandContext) modeText = 'command';
      if (executor.animationActive) modeText += ` (animating  step:${executor.animationColorStep}  interval:${executor.animationInterval}ms)`;

      document.getElementById('mode-text').textContent = modeText;
      document.getElementById('view-text').textContent = `View: ${executor.currentView} ${VP[executor.currentView].name}`;
      document.getElementById('cursor-text').textContent = `Cursor: ${executor.cursor.x.toFixed(1)}, ${executor.cursor.y.toFixed(1)}, ${executor.cursor.z.toFixed(1)}`;
      document.getElementById('selection-text').textContent = `Sel: ${store.getSelectedCount()} / ${n}`;
      document.getElementById('fps-text').textContent = `FPS: ${fps}`;
      document.getElementById('draw-text').textContent = `Visible: ${visibleCount.toLocaleString()} / ${n.toLocaleString()}`;
    }
    document.getElementById('hud').className = showUI ? '' : 'hidden';

    // 2D label overlay
    if (showLabels && n > 0) {
      labelCtx.clearRect(0, 0, labelCanvas.width, labelCanvas.height);
      const dpr = window.devicePixelRatio || 1;
      labelCtx.font = `${Math.round(13 * dpr)}px 'SF Mono', 'Fira Code', monospace`;
      labelCtx.textAlign = 'center';
      for (let i = 0; i < store.count; i++) {
        const meta = store.metadata[i];
        if (!meta.called) continue;
        const o = store._o(i);
        const px = store.f32[o], py = store.f32[o+1], pz = store.f32[o+2];
        // Project world pos to NDC via VP matrix
        const vp = cam.vp;
        const cx = vp[0]*px + vp[4]*py + vp[8]*pz  + vp[12];
        const cy = vp[1]*px + vp[5]*py + vp[9]*pz  + vp[13];
        const cw = vp[3]*px + vp[7]*py + vp[11]*pz + vp[15];
        if (cw <= 0) continue;
        const sx = ((cx / cw) * 0.5 + 0.5) * labelCanvas.width;
        const sy = ((1 - cy / cw) * 0.5) * labelCanvas.height;
        labelCtx.fillStyle = 'rgba(0,0,0,0.55)';
        const tw = labelCtx.measureText(meta.called).width;
        labelCtx.fillRect(sx - tw/2 - 4, sy - 14 * dpr, tw + 8, 18 * dpr);
        labelCtx.fillStyle = '#ddd';
        labelCtx.fillText(meta.called, sx, sy);
      }
    } else if (!showLabels) {
      labelCtx.clearRect(0, 0, labelCanvas.width, labelCanvas.height);
    }
  }

  requestAnimationFrame(frame);

  // ============================================================
  // MINT PANEL LOGIC
  // ============================================================
  const MINT_ABI = [
    "function create(string tokenName, string tokenDescription, bytes[] tokenArtifact, uint32 tokenRenderer, uint128 tokenData)",
    "function prepareArtifact(uint256 tokenId, bytes[] tokenArtifact, bool clear)",
    "function latestTokenId() view returns (uint256)",
    "function registerRenderer(address renderer) returns (uint256)",
    "function renderers(uint256) view returns (address)",
    "function mintOpenUntil(uint256 tokenId) view returns (uint256)",
  ];

  const mintPanel = document.getElementById('mint-panel');
  const btnMintToggle = document.getElementById('btn-mint-toggle');
  const btnWallet = document.getElementById('btn-wallet');
  const walletStatus = document.getElementById('wallet-status');
  const mintNameInput = document.getElementById('mint-name');
  const mintDesc = document.getElementById('mint-desc');
  const mintCmdDisplay = document.getElementById('mint-command-display');
  const btnCapture = document.getElementById('btn-capture');
  const mintPreviewImg = document.getElementById('mint-preview-img');
  const btnMint = document.getElementById('btn-mint');
  const mintStatusEl = document.getElementById('mint-status');
  const mintCollection = document.getElementById('mint-collection');
  const mintRendererIdx = document.getElementById('mint-renderer-idx');

  let mintSigner = null;
  let mintProvider = null;
  let capturedImageURI = null;

  // Toggle panel
  btnMintToggle.addEventListener('click', () => {
    const isOpen = mintPanel.classList.toggle('active');
    btnMintToggle.textContent = isOpen ? 'Mint \u25C2' : 'Mint \u25B8';
    if (isOpen) updateMintCommand();
  });

  function updateMintCommand() {
    // Prefer the literal command bar input (preserves repeat notation like (dR,23)).
    // Fall back to condensing the keystroke sequence for interactively built compositions.
    const display = mintCommandString ||
      executor.condenseCommandString(executor.commandTree.getCurrentCommandSequence().join(''));
    mintCmdDisplay.textContent = display || '(empty \u2014 build something first)';
    validateMintReady();
  }

  function validateMintReady() {
    const hasCmd = mintCmdDisplay.textContent && !mintCmdDisplay.textContent.startsWith('(empty');
    const hasName = mintNameInput.value.trim().length > 0;
    const hasImage = !!capturedImageURI;
    const hasWallet = !!mintSigner;
    const hasCollection = mintCollection.value.trim().length === 42;
    btnMint.disabled = !(hasCmd && hasName && hasImage && hasWallet && hasCollection);
  }

  mintNameInput.addEventListener('input', validateMintReady);
  mintDesc.addEventListener('input', validateMintReady);
  mintCollection.addEventListener('input', validateMintReady);

  // Wallet connection
  btnWallet.addEventListener('click', async () => {
    try {
      if (!window.ethereum) { walletStatus.textContent = 'No wallet found. Install MetaMask.'; return; }
      mintProvider = new ethers.BrowserProvider(window.ethereum);
      mintSigner = await mintProvider.getSigner();
      const addr = await mintSigner.getAddress();
      const network = await mintProvider.getNetwork();
      btnWallet.textContent = addr.slice(0,6) + '...' + addr.slice(-4);
      walletStatus.textContent = 'Connected on chain ' + network.chainId;
      document.getElementById('mint-chain-id').value = network.chainId.toString();
      validateMintReady();
    } catch (err) { walletStatus.textContent = 'Error: ' + err.message; }
  });

  // Preview capture — downsample to 512×512 JPEG to keep artifact small (~20-40KB)
  btnCapture.addEventListener('click', async () => {
    mintStatusEl.innerHTML = '<span class="info">Capturing preview...</span>';
    const wasShowUI = showUI;
    showUI = false;
    store.deselectAll();
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    try {
      const THUMB = 512;
      const offscreen = document.createElement('canvas');
      offscreen.width = THUMB; offscreen.height = THUMB;
      const ctx2d = offscreen.getContext('2d');
      // Draw canvas into square thumbnail (letterbox if needed)
      const src = canvas;
      const scale = Math.min(THUMB / src.width, THUMB / src.height);
      const w = src.width * scale, h = src.height * scale;
      const ox = (THUMB - w) / 2, oy = (THUMB - h) / 2;
      ctx2d.fillStyle = '#0a0a0c';
      ctx2d.fillRect(0, 0, THUMB, THUMB);
      ctx2d.drawImage(src, ox, oy, w, h);
      capturedImageURI = offscreen.toDataURL('image/jpeg', 0.85);
      mintPreviewImg.src = capturedImageURI;
      mintPreviewImg.style.display = 'block';
      const kb = Math.round(capturedImageURI.length * 0.75 / 1024);
      mintStatusEl.innerHTML = '<span class="success">Preview captured (~' + kb + ' KB).</span>';
    } catch (err) {
      mintStatusEl.innerHTML = '<span class="error">Capture failed: ' + err.message + '</span>';
    }
    showUI = wasShowUI;
    validateMintReady();
  });

  // Also update mint panel when Export is clicked
  const origExportHandler = btnExport.onclick;
  btnExport.addEventListener('click', () => {
    if (mintPanel.classList.contains('active')) setTimeout(updateMintCommand, 50);
  });

  // Mint token
  btnMint.addEventListener('click', async () => {
    if (!mintSigner || !capturedImageURI) return;
    const tokenName = mintNameInput.value.trim();
    const tokenDescription = mintDesc.value.trim();
    const commandStr = mintCommandString ||
      executor.condenseCommandString(executor.commandTree.getCurrentCommandSequence().join(''));
    const collectionAddr = mintCollection.value.trim();
    const rendererIdx = parseInt(mintRendererIdx.value) || 0;
    if (!tokenName || !commandStr || !collectionAddr) {
      mintStatusEl.innerHTML = '<span class="error">Fill in all required fields.</span>';
      return;
    }
    btnMint.disabled = true;
    mintStatusEl.innerHTML = '<span class="info">Encoding artifact...</span>';
    try {
      const abiCoder = new ethers.AbiCoder();
      const artifactHex = abiCoder.encode(['string', 'string'], [capturedImageURI, commandStr]);
      const mint = new ethers.Contract(collectionAddr, MINT_ABI, mintSigner);
      const MAX_CHUNK = 24000;
      const totalBytes = ethers.getBytes(artifactHex);
      const byteLength = totalBytes.length;
      mintStatusEl.innerHTML = '<span class="info">Artifact: ' + (byteLength / 1024).toFixed(1) + ' KB</span>';

      if (byteLength <= MAX_CHUNK) {
        mintStatusEl.innerHTML = '<span class="info">Sending create transaction...</span>';
        const tx = await mint.create(tokenName, tokenDescription, [artifactHex], rendererIdx, 0);
        mintStatusEl.innerHTML = '<span class="info">Tx: ' + tx.hash.slice(0,10) + '... confirming...</span>';
        await tx.wait();
        const tokenId = await mint.latestTokenId();
        mintStatusEl.innerHTML = '<span class="success">Minted! Token #' + tokenId + '<br>Tx: ' + tx.hash + '</span>';
      } else {
        const chunks = [];
        for (let i = 0; i < totalBytes.length; i += MAX_CHUNK) {
          chunks.push(ethers.hexlify(totalBytes.slice(i, i + MAX_CHUNK)));
        }
        const nextTokenId = (await mint.latestTokenId()) + 1n;
        mintStatusEl.innerHTML = '<span class="info">Large artifact (' + chunks.length + ' chunks). Preparing #' + nextTokenId + '...</span>';
        for (let i = 0; i < chunks.length; i++) {
          mintStatusEl.innerHTML = '<span class="info">Chunk ' + (i+1) + '/' + chunks.length + '...</span>';
          const tx = await mint.prepareArtifact(nextTokenId, [chunks[i]], i === 0);
          await tx.wait();
        }
        mintStatusEl.innerHTML = '<span class="info">Creating token...</span>';
        const tx = await mint.create(tokenName, tokenDescription, [], rendererIdx, 0);
        mintStatusEl.innerHTML = '<span class="info">Tx: ' + tx.hash.slice(0,10) + '... confirming...</span>';
        await tx.wait();
        const tokenId = await mint.latestTokenId();
        mintStatusEl.innerHTML = '<span class="success">Minted! Token #' + tokenId + '<br>Tx: ' + tx.hash + '</span>';
      }
    } catch (err) {
      console.error('Mint error:', err);
      let msg = err.message;
      if (err.reason) msg = err.reason;
      mintStatusEl.innerHTML = '<span class="error">' + msg + '</span>';
    }
    validateMintReady();
  });
}

main().catch(e => {
  console.error(e);
  document.getElementById('error-msg').style.display='block';
  document.getElementById('error-msg').textContent=e.message;
});
</script>
</body>
</html>
