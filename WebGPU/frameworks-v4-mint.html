<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Frameworks V4 — Step 4: Command String Replay (V3 Parity)</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0c; overflow: hidden; font-family: 'SF Mono', 'Fira Code', monospace; }
canvas { display: block; width: 100vw; height: 100vh; }

/* Command input bar */
#command-bar {
  position: fixed; top: 0; left: 0; right: 0; height: 40px;
  background: rgba(10,10,14,0.95); border-bottom: 1px solid #555;
  display: flex; align-items: center; padding: 0 12px; gap: 8px;
  pointer-events: all; z-index: 100;
}
#command-input {
  flex: 1; background: #222; color: #ddd; border: 1px solid #555;
  padding: 6px 10px; font-family: inherit; font-size: 12px;
}
#command-bar button {
  background: #333; color: #ccc; border: 1px solid #555; padding: 6px 12px;
  font-family: inherit; font-size: 11px; cursor: pointer;
}
#command-bar button:hover { background: #555; }
#command-bar label { color: #999; font-size: 11px; }

#hud {
  position: fixed; top: 40px; left: 0; right: 0; bottom: 0;
  pointer-events: none; color: #8888aa; font-size: 11px; line-height: 1.6;
}
#hud.hidden * { display: none !important; }
#hud.hidden #mode-display { display: block !important; }
#mode-display {
  position: absolute; top: 12px; left: 12px;
  background: rgba(10,10,14,0.85); padding: 6px 12px; border: 1px solid #333;
}
.mode { color: #ddd; font-size: 13px; font-weight: bold; }
#info-display {
  position: absolute; bottom: 12px; left: 12px;
  background: rgba(10,10,14,0.85); padding: 6px 12px; border: 1px solid #333;
}
#perf-display {
  position: absolute; bottom: 12px; right: 12px;
  background: rgba(10,10,14,0.85); padding: 6px 12px; border: 1px solid #333;
}
#error-msg {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  color: #ff6666; font-size: 16px; text-align: center; display: none;
}

/* Color palette overlay */
#palette-overlay {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(10,10,14,0.95); border: 2px solid #555; padding: 16px;
  display: none; pointer-events: none;
}
#palette-overlay.active { display: block; }
#palette-grid {
  display: grid; grid-template-columns: repeat(10, 24px); gap: 4px;
}
.palette-cell {
  width: 24px; height: 24px; border: 1px solid #333; cursor: pointer;
}
.palette-cell.current { border: 2px solid #fff; box-shadow: 0 0 8px rgba(255,255,255,0.6); }

/* Bracket input overlay */
#bracket-overlay {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(10,10,14,0.95); border: 2px solid #555; padding: 16px;
  display: none; pointer-events: all;
}
#bracket-overlay.active { display: block; }
#bracket-input {
  background: #222; color: #ddd; border: 1px solid #555; padding: 8px;
  font-family: inherit; font-size: 14px; width: 300px;
}

/* w/W content overlays */
#w-overlay, #W-overlay {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(10,10,14,0.95); border: 2px solid #555; padding: 16px;
  display: none; pointer-events: all; min-width: 340px;
}
#w-overlay.active, #W-overlay.active { display: block; }
#w-overlay label, #W-overlay label {
  display: block; color: #999; font-size: 12px; margin-bottom: 8px;
}
#w-input {
  background: #222; color: #ddd; border: 1px solid #555; padding: 8px;
  font-family: inherit; font-size: 14px; width: 100%;
}
#W-input {
  background: #222; color: #ddd; border: 1px solid #555; padding: 8px;
  font-family: inherit; font-size: 14px; width: 100%; height: 120px; resize: vertical;
}

/* / command overlay */
#slash-overlay {
  position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
  background: rgba(10,10,14,0.95); border: 1px solid #555; padding: 10px 12px;
  display: none; pointer-events: all; min-width: 400px; z-index: 200;
}
#slash-overlay.active { display: flex; gap: 8px; align-items: center; }
#slash-overlay label { color: #999; font-size: 11px; white-space: nowrap; }
#slash-input {
  flex: 1; background: #222; color: #ddd; border: 1px solid #555; padding: 6px 8px;
  font-family: inherit; font-size: 13px;
}

/* 2D label overlay canvas */
#label-canvas {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  pointer-events: none; z-index: 1;
}

/* Mint panel */
#mint-panel {
  position: fixed; top: 40px; right: 0; width: 340px; bottom: 0;
  background: rgba(10,10,14,0.97); border-left: 1px solid #444;
  padding: 16px; overflow-y: auto; z-index: 99;
  display: none; pointer-events: all;
}
#mint-panel.active { display: block; }
#mint-panel h3 { color: #ddd; font-size: 13px; margin: 0 0 12px 0; font-weight: 600; }
#mint-panel label { color: #999; font-size: 11px; display: block; margin: 10px 0 4px 0; }
#mint-panel input[type="text"],
#mint-panel textarea {
  width: 100%; background: #1a1a1e; color: #ddd; border: 1px solid #444;
  padding: 8px 10px; font-family: inherit; font-size: 12px; border-radius: 3px;
}
#mint-panel textarea { height: 60px; resize: vertical; }
#mint-panel .mint-row { display: flex; gap: 8px; margin-top: 8px; }
#mint-panel .mint-btn {
  flex: 1; background: #333; color: #ccc; border: 1px solid #555;
  padding: 8px 12px; font-family: inherit; font-size: 11px;
  cursor: pointer; border-radius: 3px; text-align: center;
}
#mint-panel .mint-btn:hover { background: #555; }
#mint-panel .mint-btn.primary { background: #2a5a2a; border-color: #4a8a4a; color: #cfc; }
#mint-panel .mint-btn.primary:hover { background: #3a7a3a; }
#mint-panel .mint-btn.primary:disabled { background: #1a2a1a; color: #666; cursor: not-allowed; }
#mint-panel .mint-btn.connect { background: #2a3a5a; border-color: #4a6a9a; color: #ccf; }
#mint-panel .mint-btn.connect:hover { background: #3a4a7a; }
#mint-status { color: #888; font-size: 11px; margin-top: 10px; line-height: 1.6; }
#mint-status .success { color: #6c6; }
#mint-status .error { color: #f66; }
#mint-status .info { color: #6af; }
#mint-preview-img {
  width: 100%; aspect-ratio: 1; background: #111; border: 1px solid #333;
  border-radius: 3px; margin-top: 6px; object-fit: contain; display: none;
}
#mint-command-display {
  background: #111; border: 1px solid #333; padding: 6px 8px;
  font-size: 10px; color: #8888aa; word-break: break-all;
  max-height: 60px; overflow-y: auto; border-radius: 3px; margin-top: 6px;
}
#mint-config {
  border-top: 1px solid #333; margin-top: 14px; padding-top: 10px;
}
#mint-config summary { color: #888; font-size: 11px; cursor: pointer; }
#mint-config summary:hover { color: #bbb; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<script>
// ============================================================
// FRAME STORE — Typed array backend from frame-store.js
// 64-byte per-instance layout
// ============================================================

const FLOATS_PER_INSTANCE = 16;
const BYTES_PER_INSTANCE = 64;

const F = {
    PX: 0,  PY: 1,  PZ: 2,  SCALE: 3,
    RX: 4,  RY: 5,  RZ: 6,
    UX: 8,  UY: 9,  UZ: 10,
    NX: 12, NY: 13, NZ: 14,
};

const U = {
    COLOR_INDEX: 7,
    FLAGS: 11,
    FRAME_ID: 15,
};

const FLAG_SELECTED = 1;
const FLAG_VISIBLE  = 2;

class FrameStore {
    constructor(initialCapacity = 4096) {
        this.count = 0;
        this.capacity = initialCapacity;
        this._frameIdCounter = 0;

        this.data = new ArrayBuffer(this.capacity * BYTES_PER_INSTANCE);
        this.f32 = new Float32Array(this.data);
        this.u32 = new Uint32Array(this.data);
        this.metadata = [];

        this._dirtyMin = Infinity;
        this._dirtyMax = 0;
        this._fullDirty = false;
    }

    _grow(needed) {
        while (this.capacity < needed) this.capacity *= 2;
        if (this.capacity > this.f32.length / FLOATS_PER_INSTANCE) {
            const oldBytes = this.data.byteLength;
            const newBuf = new ArrayBuffer(this.capacity * BYTES_PER_INSTANCE);
            new Uint8Array(newBuf).set(new Uint8Array(this.data, 0, oldBytes));
            this.data = newBuf;
            this.f32 = new Float32Array(this.data);
            this.u32 = new Uint32Array(this.data);
            this._fullDirty = true;
        }
    }

    _o(i) { return i * FLOATS_PER_INSTANCE; }
    _b(i) { return i * BYTES_PER_INSTANCE; }

    _markDirty(instanceIndex) {
        const lo = this._b(instanceIndex);
        const hi = lo + BYTES_PER_INSTANCE;
        if (lo < this._dirtyMin) this._dirtyMin = lo;
        if (hi > this._dirtyMax) this._dirtyMax = hi;
    }

    _markRangeDirty(startIdx, count) {
        const lo = this._b(startIdx);
        const hi = this._b(startIdx + count);
        if (lo < this._dirtyMin) this._dirtyMin = lo;
        if (hi > this._dirtyMax) this._dirtyMax = hi;
    }

    _markAllDirty() {
        this._fullDirty = true;
    }

    getDirtyRange() {
        if (this._fullDirty) {
            return { offset: 0, length: this.count * BYTES_PER_INSTANCE };
        }
        if (this._dirtyMin < this._dirtyMax) {
            return { offset: this._dirtyMin, length: this._dirtyMax - this._dirtyMin };
        }
        return null;
    }

    clearDirty() {
        this._dirtyMin = Infinity;
        this._dirtyMax = 0;
        this._fullDirty = false;
    }

    static basisFromNormal(nx, ny, nz) {
        const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
        if (len > 0.0001) { nx /= len; ny /= len; nz /= len; }

        if (Math.abs(nx) < 0.001 && Math.abs(ny) < 0.001 && Math.abs(nz - 1) < 0.001) {
            return { rx: 1, ry: 0, rz: 0, ux: 0, uy: 1, uz: 0 };
        }

        let refX, refY, refZ;
        const dotWithY = Math.abs(ny);
        if (dotWithY > 0.999) {
            refX = 1; refY = 0; refZ = 0;
        } else {
            refX = 0; refY = 1; refZ = 0;
        }

        let rx = refY * nz - refZ * ny;
        let ry = refZ * nx - refX * nz;
        let rz = refX * ny - refY * nx;
        const rLen = Math.sqrt(rx * rx + ry * ry + rz * rz);
        if (rLen > 0.0001) { rx /= rLen; ry /= rLen; rz /= rLen; }

        let ux = ny * rz - nz * ry;
        let uy = nz * rx - nx * rz;
        let uz = nx * ry - ny * rx;
        const uLen = Math.sqrt(ux * ux + uy * uy + uz * uz);
        if (uLen > 0.0001) { ux /= uLen; uy /= uLen; uz /= uLen; }

        return { rx, ry, rz, ux, uy, uz };
    }

    addFrame(x, y, z, nx, ny, nz, scale, colorIndex) {
        const i = this.count++;
        this._grow(this.count);
        const o = this._o(i);

        this.f32[o + F.PX] = x;
        this.f32[o + F.PY] = y;
        this.f32[o + F.PZ] = z;
        this.f32[o + F.SCALE] = scale ?? 2;

        const basis = FrameStore.basisFromNormal(nx, ny, nz);
        this.f32[o + F.RX] = basis.rx;
        this.f32[o + F.RY] = basis.ry;
        this.f32[o + F.RZ] = basis.rz;
        this.f32[o + F.UX] = basis.ux;
        this.f32[o + F.UY] = basis.uy;
        this.f32[o + F.UZ] = basis.uz;

        const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
        this.f32[o + F.NX] = len > 0.0001 ? nx / len : 0;
        this.f32[o + F.NY] = len > 0.0001 ? ny / len : 0;
        this.f32[o + F.NZ] = len > 0.0001 ? nz / len : 1;

        this.u32[o + U.COLOR_INDEX] = colorIndex ?? 0;
        this.u32[o + U.FLAGS] = FLAG_SELECTED | FLAG_VISIBLE;
        this.u32[o + U.FRAME_ID] = this._frameIdCounter++;

        this.metadata[i] = { called: '', contents: '', contexts: [], components: [] };
        this._markDirty(i);
        return i;
    }

    addBulk(n, positionFn, colorFn, normalFn) {
        const start = this.count;
        this.count += n;
        this._grow(this.count);
        for (let i = 0; i < n; i++) {
            const idx = start + i;
            const o = this._o(idx);
            const pos = positionFn(i);
            const norm = normalFn ? normalFn(i) : [0, 0, 1];
            const basis = FrameStore.basisFromNormal(norm[0], norm[1], norm[2]);

            this.f32[o + F.PX] = pos[0];
            this.f32[o + F.PY] = pos[1];
            this.f32[o + F.PZ] = pos[2];
            this.f32[o + F.SCALE] = 2;
            this.f32[o + F.RX] = basis.rx; this.f32[o + F.RY] = basis.ry; this.f32[o + F.RZ] = basis.rz;
            this.f32[o + F.UX] = basis.ux; this.f32[o + F.UY] = basis.uy; this.f32[o + F.UZ] = basis.uz;
            this.f32[o + F.NX] = norm[0];  this.f32[o + F.NY] = norm[1];  this.f32[o + F.NZ] = norm[2];
            this.u32[o + U.COLOR_INDEX] = colorFn ? colorFn(i) : (i % 80);
            this.u32[o + U.FLAGS] = FLAG_VISIBLE;
            this.u32[o + U.FRAME_ID] = this._frameIdCounter++;
            this.metadata[idx] = { called: '', contents: '', contexts: [], components: [] };
        }
        this._markRangeDirty(start, n);
    }

    clear() {
        this.count = 0;
        this._frameIdCounter = 0;
        this.metadata = [];
        this._markAllDirty();
    }

    deselectAll() {
        for (let i = 0; i < this.count; i++) {
            this.u32[this._o(i) + U.FLAGS] &= ~FLAG_SELECTED;
        }
        this._markRangeDirty(0, this.count);
    }

    selectAll() {
        for (let i = 0; i < this.count; i++) {
            this.u32[this._o(i) + U.FLAGS] |= FLAG_SELECTED;
        }
        this._markRangeDirty(0, this.count);
    }

    getSelectedCount() {
        let n = 0;
        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) n++;
        }
        return n;
    }

    getFrameId(i) {
        return this.u32[this._o(i) + U.FRAME_ID];
    }

    isSelected(i) {
        return !!(this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED);
    }

    setSelected(i, selected) {
        if (selected) {
            this.u32[this._o(i) + U.FLAGS] |= FLAG_SELECTED;
        } else {
            this.u32[this._o(i) + U.FLAGS] &= ~FLAG_SELECTED;
        }
        this._markDirty(i);
    }

    getColorIndex(i) {
        return this.u32[this._o(i) + U.COLOR_INDEX];
    }

    setColorIndex(i, colorIndex) {
        this.u32[this._o(i) + U.COLOR_INDEX] = colorIndex;
        this._markDirty(i);
    }

    shiftSelectedColors(shift, paletteSize = 80) {
        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) {
                const oldIdx = this.u32[this._o(i) + U.COLOR_INDEX];
                let newIdx = (oldIdx + shift) % paletteSize;
                if (newIdx < 0) newIdx += paletteSize;
                this.u32[this._o(i) + U.COLOR_INDEX] = newIdx;
                this._markDirty(i);
            }
        }
    }

    animateAllColors(step, cols = 8, paletteSize = 80) {
        for (let i = 0; i < this.count; i++) {
            const o = this._o(i) + U.COLOR_INDEX;
            this.u32[o] = (this.u32[o] + step + paletteSize) % paletteSize;
            this._markDirty(i);
        }
    }

    translate(i, dx, dy, dz) {
        const o = this._o(i);
        this.f32[o + F.PX] += dx;
        this.f32[o + F.PY] += dy;
        this.f32[o + F.PZ] += dz;
        this._markDirty(i);
    }

    translateSelected(dx, dy, dz) {
        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) {
                this.translate(i, dx, dy, dz);
            }
        }
    }

    rotateFrame(i, cx, cy, cz, angle, axis) {
        const o = this._o(i);
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);

        const dx = this.f32[o + F.PX] - cx;
        const dy = this.f32[o + F.PY] - cy;
        const dz = this.f32[o + F.PZ] - cz;

        let px, py, pz;
        switch (axis) {
            case 'x': px = dx;                    py = dy*cos - dz*sin;  pz = dy*sin + dz*cos;  break;
            case 'y': px = dx*cos + dz*sin;       py = dy;               pz = -dx*sin + dz*cos; break;
            case 'z': px = dx*cos - dy*sin;        py = dx*sin + dy*cos;  pz = dz;               break;
        }
        this.f32[o + F.PX] = cx + px;
        this.f32[o + F.PY] = cy + py;
        this.f32[o + F.PZ] = cz + pz;

        const rx = this.f32[o + F.RX], ry = this.f32[o + F.RY], rz = this.f32[o + F.RZ];
        switch (axis) {
            case 'x': this.f32[o+F.RX] = rx;           this.f32[o+F.RY] = ry*cos - rz*sin; this.f32[o+F.RZ] = ry*sin + rz*cos; break;
            case 'y': this.f32[o+F.RX] = rx*cos+rz*sin; this.f32[o+F.RY] = ry;              this.f32[o+F.RZ] = -rx*sin+rz*cos;  break;
            case 'z': this.f32[o+F.RX] = rx*cos-ry*sin; this.f32[o+F.RY] = rx*sin+ry*cos;   this.f32[o+F.RZ] = rz;              break;
        }

        const ux = this.f32[o + F.UX], uy = this.f32[o + F.UY], uz = this.f32[o + F.UZ];
        switch (axis) {
            case 'x': this.f32[o+F.UX] = ux;           this.f32[o+F.UY] = uy*cos - uz*sin; this.f32[o+F.UZ] = uy*sin + uz*cos; break;
            case 'y': this.f32[o+F.UX] = ux*cos+uz*sin; this.f32[o+F.UY] = uy;              this.f32[o+F.UZ] = -ux*sin+uz*cos;  break;
            case 'z': this.f32[o+F.UX] = ux*cos-uy*sin; this.f32[o+F.UY] = ux*sin+uy*cos;   this.f32[o+F.UZ] = uz;              break;
        }

        const savedO = this._o(lo - 1);
        for (let j = 0; j < FLOATS_PER_INSTANCE; j++) savedData[j] = this.u32[savedO + j];
        const savedMeta = this.metadata[lo - 1];

        let minX = Infinity, maxX = -Infinity;
        let minY = Infinity, maxY = -Infinity;
        let minZ = Infinity, maxZ = -Infinity;

        for (let i = 0; i < this.count; i++) {
            const o = this._o(i);

            const x = this.f32[o], y = this.f32[o+1], z = this.f32[o+2];

            if (x + hs > maxX) maxX = x + hs;
            if (y - hs < minY) minY = y - hs;
            if (y + hs > maxY) maxY = y + hs;
            if (z - hs < minZ) minZ = z - hs;
            if (z + hs > maxZ) maxZ = z + hs;
        }
        return {
            minX, maxX, minY, maxY, minZ, maxZ,
            centerX: (minX+maxX)/2, centerY: (minY+maxY)/2, centerZ: (minZ+maxZ)/2,
        };
    }

    setCalledSelected(text) {
        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) {

    setContentsSelected(text) {
        for (let i = 0; i < this.count; i++) {

        let targetColor = null;
        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) {
                targetColor = this.u32[this._o(i) + U.COLOR_INDEX];
                break;
            }
        }
        if (targetColor === null) return;

        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.COLOR_INDEX] === targetColor) {
                this.u32[this._o(i) + U.FLAGS] |= FLAG_SELECTED;
            }
        }
        this._markRangeDirty(0, this.count);
    }

    // Snapshot for round-trip testing
    getSnapshot() {
        const snapshot = [];
        for (let i = 0; i < this.count; i++) {
            const o = this._o(i);
            snapshot.push({
                px: this.f32[o + F.PX],
                py: this.f32[o + F.PY],
                pz: this.f32[o + F.PZ],
                scale: this.f32[o + F.SCALE],
                rx: this.f32[o + F.RX],
                ry: this.f32[o + F.RY],
                rz: this.f32[o + F.RZ],
                ux: this.f32[o + F.UX],
                uy: this.f32[o + F.UY],
                uz: this.f32[o + F.UZ],
                nx: this.f32[o + F.NX],
                ny: this.f32[o + F.NY],
                nz: this.f32[o + F.NZ],
                colorIdx: this.u32[o + U.COLOR_INDEX],
                flags: this.u32[o + U.FLAGS],
                frameId: this.u32[o + U.FRAME_ID],
            });
        }
        return snapshot;
    }
}

        this.active = false;

            case 'i': this.currentIndex = (this.currentIndex - this.cols + 80) % 80; break;

            case 'j': this.currentIndex = (this.currentIndex - 1 + 80) % 80; break;
            case 'l': this.currentIndex = (this.currentIndex + 1) % 80; break;

    }

        this.store.shiftSelectedColors(shift, 80);
        this.palette.currentIndex = this.currentIndex;

    updateUI() {
        const cells = document.querySelectorAll('.palette-cell');
        cells.forEach((cell, i) => {
            if (i === this.currentIndex) {
                cell.classList.add('current');

                cell.classList.remove('current');
            }

    constructor(camera) {

        this.autoOrbit = false;
        this.autoOrbitPaused = false;
        this.orbitVelocityTheta = 0;
        this.orbitVelocityPhi = 0;

        this.active = true;
    }

    exit() {
        this.active = false;
        // autoOrbit intentionally not stopped — rotation persists after leaving camera context
    }

    selectView(num) {
        this.currentView = num;
        const cam = this.camera;
        const zoom = cam.dist;

        switch(num) {
            case 0: // Auto-rotate mode — enter paused, ijkl sets direction, 0 toggles
                if (this.autoOrbit) {
                    this.autoOrbitPaused = !this.autoOrbitPaused;
                } else {
                    this.autoOrbit = true;
                    this.autoOrbitPaused = true; // wait for ijkl before moving
                    this.orbitTheta = cam.theta;
                    this.orbitPhi = cam.phi;
                    this.orbitVelocityTheta = 0;
                    this.orbitVelocityPhi = 0;
                }
                break;

            case 1: // Front (looking from +Z)
                this.autoOrbit = false;
                cam.theta = 0;
                cam.phi = 0;
                cam.dist = zoom;
                cam.invalidate();
                console.log('Front view');
                break;

            case 2: // Right (looking from +X)
                this.autoOrbit = false;
                cam.theta = Math.PI / 2;
                cam.phi = 0;
                cam.dist = zoom;
                cam.invalidate();
                console.log('Right view');
                break;

            case 3: // Back (looking from -Z)
                this.autoOrbit = false;
                cam.theta = Math.PI;
                cam.phi = 0;
                cam.dist = zoom;
                cam.invalidate();
                console.log('Back view');
                break;

            case 4: // Left (looking from -X)
                this.autoOrbit = false;
                cam.theta = -Math.PI / 2;
                cam.phi = 0;
                cam.dist = zoom;
                cam.invalidate();
                console.log('Left view');
                break;

            case 5: // Top (looking from +Y)
                this.autoOrbit = false;
                cam.theta = 0;
                cam.phi = Math.PI / 2 - 0.01; // Slightly below vertical to avoid gimbal lock
                cam.dist = zoom;
                cam.invalidate();
                console.log('Top view');
                break;

            case 6: // Bottom (looking from -Y)
                this.autoOrbit = false;
                cam.theta = 0;
                cam.phi = -Math.PI / 2 + 0.01; // Slightly above vertical to avoid gimbal lock
                cam.dist = zoom;
                cam.invalidate();
                console.log('Bottom view');
                break;

            case 7: // Isometric (45° angles)
                this.autoOrbit = false;
                cam.theta = Math.PI / 4;
                cam.phi = Math.atan(1 / Math.sqrt(2)); // ~35.26° - true isometric angle
                cam.dist = zoom;
                cam.invalidate();
                console.log('Isometric view');
                break;

            case 8: // Auto-orbit mode (smooth rotation with IJKL control)
                this.autoOrbit = true;
                this.orbitTheta = cam.theta;
                this.orbitPhi = cam.phi;
                this.orbitVelocityTheta = 0;
                this.orbitVelocityPhi = 0;
                console.log('Auto-orbit mode (use IJKL to control rotation)');
                break;

            case 9: // Toggle orthographic/perspective
                this.orthographic = !this.orthographic;
                console.log(this.orthographic ? 'Orthographic projection' : 'Perspective projection');
                // Note: WebGPU implementation doesn't have ortho yet, this is a placeholder
                break;
        }
    }

    navigate(key, shift = false) {
        const cam = this.camera;

        // Auto-rotate mode: ijkl adjust velocity and unpause
        if (this.autoOrbit) {
            const step = 0.3;
            switch(key) {
                case 'l': this.orbitVelocityTheta += step; this.autoOrbitPaused = false; return true;
                case 'j': this.orbitVelocityTheta -= step; this.autoOrbitPaused = false; return true;
                case 'i': this.orbitVelocityPhi   += step; this.autoOrbitPaused = false; return true;
                case 'k': this.orbitVelocityPhi   -= step; this.autoOrbitPaused = false; return true;
            }
            return false;
        }

        // Normal mode: zoom and FOV controls
        // Lowercase = single step, Uppercase = double step
        const DEG5  = 5  * Math.PI / 180;
        const DEG10 = 10 * Math.PI / 180;
        const FOV_MIN = 5  * Math.PI / 180;
        const FOV_MAX = 170 * Math.PI / 180;
        switch (key) {
            case 'i': cam.dist *= 0.9;  cam.invalidate(); break; // zoom in
            case 'I': cam.dist *= 0.5;  cam.invalidate(); break; // zoom in 2×
            case 'k': cam.dist *= 1.1;  cam.invalidate(); break; // zoom out
            case 'K': cam.dist *= 2.0;  cam.invalidate(); break; // zoom out 2×
            case 'j': this.fov = Math.min(this.fov + DEG5,  FOV_MAX); break; // widen 5°
            case 'J': this.fov = Math.min(this.fov + DEG10, FOV_MAX); break; // widen 10°
            case 'l': this.fov = Math.max(this.fov - DEG5,  FOV_MIN); break; // narrow 5°
            case 'L': this.fov = Math.max(this.fov - DEG10, FOV_MIN); break; // narrow 10°
        }
    }

    updateAutoOrbit(deltaTime) {
        if (!this.autoOrbit || this.autoOrbitPaused) return;

        this.orbitTheta += this.orbitVelocityTheta * deltaTime;
        this.orbitPhi   += this.orbitVelocityPhi   * deltaTime;

        this.camera.theta = this.orbitTheta;
        this.camera.phi   = this.orbitPhi;
        this.camera.invalidate();
    }
}

class CommandTree {
    constructor() {
        this.history = [[]];
        this.branchIndex = 0;
        this.positionInBranch = 0;
        this.inCommandContext = false;
    }

    addCommand(cmd) {
        if (this.inCommandContext) return;

        const currentBranch = this.history[this.branchIndex];

        if (this.positionInBranch < currentBranch.length) {
            const newBranch = currentBranch.slice(0, this.positionInBranch);
            newBranch.push(cmd);
            this.history.push(newBranch);
            this.branchIndex = this.history.length - 1;
            this.positionInBranch = newBranch.length;
        } else {
            currentBranch.push(cmd);
            this.positionInBranch = currentBranch.length;
        }
    }

    moveBack() {
        if (this.positionInBranch > 0) {
            this.positionInBranch--;
        }
    }

    moveForward() {
        const currentBranch = this.history[this.branchIndex];
        if (this.positionInBranch < currentBranch.length) {
            this.positionInBranch++;
        }
    }

    moveUp() {
        if (this.branchIndex > 0) {
            this.branchIndex--;
            const newBranch = this.history[this.branchIndex];
            this.positionInBranch = Math.min(this.positionInBranch, newBranch.length);
        }
    }

    moveDown() {
        if (this.branchIndex < this.history.length - 1) {
            this.branchIndex++;
            const newBranch = this.history[this.branchIndex];
            this.positionInBranch = Math.min(this.positionInBranch, newBranch.length);
        }
    }

    peekNextCommand() {
        const currentBranch = this.history[this.branchIndex];
        if (this.positionInBranch < currentBranch.length) {
            return currentBranch[this.positionInBranch];
        }
        return null;
    }

    getCurrentCommandSequence() {
        const currentBranch = this.history[this.branchIndex];
        return currentBranch.slice(0, this.positionInBranch);
    }

    enterCommandContext() {
        this.inCommandContext = true;
    }

    exitCommandContext() {
        this.inCommandContext = false;
    }
}

            if (now - this.animationLastTime > this.animationInterval) {
                this.animationLastTime = now;
            }
        }
    }

    handleTranslate(key) {
        const step = this.gridSize;
        const view = this.currentView;
        let dx = 0, dy = 0, dz = 0;

        switch (view) {
            case 0:
            case 1:
                if (key === 'i') dy = step;
                else if (key === 'k') dy = -step;
                else if (key === 'j') dx = -step;
                else if (key === 'l') dx = step;
                break;
            case 2:
                if (key === 'i') dy = step;
                else if (key === 'k') dy = -step;
                else if (key === 'j') dz = step;
                else if (key === 'l') dz = -step;
                break;
            case 3:
                if (key === 'i') dy = step;
                else if (key === 'k') dy = -step;
                else if (key === 'j') dx = step;
                else if (key === 'l') dx = -step;
                break;
            case 4:
                if (key === 'i') dy = step;
                else if (key === 'k') dy = -step;
                else if (key === 'j') dz = -step;
                else if (key === 'l') dz = step;
                break;
            case 5:
                if (key === 'i') dz = -step;
                else if (key === 'k') dz = step;
                else if (key === 'j') dx = -step;
                else if (key === 'l') dx = step;
                break;
            case 6:
                if (key === 'i') dz = step;
                else if (key === 'k') dz = -step;
                else if (key === 'j') dx = -step;
                else if (key === 'l') dx = step;
                break;
            default:
                return;
        }

        this.store.translateSelected(dx, dy, dz);
    }

    handleTranslateCursor(key) {
        const step = this.gridSize;
        const view = this.currentView;
        let dx = 0, dy = 0, dz = 0;

        switch (view) {
            case 0:
            case 1:
                if (key === 'i') dy = step;
                else if (key === 'k') dy = -step;
                else if (key === 'j') dx = -step;
                else if (key === 'l') dx = step;
                break;
            case 2:
                if (key === 'i') dy = step;
                else if (key === 'k') dy = -step;
                else if (key === 'j') dz = step;
                else if (key === 'l') dz = -step;
                break;
            case 3:
                if (key === 'i') dy = step;
                else if (key === 'k') dy = -step;
                else if (key === 'j') dx = step;
                else if (key === 'l') dx = -step;
                break;
            case 4:
                if (key === 'i') dy = step;
                else if (key === 'k') dy = -step;
                else if (key === 'j') dz = -step;
                else if (key === 'l') dz = step;
                break;
            case 5:
                if (key === 'i') dz = -step;
                else if (key === 'k') dz = step;
                else if (key === 'j') dx = -step;
                else if (key === 'l') dx = step;
                break;
            case 6:
                if (key === 'i') dz = step;
                else if (key === 'k') dz = -step;
                else if (key === 'j') dx = -step;
                else if (key === 'l') dx = step;
                break;
            default:
                return;
        }

        this.cursor.x += dx;
        this.cursor.y += dy;
        this.cursor.z += dz;
    }

    createFrame() {
        const colorIndex = this.palette.getNextColor();

        let nx, ny, nz;
        switch (this.currentView) {
            case 0:
            case 1:
                nx = 0; ny = 0; nz = 1;
                break;
            case 2:
                nx = 1; ny = 0; nz = 0;
                break;
            case 3:
                nx = 0; ny = 0; nz = -1;
                break;
            case 4:
                nx = -1; ny = 0; nz = 0;
                break;
            case 5:
                nx = 0; ny = 1; nz = 0;
                break;
            case 6:
                nx = 0; ny = -1; nz = 0;
                break;
            default:
                nx = 0; ny = 0; nz = 1;
        }

        this.store.deselectAll();
        this.store.addFrame(
            this.cursor.x, this.cursor.y, this.cursor.z,
            nx, ny, nz,
            2.0,
            colorIndex
        );
    }

    duplicateSelected() {
        this.store.duplicateSelected();
    }

    deleteSelected() {
        this.store.deleteSelected();
    }

    rotateSelected(angle) {
        this.store.rotateSelected(this.cursor.x, this.cursor.y, this.cursor.z, angle, this.currentView);
    }

    reflectSelectedH() {
        this.store.reflectSelectedH(this.cursor.x, this.cursor.y, this.cursor.z, this.currentView);
    }

    reflectSelectedV() {
        this.store.reflectSelectedV(this.cursor.x, this.cursor.y, this.cursor.z, this.currentView);
    }

    handleScale(key) {
        // i/k: additive +/-2, floor 2  |  I/K: ×2/÷2, floor 0.25  |  j/l: line ext shorter/longer
        const extStep = 0.25;
        switch (key) {
            case 'i': this.store.scaleSelectedAdd(2, 2);       break;
            case 'k': this.store.scaleSelectedAdd(-2, 2);      break;
            case 'I': this.store.scaleSelectedClamp(2, 0.25);  break;
            case 'K': this.store.scaleSelectedClamp(0.5, 0.25); break;
            case 'j': this.lineExt = Math.max(0,   this.lineExt - extStep);
                      if (this.gpuLineUpdate) this.gpuLineUpdate(this.lineHW, this.lineExt); break;
            case 'l': this.lineExt = Math.min(8.0, this.lineExt + extStep);
                      if (this.gpuLineUpdate) this.gpuLineUpdate(this.lineHW, this.lineExt); break;
        }
    }

    handleScaleSelection(key) {
        // i/k: ×1.1/×0.9 (existing)  |  I/K: ×2/÷2  |  j/l: line thickness thinner/thicker
        const hwStep = 0.004;
        switch (key) {
            case 'i': this.store.scaleSelectionGroup(1.1); break;
            case 'k': this.store.scaleSelectionGroup(0.9); break;
            case 'I': this.store.scaleSelectionGroup(2);   break;
            case 'K': this.store.scaleSelectionGroup(0.5); break;
            case 'j': this.lineHW = Math.max(0.002, this.lineHW - hwStep);
                      if (this.gpuLineUpdate) this.gpuLineUpdate(this.lineHW, this.lineExt); break;
            case 'l': this.lineHW = Math.min(0.15,  this.lineHW + hwStep);
                      if (this.gpuLineUpdate) this.gpuLineUpdate(this.lineHW, this.lineExt); break;
        }
    }

    selectAllOfColor() {
        this.store.selectAllOfColor();
    }

    snapSelectionToCursor() {
        this.store.snapSelectionToCursor(this.cursor.x, this.cursor.y, this.cursor.z);
    }

    centerStructureToCursor() {
        this.store.centerStructureToCursor(this.cursor.x, this.cursor.y, this.cursor.z);
    }

    getCornerCoordinates(cornerIndex) {
        const bbox = this.store.getBoundingBox();
        const view = this.currentView;
        const corners = [];

        switch (view) {
            case 0:
            case 1:
                corners[0] = {x: bbox.maxX, y: bbox.maxY, z: bbox.maxZ};
                corners[1] = {x: bbox.minX, y: bbox.maxY, z: bbox.maxZ};
                corners[2] = {x: bbox.minX, y: bbox.minY, z: bbox.maxZ};
                corners[3] = {x: bbox.maxX, y: bbox.minY, z: bbox.maxZ};
                corners[4] = {x: bbox.maxX, y: bbox.maxY, z: bbox.minZ};
                corners[5] = {x: bbox.minX, y: bbox.maxY, z: bbox.minZ};
                corners[6] = {x: bbox.minX, y: bbox.minY, z: bbox.minZ};
                corners[7] = {x: bbox.maxX, y: bbox.minY, z: bbox.minZ};
                break;

            case 2:
                corners[0] = {x: bbox.maxX, y: bbox.maxY, z: bbox.minZ};
                corners[1] = {x: bbox.maxX, y: bbox.maxY, z: bbox.maxZ};
                corners[2] = {x: bbox.maxX, y: bbox.minY, z: bbox.maxZ};
                corners[3] = {x: bbox.maxX, y: bbox.minY, z: bbox.minZ};
                corners[4] = {x: bbox.minX, y: bbox.maxY, z: bbox.minZ};
                corners[5] = {x: bbox.minX, y: bbox.maxY, z: bbox.maxZ};
                corners[6] = {x: bbox.minX, y: bbox.minY, z: bbox.maxZ};
                corners[7] = {x: bbox.minX, y: bbox.minY, z: bbox.minZ};
                break;

            case 3:
                corners[0] = {x: bbox.minX, y: bbox.maxY, z: bbox.minZ};
                corners[1] = {x: bbox.maxX, y: bbox.maxY, z: bbox.minZ};
                corners[2] = {x: bbox.maxX, y: bbox.minY, z: bbox.minZ};
                corners[3] = {x: bbox.minX, y: bbox.minY, z: bbox.minZ};
                corners[4] = {x: bbox.minX, y: bbox.maxY, z: bbox.maxZ};
                corners[5] = {x: bbox.maxX, y: bbox.maxY, z: bbox.maxZ};
                corners[6] = {x: bbox.maxX, y: bbox.minY, z: bbox.maxZ};
                corners[7] = {x: bbox.minX, y: bbox.minY, z: bbox.maxZ};
                break;

            case 4:
                corners[0] = {x: bbox.minX, y: bbox.maxY, z: bbox.maxZ};
                corners[1] = {x: bbox.minX, y: bbox.maxY, z: bbox.minZ};
                corners[2] = {x: bbox.minX, y: bbox.minY, z: bbox.minZ};
                corners[3] = {x: bbox.minX, y: bbox.minY, z: bbox.maxZ};
                corners[4] = {x: bbox.maxX, y: bbox.maxY, z: bbox.maxZ};
                corners[5] = {x: bbox.maxX, y: bbox.maxY, z: bbox.minZ};
                corners[6] = {x: bbox.maxX, y: bbox.minY, z: bbox.minZ};
                corners[7] = {x: bbox.maxX, y: bbox.minY, z: bbox.maxZ};
                break;

            case 5:
                corners[0] = {x: bbox.maxX, y: bbox.maxY, z: bbox.minZ};
                corners[1] = {x: bbox.minX, y: bbox.maxY, z: bbox.minZ};
                corners[2] = {x: bbox.minX, y: bbox.maxY, z: bbox.maxZ};
                corners[3] = {x: bbox.maxX, y: bbox.maxY, z: bbox.maxZ};
                corners[4] = {x: bbox.maxX, y: bbox.minY, z: bbox.minZ};
                corners[5] = {x: bbox.minX, y: bbox.minY, z: bbox.minZ};
                corners[6] = {x: bbox.minX, y: bbox.minY, z: bbox.maxZ};
                corners[7] = {x: bbox.maxX, y: bbox.minY, z: bbox.maxZ};
                break;

            case 6:
                corners[0] = {x: bbox.maxX, y: bbox.minY, z: bbox.maxZ};
                corners[1] = {x: bbox.minX, y: bbox.minY, z: bbox.maxZ};
                corners[2] = {x: bbox.minX, y: bbox.minY, z: bbox.minZ};
                corners[3] = {x: bbox.maxX, y: bbox.minY, z: bbox.minZ};
                corners[4] = {x: bbox.maxX, y: bbox.maxY, z: bbox.maxZ};
                corners[5] = {x: bbox.minX, y: bbox.maxY, z: bbox.maxZ};
                corners[6] = {x: bbox.minX, y: bbox.maxY, z: bbox.minZ};
                corners[7] = {x: bbox.maxX, y: bbox.maxY, z: bbox.minZ};
                break;
        }

        return corners[cornerIndex % 8];
    }

    cycleCorner() {
        if (this.store.count === 0) return;

        const corner = this.getCornerCoordinates(this.cornerIndex);
        this.cursor.x = corner.x;
        this.cursor.y = corner.y;
        this.cursor.z = corner.z;

        this.cornerIndex = (this.cornerIndex + 1) % 8;
    }

    openWriteOverlay(key) {
        const isW = key === 'w';
        const overlayId = isW ? 'w-overlay' : 'W-overlay';
        const inputId   = isW ? 'w-input'   : 'W-input';
        const overlay = document.getElementById(overlayId);
        const input   = document.getElementById(inputId);

        // Pre-fill from first selected frame
        let prefill = '';
        for (let i = 0; i < this.store.count; i++) {
            if (this.store.isSelected(i)) {
                prefill = isW ? this.store.metadata[i].called : this.store.metadata[i].contents;
                break;
            }
        }
        overlay.classList.add('active');
        // Defer focus so the triggering keypress ('w'/'W') doesn't land in the input
        setTimeout(() => {
            input.value = prefill;
            input.focus();
            input.select();
        }, 0);

        const submit = () => {
            const text = input.value;
            overlay.classList.remove('active');
            if (isW) {
                this.store.setCalledSelected(text);
            } else {
                this.store.setContentsSelected(text);
            }
            // Record as w[text] or W[text] in command string
            const encoded = key + '[' + text + ']';
            this.commandTree.addCommand(encoded);
            cleanup();
        };

        const cancel = () => {
            overlay.classList.remove('active');
            cleanup();
        };

        const onKey = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
            else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
        };

        const cleanup = () => input.removeEventListener('keydown', onKey);
        input.addEventListener('keydown', onKey);
    }

    resetAll() {
        this.cursor.x = 0; this.cursor.y = 0; this.cursor.z = 0;
        this.mode = 'normal';
        this.cornerIndex = 0;
        this.animationActive = false;
        this.lineHW  = 0.018;
        this.lineExt = 0.125;
        if (this.gpuLineUpdate) this.gpuLineUpdate(this.lineHW, this.lineExt);
        if (this.colorContext.active)     this.colorContext.exit();
        if (this.cameraContext.active)    this.cameraContext.exit();
        if (this.selectionContext.active) this.selectionContext.exit();
        const cam = this.camera;
        cam.theta = Math.PI / 4; cam.phi = Math.PI / 6; cam.dist = 30;
        cam.target = [0, 0, 0];
        cam.invalidate();
    }

    applyWrite(key, text) {
        if (key === 'w') {
            this.store.setCalledSelected(text);
            if (text && this.onNameWritten) this.onNameWritten();
        } else {
            this.store.setContentsSelected(text);
        }
    }
}

// MATH

const { PI, sin, cos, tan, sqrt, abs, max, min, floor, ceil, random } = Math;
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

function mat4Perspective(out, fov, aspect, near, far) {
  const f = 1 / tan(fov / 2), nf = 1 / (near - far);
  out[0]=f/aspect; out[1]=0; out[2]=0; out[3]=0;
  out[4]=0; out[5]=f; out[6]=0; out[7]=0;
  out[8]=0; out[9]=0; out[10]=(far+near)*nf; out[11]=-1;
  out[12]=0; out[13]=0; out[14]=2*far*near*nf; out[15]=0;
}

function mat4LookAt(out, eye, tgt, up) {
  let zx=eye[0]-tgt[0], zy=eye[1]-tgt[1], zz=eye[2]-tgt[2];
  let len=sqrt(zx*zx+zy*zy+zz*zz);
  if(len>0){zx/=len;zy/=len;zz/=len;}
  let xx=up[1]*zz-up[2]*zy, xy=up[2]*zx-up[0]*zz, xz=up[0]*zy-up[1]*zx;
  len=sqrt(xx*xx+xy*xy+xz*xz);
  if(len>0){xx/=len;xy/=len;xz/=len;}
  const yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
  out[0]=xx; out[1]=yx; out[2]=zx; out[3]=0;
  out[4]=xy; out[5]=yy; out[6]=zy; out[7]=0;
  out[8]=xz; out[9]=yz; out[10]=zz; out[11]=0;
  out[12]=-(xx*eye[0]+xy*eye[1]+xz*eye[2]);
  out[13]=-(yx*eye[0]+yy*eye[1]+yz*eye[2]);
  out[14]=-(zx*eye[0]+zy*eye[1]+zz*eye[2]);
  out[15]=1;
}

function mat4Mul(out, a, b) {
  for(let i=0;i<4;i++) for(let j=0;j<4;j++)
    out[j*4+i]=a[i]*b[j*4]+a[4+i]*b[j*4+1]+a[8+i]*b[j*4+2]+a[12+i]*b[j*4+3];
}

function buildPalette() {

    '9AD9FB', 'A4C8EE', '60B1F4', '2480BD', '4576D0', '3263D0', '2E4985', '25438C',
    '525EAA', '3D43B3', '322F92', '4A2387', '371471', '3B088C', '6C31D7', '9741DA'
  ];

  const c = new Float32Array(80 * 4);
  for (let i = 0; i < 80; i++) {
    const hex = hexColors[i];
    const r = parseInt(hex.substring(0, 2), 16) / 255;
    const g = parseInt(hex.substring(2, 4), 16) / 255;
    const b = parseInt(hex.substring(4, 6), 16) / 255;
    c[i*4] = r;
    c[i*4+1] = g;
    c[i*4+2] = b;

  }
  return c;
}

// ============================================================
// FRAME GEOMETRY
// ============================================================
function buildFrameGeo(hw = 0.018, ext = 0.125) {
  // Each vertex: (cx, cy, px, py) — centerline xy (scaled by inst.scale in shader)
  // + fixed perpendicular offset xy (world-space constant, NOT scaled).
  // Frame corners are at ±0.5. Lines extend 'ext' beyond corners.
  // hw = line half-width (thickness), ext = extension past corners.
  const inner = 0.5, outer = 0.5 + ext;
  const lines = [
    [-outer, inner,  outer, inner],   // top
    [-outer,-inner,  outer,-inner],   // bottom
    [-inner,-outer, -inner, outer],   // left
    [ inner,-outer,  inner, outer],   // right
  ];
  const v = [], ix = [];
  for (let i = 0; i < 4; i++) {
    const [sx,sy,ex,ey] = lines[i];
    const dx=ex-sx, dy=ey-sy, len=sqrt(dx*dx+dy*dy);
    const nx=(-dy/len)*hw, ny=(dx/len)*hw;
    const b = i * 4;
    // (centerline_x, centerline_y, perp_x, perp_y)
    v.push(sx,sy, nx, ny,   sx,sy,-nx,-ny,   ex,ey, nx, ny,   ex,ey,-nx,-ny);
    ix.push(b,b+1,b+2, b+2,b+1,b+3);
  }
  return { verts: new Float32Array(v), idx: new Uint16Array(ix) };
}

function buildCursorGeo() {
  const s=1.0, w=0.06;
  const axes = [[[-s,0,0],[s,0,0],[0,w,0]], [[0,-s,0],[0,s,0],[w,0,0]], [[0,0,-s],[0,0,s],[0,w,0]]];
  const v=[], ix=[];
  for(let i=0;i<3;i++){
    const [a,b,n]=axes[i], base=i*4;
    v.push(a[0]+n[0],a[1]+n[1],a[2]+n[2], a[0]-n[0],a[1]-n[1],a[2]-n[2],
           b[0]+n[0],b[1]+n[1],b[2]+n[2], b[0]-n[0],b[1]-n[1],b[2]-n[2]);
    ix.push(base,base+1,base+2, base+2,base+1,base+3);
  }
  return { verts: new Float32Array(v), idx: new Uint16Array(ix) };
}
