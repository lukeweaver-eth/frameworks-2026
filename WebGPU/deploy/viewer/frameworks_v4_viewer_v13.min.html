<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Frameworks V4</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #12141a; overflow: hidden; font-family: 'SF Mono', 'Fira Code', monospace; }
canvas { display: block; width: 100vw; height: 100vh; }
/* Command input bar */
#command-bar {
position: fixed; top: 0; left: 0; right: 0; height: 40px;
background: rgba(10,10,14,0.95); border-bottom: 1px solid #555;
display: flex; align-items: center; padding: 0 12px; gap: 8px;
pointer-events: all; z-index: 100;
}
#command-input {
flex: 1; background: #222; color: #ddd; border: 1px solid #555;
padding: 6px 10px; font-family: inherit; font-size: 12px;
}
#command-bar button {
background: #333; color: #ccc; border: 1px solid #555; padding: 6px 12px;
font-family: inherit; font-size: 11px; cursor: pointer;
}
#command-bar button:hover { background: #555; }
#command-bar label { color: #999; font-size: 11px; }
#hud {
position: fixed; top: 40px; left: 0; right: 0; bottom: 0;
pointer-events: none; color: #8888aa; font-size: 11px; line-height: 1.6;
}
#hud.hidden * { display: none !important; }
#mode-display {
position: absolute; top: 12px; left: 12px;
background: rgba(10,10,14,0.85); padding: 6px 12px; border: 1px solid #333;
}
.mode { color: #ddd; font-size: 13px; font-weight: bold; }
#info-display {
position: absolute; bottom: 12px; left: 12px;
background: rgba(10,10,14,0.85); padding: 6px 12px; border: 1px solid #333;
}
#perf-display {
position: absolute; bottom: 12px; right: 12px;
background: rgba(10,10,14,0.85); padding: 6px 12px; border: 1px solid #333;
}
#error-msg {
position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
color: #ff6666; font-size: 16px; text-align: center; display: none;
}
/* Color palette overlay */
#palette-overlay {
position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
background: rgba(10,10,14,0.95); border: 2px solid #555; padding: 16px;
display: none; pointer-events: none;
}
#palette-overlay.active { display: block; }
#palette-grid {
display: grid; grid-template-columns: repeat(10, 24px); gap: 4px;
}
.palette-cell {
width: 24px; height: 24px; border: 1px solid #333; cursor: pointer;
}
.palette-cell.current { border: 2px solid #fff; box-shadow: 0 0 8px rgba(255,255,255,0.6); }
/* Bracket input overlay */
#bracket-overlay {
position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
background: rgba(10,10,14,0.95); border: 2px solid #555; padding: 16px;
display: none; pointer-events: all;
}
#bracket-overlay.active { display: block; }
#bracket-input {
background: #222; color: #ddd; border: 1px solid #555; padding: 8px;
font-family: inherit; font-size: 14px; width: 300px;
}
#palette-bracket-overlay {
position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
background: rgba(10,10,14,0.95); border: 2px solid #555; padding: 16px;
display: none; pointer-events: all;
}
#palette-bracket-overlay.active { display: block; }
#palette-bracket-input {
background: #222; color: #ddd; border: 1px solid #555; padding: 8px;
font-family: inherit; font-size: 14px; width: 200px;
}
/* w/W content overlays */
#w-overlay, #W-overlay {
position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
background: rgba(10,10,14,0.95); border: 2px solid #555; padding: 16px;
display: none; pointer-events: all; min-width: 340px;
}
#w-overlay.active, #W-overlay.active { display: block; }
#w-overlay label, #W-overlay label {
display: block; color: #999; font-size: 12px; margin-bottom: 8px;
}
#w-input {
background: #222; color: #ddd; border: 1px solid #555; padding: 8px;
font-family: inherit; font-size: 14px; width: 100%;
}
#W-input {
background: #222; color: #ddd; border: 1px solid #555; padding: 8px;
font-family: inherit; font-size: 14px; width: 100%; height: 120px; resize: vertical;
}
/* / command overlay */
#slash-overlay {
position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
background: rgba(10,10,14,0.95); border: 1px solid #555; padding: 10px 12px;
display: none; pointer-events: all; min-width: 400px; z-index: 200;
}
#slash-overlay.active { display: flex; gap: 8px; align-items: center; }
#slash-overlay label { color: #999; font-size: 11px; white-space: nowrap; }
#slash-input {
flex: 1; background: #222; color: #ddd; border: 1px solid #555; padding: 6px 8px;
font-family: inherit; font-size: 13px;
}
/* 2D label overlay canvas */
#label-canvas {
position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
pointer-events: none; z-index: 1;
}
</style>
</head>
<body>
<div id="command-bar">
<label>Command String:</label>
<input type="text" id="command-input" placeholder="Enter command string (e.g., f or fp5fpp2fppp or f(dR,8))">
<button id="btn-execute">Execute</button>
<button id="btn-export">Export</button>
<button id="btn-copy-hash">Copy Hash URL</button>
</div>
<canvas id="canvas"></canvas>
<div id="hud">
<div id="mode-display">
<div class="mode" id="mode-text">normal</div>
<div id="view-text">View: 0 Spatial</div>
<div id="context-text"></div>
</div>
<div id="info-display">
<div id="cursor-text">Cursor: 0, 0, 0</div>
<div id="selection-text">Sel: 0 / 0</div>
</div>
<div id="perf-display">
<div id="fps-text">FPS: --</div>
<div id="draw-text">Visible: -- / --</div>
</div>
</div>
<div id="error-msg"></div>
<div id="palette-overlay">
<div style="color:#999;margin-bottom:8px;">Color Palette (8×10)</div>
<div id="palette-grid"></div>
</div>
<div id="bracket-overlay">
<div style="color:#999;margin-bottom:8px;">Selection Input (e.g., 0,1,2 or 5:10)</div>
<input type="text" id="bracket-input" placeholder="Enter frame IDs...">
</div>
<div id="palette-bracket-overlay">
<div style="color:#999;margin-bottom:8px;">Palette Range (e.g., 3 or 1:10)</div>
<input type="text" id="palette-bracket-input" placeholder="e.g. 1:10">
</div>
<div id="w-overlay">
<label>Name (called) — Enter to apply, Escape to cancel</label>
<input type="text" id="w-input" placeholder="Frame name...">
</div>
<div id="W-overlay">
<label>Contents — Enter to apply, Shift+Enter for newline, Escape to cancel</label>
<textarea id="W-input" placeholder="Frame contents..."></textarea>
</div>
<div id="slash-overlay">
<label>/ command:</label>
<input type="text" id="slash-input" placeholder="e.g. fp or (dR,4)">
</div>
<canvas id="label-canvas"></canvas>
