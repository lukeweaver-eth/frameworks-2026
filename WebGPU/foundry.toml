[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"

# Adjust these remappings to point to your local mint repo clone
# or install the deps with forge install
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "scripty.sol/=lib/scripty.sol/",
    # Point these to your mint repo's contracts directory
    # e.g. if mint repo is at ../mint:
    # "./../interfaces/=../mint/contracts/contracts/interfaces/",
    # "./../libraries/=../mint/contracts/contracts/libraries/",
    # "./../types/=../mint/contracts/contracts/types/",
]

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
