<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Frameworks V4 — Step 4: Command String Replay (V3 Parity)</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #12141a; overflow: hidden; font-family: 'SF Mono', 'Fira Code', monospace; }
canvas { display: block; width: 100vw; height: 100vh; }

/* Command input bar */
#command-bar {
  position: fixed; top: 0; left: 0; right: 0;
  background: rgba(10,10,14,0.95); border-bottom: 1px solid #555;
  display: flex; flex-direction: column; padding: 4px 12px; gap: 4px;
  pointer-events: all; z-index: 100;
}
#command-bar-row1, #command-bar-row2, #command-bar-row3 {
  display: flex; align-items: center; gap: 8px; height: 32px;
}
#command-bar-row3 select {
  background: #222; color: #ddd; border: 1px solid #555;
  padding: 4px 6px; font-family: inherit; font-size: 11px;
}
#command-bar-row3 input[type="text"] {
  background: #222; color: #ddd; border: 1px solid #555;
  padding: 5px 8px; font-family: inherit; font-size: 12px;
}
#command-input {
  flex: 1; background: #222; color: #ddd; border: 1px solid #555;
  padding: 5px 10px; font-family: inherit; font-size: 12px;
}
#sketch-log {
  flex: 1; background: #1a1a22; color: #888; border: 1px solid #444;
  padding: 5px 10px; font-family: inherit; font-size: 12px;
}
#command-bar button {
  background: #333; color: #ccc; border: 1px solid #555; padding: 5px 10px;
  font-family: inherit; font-size: 11px; cursor: pointer; white-space: nowrap;
}
#command-bar button:hover { background: #555; }
#command-bar label { color: #999; font-size: 11px; white-space: nowrap; }
#btn-hist-up, #btn-hist-down {
  padding: 5px 7px; font-size: 10px;
}

#hud {
  position: fixed; top: 76px; left: 0; right: 0; bottom: 0;
  pointer-events: none; color: #8888aa; font-size: 11px; line-height: 1.6;
}
#hud.hidden * { display: none !important; }
#mode-display {
  position: absolute; top: 12px; left: 212px;
  background: rgba(10,10,14,0.85); padding: 6px 12px; border: 1px solid #333;
}
.mode { color: #ddd; font-size: 13px; font-weight: bold; }
#info-display {
  position: absolute; bottom: 12px; left: 12px;
  background: rgba(10,10,14,0.85); padding: 6px 12px; border: 1px solid #333;
}
#perf-display {
  position: absolute; bottom: 12px; right: 12px;
  background: rgba(10,10,14,0.85); padding: 6px 12px; border: 1px solid #333;
}
#error-msg {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  color: #ff6666; font-size: 16px; text-align: center; display: none;
}

/* Color palette overlay */
#palette-overlay {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(10,10,14,0.95); border: 2px solid #555; padding: 16px;
  display: none; pointer-events: none;
}
#palette-overlay.active { display: block; }
#palette-grid {
  display: flex; flex-wrap: wrap; gap: 4px; max-width: 280px;
}
.palette-cell {
  width: 24px; height: 24px; border: 1px solid #333; cursor: pointer;
}
.palette-cell.current { border: 2px solid #fff; box-shadow: 0 0 8px rgba(255,255,255,0.6); }

/* Bracket input overlay */
#bracket-overlay {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(10,10,14,0.95); border: 2px solid #555; padding: 16px;
  display: none; pointer-events: all;
}
#bracket-overlay.active { display: block; }
#bracket-input {
  background: #222; color: #ddd; border: 1px solid #555; padding: 8px;
  font-family: inherit; font-size: 14px; width: 300px;
}

#palette-bracket-overlay {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(10,10,14,0.95); border: 2px solid #555; padding: 16px;
  display: none; pointer-events: all;
}
#palette-bracket-overlay.active { display: block; }
#palette-bracket-input {
  background: #222; color: #ddd; border: 1px solid #555; padding: 8px;
  font-family: inherit; font-size: 14px; width: 200px;
}

/* w/W content overlays */
#w-overlay, #W-overlay {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(10,10,14,0.95); border: 2px solid #555; padding: 16px;

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<script>
// ============================================================
// FRAME STORE — Typed array backend from frame-store.js
// 64-byte per-instance layout
// ============================================================

const FLOATS_PER_INSTANCE = 16;
const BYTES_PER_INSTANCE = 64;

const F = {
    PX: 0,  PY: 1,  PZ: 2,  SCALE: 3,
    RX: 4,  RY: 5,  RZ: 6,
    UX: 8,  UY: 9,  UZ: 10,
    NX: 12, NY: 13, NZ: 14,
};

const U = {
    COLOR_INDEX: 7,
    FLAGS: 11,
    FRAME_ID: 15,
};

const FLAG_SELECTED = 1;
const FLAG_VISIBLE  = 2;

class FrameStore {
    constructor(initialCapacity = 4096) {
        this.count = 0;
        this.capacity = initialCapacity;
        this._frameIdCounter = 0;

        this.data = new ArrayBuffer(this.capacity * BYTES_PER_INSTANCE);
        this.f32 = new Float32Array(this.data);
        this.u32 = new Uint32Array(this.data);
        this.metadata = [];

        this._dirtyMin = Infinity;
        this._dirtyMax = 0;
        this._fullDirty = false;
    }

    _grow(needed) {
        while (this.capacity < needed) this.capacity *= 2;
        if (this.capacity > this.f32.length / FLOATS_PER_INSTANCE) {
            const oldBytes = this.data.byteLength;
            const newBuf = new ArrayBuffer(this.capacity * BYTES_PER_INSTANCE);
            new Uint8Array(newBuf).set(new Uint8Array(this.data, 0, oldBytes));
            this.data = newBuf;
            this.f32 = new Float32Array(this.data);
            this.u32 = new Uint32Array(this.data);
            this._fullDirty = true;
        }
    }

    _o(i) { return i * FLOATS_PER_INSTANCE; }
    _b(i) { return i * BYTES_PER_INSTANCE; }

    _markDirty(instanceIndex) {
        if (this._batchMode) return;
        const lo = this._b(instanceIndex);
        const hi = lo + BYTES_PER_INSTANCE;
        if (lo < this._dirtyMin) this._dirtyMin = lo;
        if (hi > this._dirtyMax) this._dirtyMax = hi;
    }

    _markRangeDirty(startIdx, count) {
        const lo = this._b(startIdx);
        const hi = this._b(startIdx + count);
        if (lo < this._dirtyMin) this._dirtyMin = lo;
        if (hi > this._dirtyMax) this._dirtyMax = hi;
    }

    _markAllDirty() {
        this._fullDirty = true;
    }

    getDirtyRange() {
        if (this._fullDirty) {
            return { offset: 0, length: this.count * BYTES_PER_INSTANCE };
        }
        if (this._dirtyMin < this._dirtyMax) {
            return { offset: this._dirtyMin, length: this._dirtyMax - this._dirtyMin };
        }
        return null;
    }

    clearDirty() {
        this._dirtyMin = Infinity;
        this._dirtyMax = 0;
        this._fullDirty = false;
    }

    static basisFromNormal(nx, ny, nz) {
        const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
        if (len > 0.0001) { nx /= len; ny /= len; nz /= len; }

        if (Math.abs(nx) < 0.001 && Math.abs(ny) < 0.001 && Math.abs(nz - 1) < 0.001) {
            return { rx: 1, ry: 0, rz: 0, ux: 0, uy: 1, uz: 0 };
        }

        let refX, refY, refZ;
        const dotWithY = Math.abs(ny);
        if (dotWithY > 0.999) {
            refX = 1; refY = 0; refZ = 0;
        } else {
            refX = 0; refY = 1; refZ = 0;
        }

        let rx = refY * nz - refZ * ny;
        let ry = refZ * nx - refX * nz;
        let rz = refX * ny - refY * nx;
        const rLen = Math.sqrt(rx * rx + ry * ry + rz * rz);
        if (rLen > 0.0001) { rx /= rLen; ry /= rLen; rz /= rLen; }

        let ux = ny * rz - nz * ry;
        let uy = nz * rx - nx * rz;
        let uz = nx * ry - ny * rx;
        const uLen = Math.sqrt(ux * ux + uy * uy + uz * uz);
        if (uLen > 0.0001) { ux /= uLen; uy /= uLen; uz /= uLen; }

        return { rx, ry, rz, ux, uy, uz };
    }

    addFrame(x, y, z, nx, ny, nz, scale, colorIndex) {
        const i = this.count++;
        this._grow(this.count);
        const o = this._o(i);

        this.f32[o + F.PX] = x;
        this.f32[o + F.PY] = y;
        this.f32[o + F.PZ] = z;
        this.f32[o + F.SCALE] = scale ?? 2;

        const basis = FrameStore.basisFromNormal(nx, ny, nz);
        this.f32[o + F.RX] = basis.rx;
        this.f32[o + F.RY] = basis.ry;
        this.f32[o + F.RZ] = basis.rz;
        this.f32[o + F.UX] = basis.ux;
        this.f32[o + F.UY] = basis.uy;
        this.f32[o + F.UZ] = basis.uz;

        const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
        this.f32[o + F.NX] = len > 0.0001 ? nx / len : 0;
        this.f32[o + F.NY] = len > 0.0001 ? ny / len : 0;
        this.f32[o + F.NZ] = len > 0.0001 ? nz / len : 1;

        this.u32[o + U.COLOR_INDEX] = colorIndex ?? 0;
        this.u32[o + U.FLAGS] = FLAG_SELECTED | FLAG_VISIBLE;
        this.u32[o + U.FRAME_ID] = this._frameIdCounter++;

        this.metadata[i] = { called: '', contents: '', contexts: [], components: [], parentId: null, isSuperframe: false, localCamera: null };
        this._markDirty(i);
        return i;
    }

    addBulk(n, positionFn, colorFn, normalFn) {
        const start = this.count;
        this.count += n;
        this._grow(this.count);
        for (let i = 0; i < n; i++) {
            const idx = start + i;
            const o = this._o(idx);
            const pos = positionFn(i);
            const norm = normalFn ? normalFn(i) : [0, 0, 1];
            const basis = FrameStore.basisFromNormal(norm[0], norm[1], norm[2]);

            this.f32[o + F.PX] = pos[0];
            this.f32[o + F.PY] = pos[1];
            this.f32[o + F.PZ] = pos[2];
            this.f32[o + F.SCALE] = 2;
            this.f32[o + F.RX] = basis.rx; this.f32[o + F.RY] = basis.ry; this.f32[o + F.RZ] = basis.rz;
            this.f32[o + F.UX] = basis.ux; this.f32[o + F.UY] = basis.uy; this.f32[o + F.UZ] = basis.uz;
            this.f32[o + F.NX] = norm[0];  this.f32[o + F.NY] = norm[1];  this.f32[o + F.NZ] = norm[2];
            this.u32[o + U.COLOR_INDEX] = colorFn ? colorFn(i) : (i % 80);
            this.u32[o + U.FLAGS] = FLAG_VISIBLE;
            this.u32[o + U.FRAME_ID] = this._frameIdCounter++;
            this.metadata[idx] = { called: '', contents: '', contexts: [], components: [], parentId: null, isSuperframe: false, localCamera: null };
        }
        this._markRangeDirty(start, n);
    }

    clear() {
        this.count = 0;
        this._frameIdCounter = 0;
        this.metadata = [];
        this._markAllDirty();
    }

    deselectAll() {
        for (let i = 0; i < this.count; i++) {
            this.u32[this._o(i) + U.FLAGS] &= ~FLAG_SELECTED;
        }
        this._markRangeDirty(0, this.count);
    }

    selectAll(ctxId = undefined) {
        for (let i = 0; i < this.count; i++) {
            if (ctxId !== undefined && (!this.metadata[i] || this.metadata[i].parentId !== ctxId)) continue;
            this.u32[this._o(i) + U.FLAGS] |= FLAG_SELECTED;
        }
        this._markRangeDirty(0, this.count);
    }

    getSelectedCount() {
        let n = 0;
        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) n++;
        }
        return n;
    }

    getFrameId(i) {
        return this.u32[this._o(i) + U.FRAME_ID];
    }

    isSelected(i) {
        return !!(this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED);
    }

    setSelected(i, selected) {
        if (selected) {
            this.u32[this._o(i) + U.FLAGS] |= FLAG_SELECTED;
        } else {
            this.u32[this._o(i) + U.FLAGS] &= ~FLAG_SELECTED;
        }
        this._markDirty(i);
    }

    getColorIndex(i) {
        return this.u32[this._o(i) + U.COLOR_INDEX];
    }

    setColorIndex(i, colorIndex) {
        this.u32[this._o(i) + U.COLOR_INDEX] = colorIndex;
        this._markDirty(i);
    }

    shiftSelectedColors(shift, paletteSize = 80) {
        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) {
                const oldIdx = this.u32[this._o(i) + U.COLOR_INDEX];
                let newIdx = (oldIdx + shift) % paletteSize;
                if (newIdx < 0) newIdx += paletteSize;
                this.u32[this._o(i) + U.COLOR_INDEX] = newIdx;
                this._markDirty(i);
            }
        }
    }

    animateAllColors(step, cols = 8, paletteSize = 80) {
        for (let i = 0; i < this.count; i++) {
            const o = this._o(i) + U.COLOR_INDEX;
            this.u32[o] = (this.u32[o] + step + paletteSize) % paletteSize;
            this._markDirty(i);
        }
    }

    translate(i, dx, dy, dz) {
        const o = this._o(i);
        this.f32[o + F.PX] += dx;
        this.f32[o + F.PY] += dy;
        this.f32[o + F.PZ] += dz;
        this._markDirty(i);
    }

    translateSelected(dx, dy, dz) {
        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) {
                this.translate(i, dx, dy, dz);
            }
        }
    }

    rotateFrame(i, cx, cy, cz, angle, axis) {
        const o = this._o(i);
        let cos, sin;
        // Cache cos/sin for the two common angles to avoid repeated trig in tight loops
        if (angle === this._lastAngle) {
            cos = this._lastCos; sin = this._lastSin;
        } else {
            cos = Math.cos(angle); sin = Math.sin(angle);
            this._lastAngle = angle; this._lastCos = cos; this._lastSin = sin;
        }

        const dx = this.f32[o + F.PX] - cx;
        const dy = this.f32[o + F.PY] - cy;
        const dz = this.f32[o + F.PZ] - cz;

        let px, py, pz;
        switch (axis) {
            case 'x': px = dx;                    py = dy*cos - dz*sin;  pz = dy*sin + dz*cos;  break;
            case 'y': px = dx*cos + dz*sin;       py = dy;               pz = -dx*sin + dz*cos; break;
            case 'z': px = dx*cos - dy*sin;        py = dx*sin + dy*cos;  pz = dz;               break;
        }
        this.f32[o + F.PX] = cx + px;
        this.f32[o + F.PY] = cy + py;
        this.f32[o + F.PZ] = cz + pz;

        const rx = this.f32[o + F.RX], ry = this.f32[o + F.RY], rz = this.f32[o + F.RZ];
        switch (axis) {
            case 'x': this.f32[o+F.RX] = rx;           this.f32[o+F.RY] = ry*cos - rz*sin; this.f32[o+F.RZ] = ry*sin + rz*cos; break;
            case 'y': this.f32[o+F.RX] = rx*cos+rz*sin; this.f32[o+F.RY] = ry;              this.f32[o+F.RZ] = -rx*sin+rz*cos;  break;
            case 'z': this.f32[o+F.RX] = rx*cos-ry*sin; this.f32[o+F.RY] = rx*sin+ry*cos;   this.f32[o+F.RZ] = rz;              break;
        }

        const ux = this.f32[o + F.UX], uy = this.f32[o + F.UY], uz = this.f32[o + F.UZ];
        switch (axis) {
            case 'x': this.f32[o+F.UX] = ux;           this.f32[o+F.UY] = uy*cos - uz*sin; this.f32[o+F.UZ] = uy*sin + uz*cos; break;
            case 'y': this.f32[o+F.UX] = ux*cos+uz*sin; this.f32[o+F.UY] = uy;              this.f32[o+F.UZ] = -ux*sin+uz*cos;  break;
            case 'z': this.f32[o+F.UX] = ux*cos-uy*sin; this.f32[o+F.UY] = ux*sin+uy*cos;   this.f32[o+F.UZ] = uz;              break;
        }

        const nx = this.f32[o + F.NX], ny = this.f32[o + F.NY], nz = this.f32[o + F.NZ];
        switch (axis) {
            case 'x': this.f32[o+F.NX] = nx;           this.f32[o+F.NY] = ny*cos - nz*sin; this.f32[o+F.NZ] = ny*sin + nz*cos; break;
            case 'y': this.f32[o+F.NX] = nx*cos+nz*sin; this.f32[o+F.NY] = ny;              this.f32[o+F.NZ] = -nx*sin+nz*cos;  break;
            case 'z': this.f32[o+F.NX] = nx*cos-ny*sin; this.f32[o+F.NY] = nx*sin+ny*cos;   this.f32[o+F.NZ] = nz;              break;
        }

        if (!this._batchMode) {
            this._normalizeVec3At(o + F.RX);
            this._normalizeVec3At(o + F.UX);
            this._normalizeVec3At(o + F.NX);
        }
        this._markDirty(i);
    }

    _normalizeVec3At(offset) {
        const x = this.f32[offset], y = this.f32[offset+1], z = this.f32[offset+2];
        const len = Math.sqrt(x*x + y*y + z*z);
        if (len > 0.0001) {
            this.f32[offset]   = x / len;
            this.f32[offset+1] = y / len;
            this.f32[offset+2] = z / len;
        }
    }

    rotateSelected(cx, cy, cz, angle, view) {
        let axis;
        switch (view) {
            case 0: case 1: case 3: axis = 'z'; break;
            case 2: case 4:         axis = 'x'; break;
            case 5: case 6:         axis = 'y'; break;
            default:                axis = 'z';
        }
        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) {
                this.rotateFrame(i, cx, cy, cz, angle, axis);
            }
        }
    }

    reflectSelectedH(cx, cy, cz, view) {
        let reflectAxis;
        switch (view) {
            case 0: case 1: case 3: case 5: case 6: reflectAxis = 'x'; break;
            case 2: case 4:                          reflectAxis = 'z'; break;
            default:                                 reflectAxis = 'x';
        }

        for (let i = 0; i < this.count; i++) {
            if (!(this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED)) continue;
            const o = this._o(i);
            switch (reflectAxis) {
                case 'x':
                    this.f32[o + F.PX] = 2*cx - this.f32[o + F.PX];
                    this.f32[o + F.RX] = -this.f32[o + F.RX];
                    this.f32[o + F.UX] = -this.f32[o + F.UX];
                    this.f32[o + F.NX] = -this.f32[o + F.NX];
                    break;
                case 'z':
                    this.f32[o + F.PZ] = 2*cz - this.f32[o + F.PZ];
                    this.f32[o + F.RZ] = -this.f32[o + F.RZ];
                    this.f32[o + F.UZ] = -this.f32[o + F.UZ];
                    this.f32[o + F.NZ] = -this.f32[o + F.NZ];
                    break;
            }
            this._markDirty(i);
        }
    }

    reflectSelectedV(cx, cy, cz, view) {
        let reflectAxis;
        switch (view) {
            case 0: case 1: case 2: case 3: case 4: reflectAxis = 'y'; break;
            case 5: case 6:                          reflectAxis = 'z'; break;
            default:                                 reflectAxis = 'y';
        }

        for (let i = 0; i < this.count; i++) {
            if (!(this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED)) continue;
            const o = this._o(i);
            switch (reflectAxis) {
                case 'y':
                    this.f32[o + F.PY] = 2*cy - this.f32[o + F.PY];
                    this.f32[o + F.RY] = -this.f32[o + F.RY];
                    this.f32[o + F.UY] = -this.f32[o + F.UY];
                    this.f32[o + F.NY] = -this.f32[o + F.NY];
                    break;
                case 'z':
                    this.f32[o + F.PZ] = 2*cz - this.f32[o + F.PZ];
                    this.f32[o + F.RZ] = -this.f32[o + F.RZ];
                    this.f32[o + F.UZ] = -this.f32[o + F.UZ];
                    this.f32[o + F.NZ] = -this.f32[o + F.NZ];
                    break;
            }
            this._markDirty(i);
        }
    }

    scaleSelected(factor) {
        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) {
                this.f32[this._o(i) + F.SCALE] *= factor;
                this._markDirty(i);
            }
        }
    }

    scaleSelectedAdd(delta, floor = 0.01) {
        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) {
                this.f32[this._o(i) + F.SCALE] = Math.max(floor, this.f32[this._o(i) + F.SCALE] + delta);
                this._markDirty(i);
            }
        }
    }

    scaleSelectedClamp(factor, floor = 0.01) {
        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) {
                this.f32[this._o(i) + F.SCALE] = Math.max(floor, this.f32[this._o(i) + F.SCALE] * factor);
                this._markDirty(i);
            }
        }
    }

    getSelectionBoundsIdx() {
        let lo = -1, hi = -1, count = 0;
        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) {
                if (lo === -1) lo = i;
                hi = i;
                count++;
            }
        }
        return { lo, hi, count };
    }

    moveSelectedUp() {
        const { lo, hi, count } = this.getSelectionBoundsIdx();
        if (count === 0 || hi >= this.count - 1) return;

        const savedData = new Uint32Array(FLOATS_PER_INSTANCE);
        const savedO = this._o(hi + 1);
        for (let j = 0; j < FLOATS_PER_INSTANCE; j++) savedData[j] = this.u32[savedO + j];
        const savedMeta = this.metadata[hi + 1];

        for (let i = hi; i >= lo; i--) {
            const src = this._o(i), dst = this._o(i + 1);
            for (let j = 0; j < FLOATS_PER_INSTANCE; j++) this.u32[dst + j] = this.u32[src + j];
            this.metadata[i + 1] = this.metadata[i];
        }

        const loO = this._o(lo);
        for (let j = 0; j < FLOATS_PER_INSTANCE; j++) this.u32[loO + j] = savedData[j];
        this.metadata[lo] = savedMeta;

        this._markRangeDirty(lo, hi + 1 - lo + 1);
    }

    moveSelectedDown() {
        const { lo, hi, count } = this.getSelectionBoundsIdx();
        if (count === 0 || lo <= 0) return;

        const savedData = new Uint32Array(FLOATS_PER_INSTANCE);
        const savedO = this._o(lo - 1);
        for (let j = 0; j < FLOATS_PER_INSTANCE; j++) savedData[j] = this.u32[savedO + j];
        const savedMeta = this.metadata[lo - 1];

        for (let i = lo; i <= hi; i++) {
            const src = this._o(i), dst = this._o(i - 1);
            for (let j = 0; j < FLOATS_PER_INSTANCE; j++) this.u32[dst + j] = this.u32[src + j];
            this.metadata[i - 1] = this.metadata[i];
        }

        const hiO = this._o(hi);
        for (let j = 0; j < FLOATS_PER_INSTANCE; j++) this.u32[hiO + j] = savedData[j];
        this.metadata[hi] = savedMeta;

        this._markRangeDirty(lo - 1, hi - lo + 2);
    }

    invertSelection(ctxId = undefined) {
        for (let i = 0; i < this.count; i++) {
            if (ctxId !== undefined && (!this.metadata[i] || this.metadata[i].parentId !== ctxId)) continue;
            this.u32[this._o(i) + U.FLAGS] ^= FLAG_SELECTED;
            this._markDirty(i);
        }
    }

    hideSelected() {
        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) {
                this.u32[this._o(i) + U.FLAGS] &= ~FLAG_VISIBLE;
                this._markDirty(i);
            }
        }
    }

    showAll() {
        for (let i = 0; i < this.count; i++) {
            this.u32[this._o(i) + U.FLAGS] |= FLAG_VISIBLE;
            this._markDirty(i);
        }
    }

    toggleHideSelected() {
        // If any selected frame is visible, hide all selected. Otherwise show all selected.
        let anyVisible = false;
        for (let i = 0; i < this.count; i++) {
            if ((this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) &&
                (this.u32[this._o(i) + U.FLAGS] & FLAG_VISIBLE)) {
                anyVisible = true; break;
            }
        }
        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) {
                if (anyVisible) this.u32[this._o(i) + U.FLAGS] &= ~FLAG_VISIBLE;
                else this.u32[this._o(i) + U.FLAGS] |= FLAG_VISIBLE;
                this._markDirty(i);
            }
        }
    }

    scaleSelectionGroup(factor) {
        let cx = 0, cy = 0, cz = 0, n = 0;
        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) {
                const o = this._o(i);
                cx += this.f32[o]; cy += this.f32[o+1]; cz += this.f32[o+2];
                n++;
            }
        }
        if (n === 0) return;
        cx /= n; cy /= n; cz /= n;

        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) {
                const o = this._o(i);
                this.f32[o + F.PX] = cx + (this.f32[o + F.PX] - cx) * factor;
                this.f32[o + F.PY] = cy + (this.f32[o + F.PY] - cy) * factor;
                this.f32[o + F.PZ] = cz + (this.f32[o + F.PZ] - cz) * factor;
                this.f32[o + F.SCALE] *= factor;
                this._markDirty(i);
            }
        }
    }

    duplicateSelected() {
        const originals = [];
        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) originals.push(i);
        }
        if (originals.length === 0) return [];

        for (const idx of originals) {
            this.u32[this._o(idx) + U.FLAGS] &= ~FLAG_SELECTED;
            this._markDirty(idx);
        }

        const newIndices = [];
        for (const srcIdx of originals) {
            const newIdx = this.count++;
            this._grow(this.count);

            const src = this._o(srcIdx);
            const dst = this._o(newIdx);
            for (let j = 0; j < FLOATS_PER_INSTANCE; j++) {
                this.u32[dst + j] = this.u32[src + j];
            }

            this.u32[dst + U.FRAME_ID] = this._frameIdCounter++;
            this.u32[dst + U.FLAGS] |= FLAG_SELECTED;

            const srcMeta = this.metadata[srcIdx];
            this.metadata[newIdx] = {
                called: srcMeta ? srcMeta.called : '',
                contents: srcMeta ? srcMeta.contents : '',
                contexts: [],
                components: [],
                parentId: srcMeta ? srcMeta.parentId : null,
                isSuperframe: false,
                localCamera: null,
            };

            this._markDirty(newIdx);
            newIndices.push(newIdx);
        }
        return newIndices;
    }

    deleteSelected() {
        let dst = 0;
        for (let src = 0; src < this.count; src++) {
            if (this.u32[this._o(src) + U.FLAGS] & FLAG_SELECTED) {
                continue;
            }
            if (dst !== src) {
                const so = this._o(src), do_ = this._o(dst);
                for (let j = 0; j < FLOATS_PER_INSTANCE; j++) {
                    this.u32[do_ + j] = this.u32[so + j];
                }
                this.metadata[dst] = this.metadata[src];
            }
            dst++;
        }
        const deleted = this.count - dst;
        this.count = dst;
        if (deleted > 0) this._markAllDirty();
        return deleted;
    }

    snapSelectionToCursor(cursorX, cursorY, cursorZ) {
        let cx = 0, cy = 0, cz = 0, n = 0;
        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) {
                const o = this._o(i);
                cx += this.f32[o]; cy += this.f32[o+1]; cz += this.f32[o+2];
                n++;
            }
        }
        if (n === 0) return;
        cx /= n; cy /= n; cz /= n;

        const dx = cursorX - cx, dy = cursorY - cy, dz = cursorZ - cz;
        this.translateSelected(dx, dy, dz);
    }

    centerStructureToCursor(cursorX, cursorY, cursorZ) {
        if (this.count === 0) return;
        const bbox = this.getBoundingBox();
        const dx = cursorX - bbox.centerX;
        const dy = cursorY - bbox.centerY;
        const dz = cursorZ - bbox.centerZ;
        for (let i = 0; i < this.count; i++) {
            this.translate(i, dx, dy, dz);
        }
    }

    getSelectionCenter() {
        let sx = 0, sy = 0, sz = 0, count = 0;
        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) {
                const o = this._o(i);
                sx += this.f32[o]; sy += this.f32[o+1]; sz += this.f32[o+2];
                count++;
            }
        }
        if (count === 0) return null;
        return { x: sx / count, y: sy / count, z: sz / count };
    }

    getBoundingBox() {
        if (this.count === 0) {
            return { minX:0, maxX:0, minY:0, maxY:0, minZ:0, maxZ:0, centerX:0, centerY:0, centerZ:0 };
        }
        let minX = Infinity, maxX = -Infinity;
        let minY = Infinity, maxY = -Infinity;
        let minZ = Infinity, maxZ = -Infinity;

        for (let i = 0; i < this.count; i++) {
            const o = this._o(i);
            const hs = this.f32[o + F.SCALE] / 2;
            const x = this.f32[o], y = this.f32[o+1], z = this.f32[o+2];
            if (x - hs < minX) minX = x - hs;
            if (x + hs > maxX) maxX = x + hs;
            if (y - hs < minY) minY = y - hs;
            if (y + hs > maxY) maxY = y + hs;
            if (z - hs < minZ) minZ = z - hs;
            if (z + hs > maxZ) maxZ = z + hs;
        }
        return {
            minX, maxX, minY, maxY, minZ, maxZ,
            centerX: (minX+maxX)/2, centerY: (minY+maxY)/2, centerZ: (minZ+maxZ)/2,
        };
    }

    getSelectionBoundingBox() {
        let minX = Infinity, maxX = -Infinity;
        let minY = Infinity, maxY = -Infinity;
        let minZ = Infinity, maxZ = -Infinity;
        let found = false;
        for (let i = 0; i < this.count; i++) {
            if (!(this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED)) continue;
            const o = this._o(i);
            const hs = this.f32[o + F.SCALE] / 2;
            const x = this.f32[o], y = this.f32[o+1], z = this.f32[o+2];
            if (x - hs < minX) minX = x - hs;
            if (x + hs > maxX) maxX = x + hs;
            if (y - hs < minY) minY = y - hs;
            if (y + hs > maxY) maxY = y + hs;
            if (z - hs < minZ) minZ = z - hs;
            if (z + hs > maxZ) maxZ = z + hs;
            found = true;
        }
        if (!found) return null;
        return { minX, maxX, minY, maxY, minZ, maxZ,
            centerX: (minX+maxX)/2, centerY: (minY+maxY)/2, centerZ: (minZ+maxZ)/2 };
    }

    setCalledSelected(text) {
        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) {
                this.metadata[i].called = text;
            }
        }
    }

    setContentsSelected(text) {
        for (let i = 0; i < this.count; i++) {
            if (this.u32[this._o(i) + U.FLAGS] & FLAG_SELECTED) {
                this.metadata[i].contents = text;
            }
        }
    }

    selectAllOfColor(ctxId = undefined) {
        let targetColor = null;
        for (let i = 0; i < this.count; i++) {

            case 0: // Auto-rotate mode — enter paused, ijkl sets direction, 0 toggles
                if (this.autoOrbit) {
                    this.autoOrbitPaused = !this.autoOrbitPaused;

                    this.autoOrbit = true;
                    this.autoOrbitPaused = true; // wait for ijkl before moving
                    this.orbitTheta = cam.theta;
                    this.orbitPhi = cam.phi;
                    this.orbitVelocityTheta = 0;
                    this.orbitVelocityPhi = 0;

            case 1: // Front (looking from +Z)
                this.autoOrbit = false;
                cam.theta = 0;
                cam.phi = 0;
                cam.dist = zoom;
                cam.invalidate();
                console.log('Front view');
                break;

            case 2: // Right (looking from +X)
                this.autoOrbit = false;
                cam.theta = Math.PI / 2;
                cam.phi = 0;
                cam.dist = zoom;
                cam.invalidate();
                console.log('Right view');
                break;

            case 3: // Back (looking from -Z)
                this.autoOrbit = false;
                cam.theta = Math.PI;
                cam.phi = 0;
                cam.dist = zoom;
                cam.invalidate();
                console.log('Back view');
                break;

            case 4: // Left (looking from -X)
                this.autoOrbit = false;
                cam.theta = -Math.PI / 2;
                cam.phi = 0;
                cam.dist = zoom;
                cam.invalidate();
                console.log('Left view');
                break;

            case 5: // Top (looking from +Y)
                this.autoOrbit = false;
                cam.theta = 0;
                cam.phi = Math.PI / 2 - 0.01; // Slightly below vertical to avoid gimbal lock
                cam.dist = zoom;
                cam.invalidate();
                console.log('Top view');
                break;

            case 6: // Bottom (looking from -Y)
                this.autoOrbit = false;
                cam.theta = 0;
                cam.phi = -Math.PI / 2 + 0.01; // Slightly above vertical to avoid gimbal lock
                cam.dist = zoom;
                cam.invalidate();
                console.log('Bottom view');
                break;

            case 7: // Isometric (45° angles)
                this.autoOrbit = false;
                cam.theta = Math.PI / 4;
                cam.phi = Math.atan(1 / Math.sqrt(2)); // ~35.26° - true isometric angle
                cam.dist = zoom;
                cam.invalidate();
                console.log('Isometric view');
                break;

            case 8: // Auto-orbit mode (smooth rotation with IJKL control)
                this.autoOrbit = true;
                this.orbitTheta = cam.theta;
                this.orbitPhi = cam.phi;
                this.orbitVelocityTheta = 0;
                this.orbitVelocityPhi = 0;
                console.log('Auto-orbit mode (use IJKL to control rotation)');
                break;

            case 9: // Toggle orthographic/perspective
                this.orthographic = !this.orthographic;
                console.log(this.orthographic ? 'Orthographic projection' : 'Perspective projection');

                break;
        }
    }

    navigate(key, shift = false) {
        const cam = this.camera;

        // Auto-rotate mode: ijkl adjust velocity and unpause
        if (this.autoOrbit) {
            const step = 0.3;
            switch(key) {
                case 'l': this.orbitVelocityTheta += step; this.autoOrbitPaused = false; return true;
                case 'j': this.orbitVelocityTheta -= step; this.autoOrbitPaused = false; return true;
                case 'i': this.orbitVelocityPhi   += step; this.autoOrbitPaused = false; return true;
                case 'k': this.orbitVelocityPhi   -= step; this.autoOrbitPaused = false; return true;
            }
            return false;
        }

        // Normal mode: zoom and FOV controls
        // Lowercase = single step, Uppercase = double step
        const DEG5  = 5  * Math.PI / 180;
        const DEG10 = 10 * Math.PI / 180;
        const FOV_MIN = 5  * Math.PI / 180;
        const FOV_MAX = 170 * Math.PI / 180;
        switch (key) {
            case 'i': cam.dist *= 0.9;  cam.invalidate(); break; // zoom in
            case 'I': cam.dist *= 0.5;  cam.invalidate(); break; // zoom in 2×
            case 'k': cam.dist *= 1.1;  cam.invalidate(); break; // zoom out
            case 'K': cam.dist *= 2.0;  cam.invalidate(); break; // zoom out 2×

            case 'J': this.fov = Math.min(this.fov + DEG10, FOV_MAX); break; // widen 10°
            case 'l': this.fov = Math.max(this.fov - DEG5,  FOV_MIN); break; // narrow 5°
            case 'L': this.fov = Math.max(this.fov - DEG10, FOV_MIN); break; // narrow 10°
        }
    }

    updateAutoOrbit(deltaTime) {
        if (!this.autoOrbit || this.autoOrbitPaused) return;

        this.orbitTheta += this.orbitVelocityTheta * deltaTime;
        this.orbitPhi   += this.orbitVelocityPhi   * deltaTime;

        this.camera.phi   = this.orbitPhi;
        this.camera.invalidate();
    }
}

class CommandTree {
    constructor() {
        this.history = [[]];
        this.branchIndex = 0;
        this.positionInBranch = 0;
        this.inCommandContext = false;
    }

    addCommand(cmd) {
        if (this.inCommandContext) return;

        const currentBranch = this.history[this.branchIndex];

        if (this.positionInBranch < currentBranch.length) {
            const newBranch = currentBranch.slice(0, this.positionInBranch);
            newBranch.push(cmd);
            this.history.push(newBranch);
            this.branchIndex = this.history.length - 1;
            this.positionInBranch = newBranch.length;
        } else {
            currentBranch.push(cmd);
            this.positionInBranch = currentBranch.length;
        }
    }

    moveBack() {
        if (this.positionInBranch > 0) {
            this.positionInBranch--;
        }
    }

    moveForward() {
        const currentBranch = this.history[this.branchIndex];
        if (this.positionInBranch < currentBranch.length) {
            this.positionInBranch++;
        }
    }

    moveUp() {
        if (this.branchIndex > 0) {
            this.branchIndex--;
            const newBranch = this.history[this.branchIndex];
            this.positionInBranch = Math.min(this.positionInBranch, newBranch.length);
        }
    }

    moveDown() {
        if (this.branchIndex < this.history.length - 1) {
            this.branchIndex++;
            const newBranch = this.history[this.branchIndex];
            this.positionInBranch = Math.min(this.positionInBranch, newBranch.length);
        }
    }

    peekNextCommand() {
        const currentBranch = this.history[this.branchIndex];
        if (this.positionInBranch < currentBranch.length) {
            return currentBranch[this.positionInBranch];
        }
        return null;
    }

    getCurrentCommandSequence() {
        const currentBranch = this.history[this.branchIndex];
        return currentBranch.slice(0, this.positionInBranch);
    }

    enterCommandContext() {
        this.inCommandContext = true;
    }

    exitCommandContext() {
        this.inCommandContext = false;
    }
}
