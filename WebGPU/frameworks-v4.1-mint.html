const RENDER_SHADER = `
struct Uniforms {
  viewProj: mat4x4<f32>,
  cursor: vec3<f32>,
  showCursor: f32,
  paletteSize: u32,
  animTime: f32,
  showSelection: f32,
};

struct Instance {
  px: f32, py: f32, pz: f32, scale: f32,
  rx: f32, ry: f32, rz: f32, colorIdx: u32,
  ux: f32, uy: f32, uz: f32, flags: u32,
  nx: f32, ny: f32, nz: f32, frameId: u32,
};

@group(0) @binding(0) var<uniform> u: Uniforms;
@group(0) @binding(1) var<storage, read> visible: array<u32>;
@group(0) @binding(2) var<storage, read> instances: array<Instance>;
@group(0) @binding(3) var<storage, read> palette: array<vec4<f32>>;

struct V2F { @builtin(position) pos: vec4<f32>, @location(0) col: vec4<f32> };

@vertex fn vs_frame(@location(0) lp: vec4<f32>, @builtin(instance_index) ii: u32) -> V2F {
  let idx = visible[ii];
  let inst = instances[idx];

  let basis = mat3x3<f32>(
    vec3<f32>(inst.rx, inst.ry, inst.rz),
    vec3<f32>(inst.ux, inst.uy, inst.uz),
    vec3<f32>(inst.nx, inst.ny, inst.nz),
  );

  // Scale only the centerline, keep perp offset fixed (constant line thickness)
  let center = vec3<f32>(lp.x * inst.scale, lp.y * inst.scale, 0.0);
  let perp   = vec3<f32>(lp.z, lp.w, 0.0);
  var p = basis * (center + perp);
  p += vec3<f32>(inst.px, inst.py, inst.pz);

  var o: V2F;
  o.pos = u.viewProj * vec4<f32>(p, 1.0);

  let phase = f32(inst.colorIdx % u.paletteSize) + u.animTime;
  let ci = u32(phase) % u.paletteSize;
  let cn = (ci + 1u) % u.paletteSize;
  var c = mix(palette[ci], palette[cn], fract(phase));
  if ((inst.flags & 1u) != 0u && u.showSelection > 0.5) { c = mix(c, vec4<f32>(1.0,1.0,1.0,1.0), 0.4); }
  o.col = c;
  return o;
}

@fragment fn fs_frame(v: V2F) -> @location(0) vec4<f32> { return v.col; }

@vertex fn vs_cursor(@location(0) lp: vec3<f32>) -> V2F {
  var p = lp * 0.15 + u.cursor;
  var o: V2F;
  o.pos = u.viewProj * vec4<f32>(p, 1.0);
  o.col = vec4<f32>(1.0, 1.0, 1.0, 0.7);
  if (u.showCursor < 0.5) { o.pos = vec4<f32>(0.0, 0.0, -2.0, 1.0); }
  return o;
}
@fragment fn fs_cursor(v: V2F) -> @location(0) vec4<f32> { return v.col; }
`;

const CULL_SHADER = `
struct CullUniforms {
  planes: array<vec4<f32>, 6>,
  totalInstances: u32,
};

struct Instance {
  px: f32, py: f32, pz: f32, scale: f32,
  rx: f32, ry: f32, rz: f32, colorIdx: u32,
  ux: f32, uy: f32, uz: f32, flags: u32,
  nx: f32, ny: f32, nz: f32, frameId: u32,
};

struct IndirectArgs {
  indexCount: u32,
  instanceCount: atomic<u32>,
  firstIndex: u32,
  baseVertex: u32,
  firstInstance: u32,
};

@group(0) @binding(0) var<uniform> cu: CullUniforms;
@group(0) @binding(1) var<storage, read> instances: array<Instance>;
@group(0) @binding(2) var<storage, read_write> visible: array<u32>;
@group(0) @binding(3) var<storage, read_write> indirect: IndirectArgs;

@compute @workgroup_size(256)
fn cull_main(@builtin(global_invocation_id) gid: vec3<u32>) {
  let i = gid.x;
  if (i >= cu.totalInstances) { return; }

  let inst = instances[i];
  let pos = vec3<f32>(inst.px, inst.py, inst.pz);
  let radius = inst.scale * 0.9;

  var inside = true;
  for (var p = 0u; p < 6u; p++) {
    let plane = cu.planes[p];
    let dist = dot(plane.xyz, pos) + plane.w;
    if (dist < -radius) {
      inside = false;
      break;
    }
  }

  if (inside && (inst.flags & 2u) != 0u) {
    let slot = atomicAdd(&indirect.instanceCount, 1u);
    visible[slot] = i;
  }
}
`;

// ============================================================
// FRUSTUM PLANE EXTRACTION
// ============================================================
function extractFrustumPlanes(vp) {
  const r0 = [vp[0], vp[4], vp[8],  vp[12]];
  const r1 = [vp[1], vp[5], vp[9],  vp[13]];
  const r2 = [vp[2], vp[6], vp[10], vp[14]];
  const r3 = [vp[3], vp[7], vp[11], vp[15]];

  const planes = new Float32Array(24);
  function setPlane(idx, a, b, c, d) {
    const len = sqrt(a*a + b*b + c*c);
    planes[idx*4]=a/len; planes[idx*4+1]=b/len; planes[idx*4+2]=c/len; planes[idx*4+3]=d/len;
  }
  setPlane(0, r3[0]+r0[0], r3[1]+r0[1], r3[2]+r0[2], r3[3]+r0[3]);
  setPlane(1, r3[0]-r0[0], r3[1]-r0[1], r3[2]-r0[2], r3[3]-r0[3]);
  setPlane(2, r3[0]+r1[0], r3[1]+r1[1], r3[2]+r1[2], r3[3]+r1[3]);
  setPlane(3, r3[0]-r1[0], r3[1]-r1[1], r3[2]-r1[2], r3[3]-r1[3]);
  setPlane(4, r3[0]+r2[0], r3[1]+r2[1], r3[2]+r2[2], r3[3]+r2[3]);
  setPlane(5, r3[0]-r2[0], r3[1]-r2[1], r3[2]-r2[2], r3[3]-r2[3]);
  return planes;
}

// ============================================================
// CAMERA CONTROLLER
// ============================================================
class Camera {
  constructor(canvas) {
    this.theta = PI/4; this.phi = PI/6; this.dist = 30;
    this.fov = PI/4;
    this.target = [0, 0, 0];
    this.eye = new Float32Array(3);
    this.view = new Float32Array(16);
    this.proj = new Float32Array(16);
    this.vp = new Float32Array(16);
    this._dirty = true;
    this._dragging = false; this._panning = false;
    this._lx = 0; this._ly = 0;

    canvas.addEventListener('mousedown', e => {
      if (e.button === 0 && !e.altKey) { this._dragging = true; }
      else if (e.button === 2 || (e.button === 0 && e.altKey)) { this._panning = true; }
      this._lx = e.clientX; this._ly = e.clientY; e.preventDefault();
    });
    window.addEventListener('mousemove', e => {
      if (!this._dragging && !this._panning) return;
      const dx = e.clientX - this._lx, dy = e.clientY - this._ly;
      this._lx = e.clientX; this._ly = e.clientY;
      if (this._dragging) {
        this.theta -= dx * 0.005;
        this.phi = clamp(this.phi + dy * 0.005, -PI/2+0.01, PI/2-0.01);
        this._dirty = true;
      } else {
        const s = this.dist * 0.002;
        const rx = -cos(this.theta), rz = sin(this.theta);
        const ux = -sin(this.phi)*sin(this.theta), uy = cos(this.phi), uz = -sin(this.phi)*cos(this.theta);
        this.target[0] += (-dx*rx + dy*ux)*s;
        this.target[1] += dy*uy*s;
        this.target[2] += (-dx*rz + dy*uz)*s;
        this._dirty = true;
      }
    });
    window.addEventListener('mouseup', () => { this._dragging = false; this._panning = false; });
    canvas.addEventListener('wheel', e => {
      this.dist = clamp(this.dist * (1 + e.deltaY * 0.001), 0.5, 2000);
      this._dirty = true; e.preventDefault();
    }, { passive: false });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
  }

  update(aspect) {
    this.eye[0] = this.target[0] + this.dist * cos(this.phi) * sin(this.theta);
    this.eye[1] = this.target[1] + this.dist * sin(this.phi);
    this.eye[2] = this.target[2] + this.dist * cos(this.phi) * cos(this.theta);
    // Derive up from theta so it never degenerates at the poles.
    // right = [cos(theta), 0, -sin(theta)] (always horizontal, never collinear with eye-target)
    // up = right × forward
    const rx = cos(this.theta), rz = -sin(this.theta);
    const fx = this.target[0]-this.eye[0], fy = this.target[1]-this.eye[1], fz = this.target[2]-this.eye[2];
    const fl = sqrt(fx*fx+fy*fy+fz*fz);
    const fdx=fx/fl, fdy=fy/fl, fdz=fz/fl;
    let ux = 0*fdz - rz*fdy,  // right × forward
        uy = rz*fdx - rx*fdz,
        uz = rx*fdy - 0*fdx;
    const ul = sqrt(ux*ux+uy*uy+uz*uz); ux/=ul; uy/=ul; uz/=ul;
    mat4LookAt(this.view, this.eye, this.target, [ux,uy,uz]);
    mat4Perspective(this.proj, this.fov, aspect, 0.1, 2000);
    mat4Mul(this.vp, this.proj, this.view);
    const d = this._dirty; this._dirty = false; return d;
  }

  invalidate() { this._dirty = true; }
}

// ============================================================
// CONTEXT STACK
// Each entry: { frameId: null|number, camera: snapshot }
// frameId null = root context (all root-level frames)
// ============================================================
const contextStack = [{ frameId: null }];
function currentContextId() { return contextStack[contextStack.length - 1].frameId; }

// ============================================================
// WORLD TRANSFORM PASS
// Computes world-space position/basis for every frame by
// walking the parentId chain. Root frames are unchanged.
// Children: world_pos = parent_basis * local_pos + parent_world_pos
//           world_basis = parent_basis * local_basis
// Frames outside the current context subtree are hidden (scale=0).
// Result is written into worldData (Float32Array, same layout as store.data).
// ============================================================
function computeWorldTransforms(store, worldData) {
    const n = store.count;
    if (n === 0) return;

    const f32 = store.f32;
    const u32 = store.u32;
    const wf32 = worldData;
    const wu32 = new Uint32Array(worldData.buffer);

    // Copy all data first (handles u32 fields: colorIdx, flags, frameId)
    const words = n * FLOATS_PER_INSTANCE;
    for (let i = 0; i < words; i++) wu32[i] = u32[i];

    // Build frameId -> array index map for parent lookups
    const idToIdx = new Map();
    for (let i = 0; i < n; i++) {
        idToIdx.set(u32[i * FLOATS_PER_INSTANCE + U.FRAME_ID], i);
    }

    // Determine which frames are visible in the current context.
    // At root (contextStack depth 1): frames with parentId===null are "top level",
    // but we render ALL frames (children included) with world transforms applied.
    // Inside a superframe: render only frames whose ancestor chain includes the current superframe.
    const ctxId = currentContextId();

    function getAncestors(idx, out) {
        out.push(idx);
        const meta = store.metadata[idx];
        if (!meta || meta.parentId === null) return;
        const parentIdx = idToIdx.get(meta.parentId);
        if (parentIdx !== undefined) getAncestors(parentIdx, out);
    }

    function isInContext(idx) {
        if (ctxId === null) return true; // root: show everything
        const meta = store.metadata[idx];
        if (!meta) return false;
        // Walk up parent chain looking for ctxId
        let cur = idx;
        while (cur !== undefined) {
            const m = store.metadata[cur];
            if (!m) break;
            if (m.parentId === ctxId) return true; // direct child of current context
            if (m.parentId === null) break;
            cur = idToIdx.get(m.parentId);
        }
        return false;
    }

    // For each frame, compute world transform by walking parent chain
    // Use iterative approach: process frames whose parents are already computed.
    // Since we may have arbitrary depth, do a simple multi-pass until stable.
    const worldComputed = new Uint8Array(n); // 0=pending, 1=done

    // First pass: root frames (parentId===null) are already correct from copy above
    for (let i = 0; i < n; i++) {
        if (!store.metadata[i] || store.metadata[i].parentId === null) {
            worldComputed[i] = 1;
        }
    }

    // Iterative passes for child frames
    let changed = true;
    while (changed) {
        changed = false;
        for (let i = 0; i < n; i++) {
            if (worldComputed[i]) continue;
            const meta = store.metadata[i];
            if (!meta || meta.parentId === null) { worldComputed[i] = 1; continue; }
            const pIdx = idToIdx.get(meta.parentId);
            if (pIdx === undefined || !worldComputed[pIdx]) continue;

            // Parent world transform is ready — compute this frame's world transform
            const po = pIdx * FLOATS_PER_INSTANCE;
            const co = i * FLOATS_PER_INSTANCE;

            // Parent world basis columns
            const prx = wf32[po+F.RX], pry = wf32[po+F.RY], prz = wf32[po+F.RZ];
            const pux = wf32[po+F.UX], puy = wf32[po+F.UY], puz = wf32[po+F.UZ];
            const pnx = wf32[po+F.NX], pny = wf32[po+F.NY], pnz = wf32[po+F.NZ];
            const ppx = wf32[po+F.PX], ppy = wf32[po+F.PY], ppz = wf32[po+F.PZ];

            // Child local position and basis
            const clx = f32[co+F.PX], cly = f32[co+F.PY], clz = f32[co+F.PZ];
            const crrx = f32[co+F.RX], crry = f32[co+F.RY], crrz = f32[co+F.RZ];
            const cux = f32[co+F.UX], cuy = f32[co+F.UY], cuz = f32[co+F.UZ];
            const cnx = f32[co+F.NX], cny = f32[co+F.NY], cnz = f32[co+F.NZ];

            // World position = parent_basis * child_local_pos + parent_world_pos
            wf32[co+F.PX] = prx*clx + pux*cly + pnx*clz + ppx;
            wf32[co+F.PY] = pry*clx + puy*cly + pny*clz + ppy;
            wf32[co+F.PZ] = prz*clx + puz*cly + pnz*clz + ppz;

            // World basis = parent_basis * child_local_basis
            wf32[co+F.RX] = prx*crrx + pux*crry + pnx*crrz;
            wf32[co+F.RY] = pry*crrx + puy*crry + pny*crrz;
            wf32[co+F.RZ] = prz*crrx + puz*crry + pnz*crrz;

            wf32[co+F.UX] = prx*cux + pux*cuy + pnx*cuz;
            wf32[co+F.UY] = pry*cux + puy*cuy + pny*cuz;
            wf32[co+F.UZ] = prz*cux + puz*cuy + pnz*cuz;

            wf32[co+F.NX] = prx*cnx + pux*cny + pnx*cnz;
            wf32[co+F.NY] = pry*cnx + puy*cny + pny*cnz;
            wf32[co+F.NZ] = prz*cnx + puz*cny + pnz*cnz;

            worldComputed[i] = 1;
            changed = true;
        }
    }

    // Apply context filter: hide frames not in current context subtree by zeroing scale.
    // Always show the superframe that IS the current context (the container you're inside).
    if (ctxId !== null) {
        const ctxFrameIdx = idToIdx.get(ctxId);
        for (let i = 0; i < n; i++) {
            if (ctxFrameIdx !== undefined && i === ctxFrameIdx) continue; // always show container
            if (!isInContext(i)) {
                wf32[i * FLOATS_PER_INSTANCE + F.SCALE] = 0;
            }
        }
    }
}

// ============================================================
// WEBGPU INIT + COMMAND STRING LOADER
// ============================================================
async function main() {
  const canvas = document.getElementById('canvas');
  const labelCanvas = document.getElementById('label-canvas');
  const labelCtx = labelCanvas.getContext('2d');
  let showLabels = false;
  const errEl = document.getElementById('error-msg');

  if (!navigator.gpu) { errEl.style.display='block'; errEl.textContent='WebGPU not supported. Use Chrome 113+.'; return; }
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) { errEl.style.display='block'; errEl.textContent='No WebGPU adapter.'; return; }

  const limits = adapter.limits;
  const device = await adapter.requestDevice({
    requiredLimits: {
      maxStorageBufferBindingSize: min(MAX_INSTANCES * BYTES_PER_INSTANCE, limits.maxStorageBufferBindingSize),
      maxBufferSize: min(MAX_INSTANCES * BYTES_PER_INSTANCE, limits.maxBufferSize),
      maxComputeWorkgroupsPerDimension: limits.maxComputeWorkgroupsPerDimension,
    },
  });

  const ctx = canvas.getContext('webgpu');
  const fmt = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format: fmt, alphaMode: 'opaque' });

  const frameGeo = buildFrameGeo();
  const frameVB = device.createBuffer({ size: frameGeo.verts.byteLength, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(frameVB, 0, frameGeo.verts);
  const frameIB = device.createBuffer({ size: frameGeo.idx.byteLength, usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(frameIB, 0, frameGeo.idx);
  const frameIdxCount = frameGeo.idx.length;

  const curGeo = buildCursorGeo();
  const curVB = device.createBuffer({ size: curGeo.verts.byteLength, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(curVB, 0, curGeo.verts);
  const curIB = device.createBuffer({ size: curGeo.idx.byteLength, usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(curIB, 0, curGeo.idx);
  const curIdxCount = curGeo.idx.length;

  const maxBytes = MAX_INSTANCES * BYTES_PER_INSTANCE;

  const instanceBuf = device.createBuffer({ size: maxBytes, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  // worldBuf holds world-space transforms computed from local coords + parent chain.
  // Render/cull pipelines read from worldBuf; instanceBuf stays as source-of-truth local coords.
  const worldBuf = device.createBuffer({ size: maxBytes, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const visibleBuf = device.createBuffer({ size: MAX_INSTANCES * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const indirectBuf = device.createBuffer({ size: 20, usage: GPUBufferUsage.INDIRECT | GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC });
  const MAX_PALETTE_COLORS = 80;
  const paletteBuf = device.createBuffer({ size: MAX_PALETTE_COLORS * 4 * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });

  const uniformBuf = device.createBuffer({ size: 96, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const cullUniformBuf = device.createBuffer({ size: 112, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const readbackBuf = device.createBuffer({ size: 20, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });

  const renderShader = device.createShaderModule({ code: RENDER_SHADER });
  const cullShader = device.createShaderModule({ code: CULL_SHADER });

  const renderBGL = device.createBindGroupLayout({ entries: [
    { binding: 0, visibility: GPUShaderStage.VERTEX, buffer: { type: 'uniform' } },
    { binding: 1, visibility: GPUShaderStage.VERTEX, buffer: { type: 'read-only-storage' } },
    { binding: 2, visibility: GPUShaderStage.VERTEX, buffer: { type: 'read-only-storage' } },
    { binding: 3, visibility: GPUShaderStage.VERTEX, buffer: { type: 'read-only-storage' } },
  ]});

  const renderBG = device.createBindGroup({ layout: renderBGL, entries: [
    { binding: 0, resource: { buffer: uniformBuf } },
    { binding: 1, resource: { buffer: visibleBuf } },
    { binding: 2, resource: { buffer: worldBuf } },
    { binding: 3, resource: { buffer: paletteBuf } },
  ]});

  const vbl      = { arrayStride: 12, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }] };
  const frameVbl = { arrayStride: 16, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x4' }] };
  const depthFormat = 'depth24plus';
  const SAMPLE_COUNT = 4;

  const framePipeline = device.createRenderPipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts: [renderBGL] }),
    vertex: { module: renderShader, entryPoint: 'vs_frame', buffers: [frameVbl] },
    fragment: { module: renderShader, entryPoint: 'fs_frame', targets: [{ format: fmt }] },
    primitive: { topology: 'triangle-list', cullMode: 'none' },
    depthStencil: { format: depthFormat, depthWriteEnabled: true, depthCompare: 'less' },
    multisample: { count: SAMPLE_COUNT },
  });

  const cursorPipeline = device.createRenderPipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts: [renderBGL] }),
    vertex: { module: renderShader, entryPoint: 'vs_cursor', buffers: [vbl] },
    fragment: { module: renderShader, entryPoint: 'fs_cursor', targets: [{ format: fmt }] },
    primitive: { topology: 'triangle-list', cullMode: 'none' },
    depthStencil: { format: depthFormat, depthWriteEnabled: true, depthCompare: 'less' },
    multisample: { count: SAMPLE_COUNT },
  });

  const cullBGL = device.createBindGroupLayout({ entries: [
    { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
    { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'read-only-storage' } },
    { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
    { binding: 3, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
  ]});

  const cullBG = device.createBindGroup({ layout: cullBGL, entries: [
    { binding: 0, resource: { buffer: cullUniformBuf } },
    { binding: 1, resource: { buffer: worldBuf } },
    { binding: 2, resource: { buffer: visibleBuf } },
    { binding: 3, resource: { buffer: indirectBuf } },
  ]});

  const cullPipeline = device.createComputePipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts: [cullBGL] }),
    compute: { module: cullShader, entryPoint: 'cull_main' },
  });

  let depthTex, msaaTex, captureTex, captureBuf, captureW, captureH;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    labelCanvas.width = canvas.width;
    labelCanvas.height = canvas.height;
    if (depthTex) depthTex.destroy();
    if (msaaTex) msaaTex.destroy();
    if (captureTex) captureTex.destroy();
    if (captureBuf) captureBuf.destroy();
    captureW = canvas.width;
    captureH = canvas.height;
    depthTex = device.createTexture({ size: [captureW, captureH], format: depthFormat, sampleCount: SAMPLE_COUNT, usage: GPUTextureUsage.RENDER_ATTACHMENT });
    msaaTex = device.createTexture({ size: [captureW, captureH], format: fmt, sampleCount: SAMPLE_COUNT, usage: GPUTextureUsage.RENDER_ATTACHMENT });
    // Capture target — same format as swap chain so msaaTex can resolve into it
    captureTex = device.createTexture({ size: [captureW, captureH], format: fmt, usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
    const bytesPerRow = Math.ceil(captureW * 4 / 256) * 256;
    captureBuf = device.createBuffer({ size: bytesPerRow * captureH, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  }
  window.addEventListener('resize', resize);
  resize();

  // App state
  const store = new FrameStore();
  const palette = new PaletteManager();
  device.queue.writeBuffer(paletteBuf, 0, palette.toFloat32Array());
  const cam = new Camera(canvas);
  const executor = new CommandExecutor(store, palette, cam);
  executor.onNameWritten = () => { showLabels = true; };
  executor.gpuLineUpdate = (hw, ext) => {
    const geo = buildFrameGeo(hw, ext);
    device.queue.writeBuffer(frameVB, 0, geo.verts);
  };

  executor.paletteEditContext.onPaletteChanged = () => {
    const data = palette.toFloat32Array();
    device.queue.writeBuffer(paletteBuf, 0, data);
    buildPaletteGrid(palette);
  };

  // Auto-execute: when loaded as an on-chain token the renderer injects
  // `let autoExecuteCommand = '...'` before this script runs.
  let showUI = true;
  let showSelection = true;
  // Stores the condensed command string for minting.
  // Set to the literal bar input when executed via the command bar,
  // or re-condensed from keystrokes when built interactively.
  let mintCommandString = '';
  if (typeof autoExecuteCommand !== 'undefined' && autoExecuteCommand) {
    executor.executeCommandString(autoExecuteCommand);
    store.deselectAll();
    mintCommandString = autoExecuteCommand;
    showUI = false;
    document.getElementById('command-bar').style.display = 'none';
  }

  // Build palette grid
  function buildPaletteGrid(pal) {
    const paletteGrid = document.getElementById('palette-grid');
    paletteGrid.innerHTML = '';
    const data = pal.toFloat32Array();
    for (let i = 0; i < pal.size; i++) {
      const cell = document.createElement('div');
      cell.className = 'palette-cell';
      const r = (data[i*4] * 255)|0;
      const g = (data[i*4+1] * 255)|0;
      const b = (data[i*4+2] * 255)|0;
      cell.style.background = `rgb(${r},${g},${b})`;
      paletteGrid.appendChild(cell);
    }
    const lbl = document.getElementById('palette-overlay-label');
    if (lbl) lbl.textContent = `Color Palette (${pal.size})`;
  }
  buildPaletteGrid(palette);

  // Command bar controls
  const commandInput = document.getElementById('command-input');
  const btnExecute = document.getElementById('btn-execute');
  const btnExport = document.getElementById('btn-export');
  const btnCopyHash = document.getElementById('btn-copy-hash');
  const sketchLogEl = document.getElementById('sketch-log');
  const btnCopySketch = document.getElementById('btn-copy-sketch');
  const btnHistUp = document.getElementById('btn-hist-up');
  const btnHistDown = document.getElementById('btn-hist-down');

  // Commitments history and sketch log state
  const commitments = [];
  let commitmentIdx = -1; // index into commitments for history browsing (-1 = tip)

  const btnStop = document.getElementById('btn-stop');

  // Parse P(source[id]) prefix from a command string.
  // Returns { source, tokenId, rest } or null if no prefix.
  function parsePalettePrefix(cmd) {
    const m = cmd.match(/^P\((\w+)\[(\d+)\]\)/);
    if (!m) return null;
    return { source: m[1], tokenId: parseInt(m[2]), rest: cmd.slice(m[0].length) };
  }

  // Build the P(...) prefix string from the current palette source UI state.
  function buildPalettePrefix() {
    const source = paletteSourceSelect.value;
    if (source === 'default') return '';
    const tokenId = paletteTokenIdInput.value.trim();
    if (!tokenId) return '';
    return `P(${source}[${tokenId}])`;
  }

  // Strip any existing P(...) prefix and replace with the current one.
  function syncCommandPrefix() {
    let cmd = commandInput.value.trim();
    // Strip existing prefix if present
    const existing = parsePalettePrefix(cmd);
    if (existing) cmd = existing.rest;
    const prefix = buildPalettePrefix();
    commandInput.value = prefix + cmd;
  }

  async function doExecute(cmd) {
    executor.stopPlayback();
    store.clear();
    executor.resetAll();
    cam.theta = Math.PI/4; cam.phi = Math.PI/6; cam.dist = 30;
    cam.target = [0, 0, 0]; cam.invalidate();

    // Parse and apply palette prefix before running geometry
    const prefixed = parsePalettePrefix(cmd);
    const geomCmd = prefixed ? prefixed.rest : cmd;

    if (prefixed && prefixed.source !== 'default') {
      await loadExternalPalette(prefixed.source, prefixed.tokenId);
    } else {
      palette.reset();
      device.queue.writeBuffer(paletteBuf, 0, palette.toFloat32Array());
      buildPaletteGrid(palette);
    }

    mintCommandString = cmd;

    const isPlayback = geomCmd.includes('~(') || /,\d+\.\)/.test(geomCmd);
    if (isPlayback) {
      btnStop.style.display = '';
      executor.playCommandString(geomCmd).then(() => { btnStop.style.display = 'none'; });
    } else {
      executor.executeCommandString(geomCmd);
    }

    if (mintPanel.classList.contains('active')) updateMintCommand();
    // Push to commitments if it's a new string at the tip
    if (commitmentIdx === -1 || commitments[commitments.length - 1] !== cmd) {
      commitments.push(cmd);
    }
    commitmentIdx = -1; // return to tip
    sketchLogEl.value = ''; // reset sketch on new commitment
  }

  btnStop.addEventListener('click', () => {
    executor.stopPlayback();
    btnStop.style.display = 'none';
  });

  btnExecute.addEventListener('click', () => {
    const cmd = commandInput.value.trim();
    if (cmd) doExecute(cmd);
  });

  btnHistUp.addEventListener('click', () => {
    if (commitments.length === 0) return;
    if (commitmentIdx === -1) commitmentIdx = commitments.length - 1;
    else commitmentIdx = Math.max(0, commitmentIdx - 1);
    commandInput.value = commitments[commitmentIdx];
  });

  btnHistDown.addEventListener('click', () => {
    if (commitmentIdx === -1) return;
    commitmentIdx++;
    if (commitmentIdx >= commitments.length) {
      commitmentIdx = -1;
      commandInput.value = '';
    } else {
      commandInput.value = commitments[commitmentIdx];
    }
  });

  btnCopySketch.addEventListener('click', () => {
    if (!sketchLogEl.value.trim()) return;
    const compressed = executor.condenseCommandString(sketchLogEl.value.trim());
    const existing = commandInput.value.trim();
    commandInput.value = existing ? existing + compressed : compressed;
  });

  document.getElementById('bracket-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      executor.selectionContext.submitBracketInput(e.target.value);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      executor.selectionContext.closeBracketInput();
    }
  });

  document.getElementById('palette-bracket-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      executor._paletteSubmitBracketInput(e.target.value);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      executor._paletteCloseBracketInput();
    }
    e.stopPropagation();
  });

  // Track last slash command, repeat count, and where it starts in the sketch log
  let lastSlashCmd = '';
  let lastSlashRepeatCount = 1;
  let lastSlashSketchStart = -1; // char index in sketchLogEl.value where the run begins

  function runSlashCmd(cmd) {
    executor.executeCommandString(cmd);
    lastSlashSketchStart = sketchLogEl.value.length;
    sketchLogEl.value += cmd;
    lastSlashCmd = cmd;
    lastSlashRepeatCount = 1;
  }

  document.getElementById('slash-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const cmd = e.target.value.trim();
      const overlay = document.getElementById('slash-overlay');
      overlay.classList.remove('active');
      if (cmd) runSlashCmd(cmd);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      document.getElementById('slash-overlay').classList.remove('active');
    }
  });

  commandInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const cmd = commandInput.value.trim();
      if (cmd) doExecute(cmd);
      commandInput.blur();
    } else if (e.key === 'Escape') {
      commandInput.blur();
      e.preventDefault();
    }
  });

  btnExport.addEventListener('click', () => {
    const seq = executor.commandTree.getCurrentCommandSequence();
    const joined = seq.join('');
    const condensed = executor.condenseCommandString(joined);
    commandInput.value = condensed;
    console.log('Exported command string:', condensed);
  });

  btnCopyHash.addEventListener('click', () => {
    const seq = executor.commandTree.getCurrentCommandSequence();
    const joined = seq.join('');
    const condensed = executor.condenseCommandString(joined);
    const url = `${window.location.origin}${window.location.pathname}#${encodeURIComponent(condensed)}`;
    navigator.clipboard.writeText(url).then(() => {
      console.log('Copied to clipboard:', url);
      alert('Hash URL copied to clipboard!');
    });
  });

  // URL hash loader
  window.addEventListener('load', () => {
    const hash = window.location.hash.slice(1);
    if (hash) {
      const cmd = decodeURIComponent(hash);
      commandInput.value = cmd;
      console.log('Loading command string from URL hash:', cmd);
      executor.executeCommandString(cmd);
    }
  });

  // Input - wire CommandExecutor
  window.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'H') {
      showSelection = !showSelection;
      return;
    }
    if (e.key === '?') {
      showUI = !showUI;
      document.getElementById('command-bar').style.display = showUI ? '' : 'none';
      if (!showUI) document.getElementById('mint-panel').classList.remove('active');
      if (showUI && mintCommandString && !commandInput.value) {
        commandInput.value = mintCommandString;
      }
      return;
    }
    if (e.key === '/') {
      e.preventDefault();
      const overlay = document.getElementById('slash-overlay');
      const input = document.getElementById('slash-input');
      overlay.classList.add('active');
      setTimeout(() => { input.value = ''; input.focus(); }, 0);
      return;
    }
    if (e.key === '%') {
      const camCtx = executor.cameraContext;
      if (camCtx.autoOrbit && !showUI) {
        // Already in presentation mode — exit

          cam.phi = Math.PI / 6;
          cam.invalidate();

        camCtx.autoOrbitPaused = false;
        camCtx.orbitTheta = cam.theta;
        camCtx.orbitPhi = cam.phi;
        camCtx.orbitVelocityTheta = 0.15;
        camCtx.orbitVelocityPhi = 0;
        store.deselectAll();
        showUI = false;
        document.getElementById('command-bar').style.display = 'none';
        document.getElementById('mint-panel').classList.remove('active');
      }
      return;

      e.preventDefault();
      showLabels = !showLabels;
      return;

      // alt+o = full image, plain o = square crop (centered)
      pendingCapture = e.altKey ? 'full' : 'square';
      return;
    }
    if (e.key === 'O') {
      // SVG export — project frame centerlines through VP matrix to screen coords
      const w = canvas.width, h = canvas.height;
      const vp = cam.vp; // column-major mat4
      const ext = 0.125; // must match buildFrameGeo ext default
      // 4 lines per frame: [lx1,ly1, lx2,ly2] in local space (z=0), scaled by inst.scale
      const localLines = [
        [-(0.5+ext),  0.5,    (0.5+ext),  0.5  ],  // top
        [-(0.5+ext), -0.5,    (0.5+ext), -0.5  ],  // bottom
        [ -0.5,     -(0.5+ext), -0.5,    (0.5+ext)],  // left
        [  0.5,     -(0.5+ext),  0.5,    (0.5+ext)],  // right
      ];
      function projectPt(wx, wy, wz) {
        const cx = vp[0]*wx + vp[4]*wy + vp[8]*wz  + vp[12];
        const cy = vp[1]*wx + vp[5]*wy + vp[9]*wz  + vp[13];
        const cw = vp[3]*wx + vp[7]*wy + vp[11]*wz + vp[15];
        if (cw <= 0) return null;
        return [( cx/cw * 0.5 + 0.5) * w,
                (-cy/cw * 0.5 + 0.5) * h];
      }
      const lines = [];
      for (let i = 0; i < store.count; i++) {
        if (!(store.u32[store._o(i) + U.FLAGS] & FLAG_VISIBLE)) continue;
        const o = store._o(i);
        const px = store.f32[o+F.PX], py = store.f32[o+F.PY], pz = store.f32[o+F.PZ];
        const sc = store.f32[o+F.SCALE];
        const rx = store.f32[o+F.RX], ry = store.f32[o+F.RY], rz = store.f32[o+F.RZ];
        const ux = store.f32[o+F.UX], uy = store.f32[o+F.UY], uz = store.f32[o+F.UZ];
        const ci = store.u32[o + U.COLOR_INDEX];
        const [r, g, b] = palette.colors[ci % palette.size];
        const col = `rgb(${(r*255)|0},${(g*255)|0},${(b*255)|0})`;
        for (const [lx1,ly1,lx2,ly2] of localLines) {
          const wx1 = rx*lx1*sc + ux*ly1*sc + px;
          const wy1 = ry*lx1*sc + uy*ly1*sc + py;
          const wz1 = rz*lx1*sc + uz*ly1*sc + pz;
          const wx2 = rx*lx2*sc + ux*ly2*sc + px;
          const wy2 = ry*lx2*sc + uy*ly2*sc + py;
          const wz2 = rz*lx2*sc + uz*ly2*sc + pz;
          const s1 = projectPt(wx1, wy1, wz1);
          const s2 = projectPt(wx2, wy2, wz2);
          if (s1 && s2) lines.push({ s1, s2, col });
        }
      }
      const dpr = window.devicePixelRatio || 1;
      const vw = (w / dpr)|0, vh = (h / dpr)|0;
      const bgR = (0.071*255)|0, bgG = (0.078*255)|0, bgB = (0.102*255)|0;
      let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${vw}" height="${vh}" viewBox="0 0 ${w} ${h}">\n`;
      svg += `<rect width="${w}" height="${h}" fill="rgb(${bgR},${bgG},${bgB})"/>\n`;
      for (const { s1, s2, col } of lines) {
        svg += `<line x1="${s1[0].toFixed(1)}" y1="${s1[1].toFixed(1)}" x2="${s2[0].toFixed(1)}" y2="${s2[1].toFixed(1)}" stroke="${col}" stroke-width="1.5" stroke-linecap="square"/>\n`;
      }
      svg += '</svg>';
      const blob = new Blob([svg], { type: 'image/svg+xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'frameworks.svg';
      a.click();
      URL.revokeObjectURL(a.href);
      return;
    }
    // 'n' key: repeat last slash command, accumulate in sketch log as (cmd,n)
    if (e.key === 'n' && lastSlashCmd && lastSlashSketchStart !== -1) {
      executor.executeCommandString(lastSlashCmd);
      lastSlashRepeatCount++;
      // Replace everything from lastSlashSketchStart onward with (cmd,n)
      const prefix = sketchLogEl.value.slice(0, lastSlashSketchStart);
      sketchLogEl.value = prefix + `(${lastSlashCmd},${lastSlashRepeatCount})`;
      return;
    }

    executor.executeKey(e.key, e.shiftKey);
    // Append to sketch log for meaningful keys only
    const SKETCH_KEYS = new Set([
      'F','f','d','D','x','t','T','s','S','r','R','e','E','h','H',
      'q','Q','a','A','c','C','z','Z',' ','m','p','P','v','#',
      'i','j','k','l','I','J','K','L',
      '0','1','2','3','4','5','6',
    ]);
    if (SKETCH_KEYS.has(e.key)) {
      sketchLogEl.value += e.key;
    }
  });

  // Render loop
  let visibleCount = 0;
  let pendingReadback = false;
  let mapInFlight = false;
  let pendingCapture = false;
  let captureInFlight = false;
  let fpsFrames = 0, fpsLast = performance.now(), fps = 0;

  const indirectReset = new Uint32Array([frameIdxCount, 0, 0, 0, 0]);

  let lastFrameTime = performance.now();
  function frame() {
    requestAnimationFrame(frame);

    fpsFrames++;
    const now = performance.now();
    const deltaTime = (now - lastFrameTime) / 1000; // Convert to seconds
    lastFrameTime = now;
    if (now - fpsLast > 500) { fps = (fpsFrames / (now-fpsLast) * 1000)|0; fpsFrames=0; fpsLast=now; }

    executor.updateAnimation(now);
    executor.cameraContext.updateAutoOrbit(deltaTime);

    const n = store.count;

    const dirty = store.getDirtyRange();
    if (dirty && n > 0) {
      // Keep instanceBuf in sync (local coords, source of truth)
      device.queue.writeBuffer(instanceBuf, dirty.offset, store.data, dirty.offset, dirty.length);
      store.clearDirty();
    }

    // Compute world-space transforms and upload to worldBuf every frame.
    // This is cheap for typical scene sizes and handles parent moves for free.
    if (n > 0) {
      const worldData = new Float32Array(n * FLOATS_PER_INSTANCE);
      computeWorldTransforms(store, worldData);
      device.queue.writeBuffer(worldBuf, 0, worldData.buffer, 0, n * BYTES_PER_INSTANCE);
    }

    const aspect = canvas.width / canvas.height;
    cam.fov = executor.cameraContext.fov;
    cam.update(aspect);

    const uniformData = new ArrayBuffer(96);
    const uniformF32 = new Float32Array(uniformData);
    const uniformU32 = new Uint32Array(uniformData);
    uniformF32.set(cam.vp, 0);
    uniformF32[16] = executor.cursor.x; uniformF32[17] = executor.cursor.y; uniformF32[18] = executor.cursor.z;
    uniformF32[19] = showUI ? 1 : 0;
    uniformU32[20] = palette.size;
    uniformF32[21] = executor.animTime;
    uniformF32[22] = showSelection ? 1 : 0;
    device.queue.writeBuffer(uniformBuf, 0, uniformData);

    const planes = extractFrustumPlanes(cam.vp);
    const cullData = new ArrayBuffer(112);
    const cullF32 = new Float32Array(cullData);
    const cullU32 = new Uint32Array(cullData);
    cullF32.set(planes, 0);
    cullU32[24] = n;
    device.queue.writeBuffer(cullUniformBuf, 0, cullData);

    device.queue.writeBuffer(indirectBuf, 0, indirectReset);

    const enc = device.createCommandEncoder();

    if (n > 0) {
      const cp = enc.beginComputePass();
      cp.setPipeline(cullPipeline);
      cp.setBindGroup(0, cullBG);
      cp.dispatchWorkgroups(ceil(n / 256));
      cp.end();
    }

    function doRenderPass(resolveTarget) {
      const rp = enc.beginRenderPass({
        colorAttachments: [{
          view: msaaTex.createView(),
          resolveTarget,
          clearValue: { r:0.071, g:0.078, b:0.102, a:1 },
          loadOp:'clear', storeOp:'discard',
        }],
        depthStencilAttachment: { view: depthTex.createView(), depthClearValue: 1, depthLoadOp:'clear', depthStoreOp:'discard' },
      });
      if (n > 0) {
        rp.setPipeline(framePipeline);
        rp.setBindGroup(0, renderBG);
        rp.setVertexBuffer(0, frameVB);
        rp.setIndexBuffer(frameIB, 'uint16');
        rp.drawIndexedIndirect(indirectBuf, 0);
      }
      if (showUI) {
        rp.setPipeline(cursorPipeline);
        rp.setBindGroup(0, renderBG);
        rp.setVertexBuffer(0, curVB);
        rp.setIndexBuffer(curIB, 'uint16');
        rp.drawIndexed(curIdxCount, 1);
      }
      rp.end();
    }

    const tv = ctx.getCurrentTexture().createView();

    if (pendingCapture && !captureInFlight) {
      // Render into captureTex (for readback), then again into swap chain
      doRenderPass(captureTex.createView());
      const bytesPerRow = Math.ceil(captureW * 4 / 256) * 256;
      enc.copyTextureToBuffer(
        { texture: captureTex },
        { buffer: captureBuf, bytesPerRow, rowsPerImage: captureH },
        [captureW, captureH]
      );
      doRenderPass(tv);
      captureInFlight = pendingCapture; // 'full' or 'square'
      pendingCapture = false;
    } else {
      doRenderPass(tv);
    }

    if (!pendingReadback && fpsFrames % 30 === 0 && n > 0) {
      enc.copyBufferToBuffer(indirectBuf, 0, readbackBuf, 0, 20);
      pendingReadback = true;
    }

    device.queue.submit([enc.finish()]);

    if (captureInFlight) {
      const captureMode = captureInFlight;
      captureInFlight = false;
      const bytesPerRow = Math.ceil(captureW * 4 / 256) * 256;
      const isBGRA = fmt === 'bgra8unorm';
      captureBuf.mapAsync(GPUMapMode.READ).then(() => {
        const raw = new Uint8Array(captureBuf.getMappedRange());
        const imgData = new ImageData(captureW, captureH);
        for (let row = 0; row < captureH; row++) {
          const src = row * bytesPerRow;
          const dst = row * captureW * 4;
          for (let x = 0; x < captureW; x++) {
            const s = src + x * 4, d = dst + x * 4;
            imgData.data[d+0] = isBGRA ? raw[s+2] : raw[s+0];
            imgData.data[d+1] = raw[s+1];
            imgData.data[d+2] = isBGRA ? raw[s+0] : raw[s+2];
            imgData.data[d+3] = 255;
          }
        }
        captureBuf.unmap();
        const full = document.createElement('canvas');
        full.width = captureW;
        full.height = captureH;
        full.getContext('2d').putImageData(imgData, 0, 0);
        const outCanvas = document.createElement('canvas');
        if (captureMode === 'square') {
          const side = Math.min(captureW, captureH);
          const sx = ((captureW - side) / 2)|0;
          const sy = ((captureH - side) / 2)|0;
          outCanvas.width = side;
          outCanvas.height = side;
          outCanvas.getContext('2d').drawImage(full, sx, sy, side, side, 0, 0, side, side);
        } else {
          outCanvas.width = captureW;
          outCanvas.height = captureH;
          outCanvas.getContext('2d').drawImage(full, 0, 0);
        }
        outCanvas.toBlob(blob => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'frameworks.png';
          a.click();
          URL.revokeObjectURL(a.href);
        }, 'image/png');
      });
    }

    if (pendingReadback && !mapInFlight) {
      mapInFlight = true;
      readbackBuf.mapAsync(GPUMapMode.READ).then(() => {
        const d = new Uint32Array(readbackBuf.getMappedRange().slice(0));
        readbackBuf.unmap();
        visibleCount = d[1];
        pendingReadback = false;
        mapInFlight = false;
      }).catch(() => {
        pendingReadback = false;
        mapInFlight = false;
      });
    }

    // HUD
    if (showUI) {
      let modeText = executor.mode;
      if (executor.colorContext.active) modeText = 'color';
      if (executor.cameraContext.active) modeText = 'camera';
      if (executor.selectionContext.active) modeText = 'selection';
      if (executor.paletteEditContext.active) modeText = `palette (${palette.size} colors)`;
      if (executor.commandTree.inCommandContext) modeText = 'command';
      if (executor.animationActive) modeText += ` (animating  step:${executor.animationColorStep}  interval:${executor.animationInterval}ms)`;

      document.getElementById('mode-text').textContent = modeText;
      document.getElementById('view-text').textContent = `View: ${executor.currentView} ${VP[executor.currentView].name}`;
      document.getElementById('cursor-text').textContent = `Cursor: ${executor.cursor.x.toFixed(1)}, ${executor.cursor.y.toFixed(1)}, ${executor.cursor.z.toFixed(1)}`;
      document.getElementById('selection-text').textContent = `Sel: ${store.getSelectedCount()} / ${n}`;
      document.getElementById('fps-text').textContent = `FPS: ${fps}`;
      document.getElementById('draw-text').textContent = `Visible: ${visibleCount.toLocaleString()} / ${n.toLocaleString()}`;

      // Layers pane
      {
        // Breadcrumb: root > SF#3 > SF#7 ...
        const crumbEl = document.getElementById('layers-breadcrumb');
        let crumbHtml = '<span class="crumb active">root</span>';
        for (let ci = 1; ci < contextStack.length; ci++) {
          const sfId = contextStack[ci].frameId;
          const sfIdx = executor._findByFrameId(sfId);
          const label = sfIdx !== -1 && store.metadata[sfIdx] && store.metadata[sfIdx].called
            ? store.metadata[sfIdx].called
            : `SF#${sfId}`;
          const isActive = ci === contextStack.length - 1;
          crumbHtml += `<span class="sep">›</span><span class="crumb${isActive ? ' active' : ''}">${label}</span>`;
        }
        crumbEl.innerHTML = crumbHtml;

        // Frame list: all frames whose parentId === currentContextId()
        const ctxId = currentContextId();
        const listEl = document.getElementById('layers-list');
        let listHtml = '';
        let localIdx = 0;
        for (let i = 0; i < store.count; i++) {
          const meta = store.metadata[i];
          if (!meta || meta.parentId !== ctxId) continue;
          const isSel = !!(store.u32[store._o(i) + U.FLAGS] & FLAG_SELECTED);
          const isSF = meta.isSuperframe;
          const icon = isSF ? '▣' : '▪';
          const name = meta.called || (isSF ? `SF#${store.getFrameId(i)}` : `f${localIdx}`);
          const cls = ['layer-row', isSF ? 'superframe' : '', isSel ? 'selected' : ''].filter(Boolean).join(' ');
          listHtml += `<div class="${cls}"><span class="layer-icon">${icon}</span><span class="layer-name">${name}</span></div>`;
          localIdx++;
        }
        if (!listHtml) listHtml = '<div style="padding:6px 10px;color:#444;font-size:10px;">(empty)</div>';
        listEl.innerHTML = listHtml;
      }
    }
    document.getElementById('hud').className = showUI ? '' : 'hidden';
    document.getElementById('layers-pane').className = showUI ? '' : 'hidden';

    // 2D label overlay
    if (showLabels && n > 0) {
      labelCtx.clearRect(0, 0, labelCanvas.width, labelCanvas.height);
      const dpr = window.devicePixelRatio || 1;
      labelCtx.font = `${Math.round(13 * dpr)}px 'SF Mono', 'Fira Code', monospace`;
      labelCtx.textAlign = 'center';
      for (let i = 0; i < store.count; i++) {
        const meta = store.metadata[i];
        if (!meta.called) continue;
        const o = store._o(i);
        const px = store.f32[o], py = store.f32[o+1], pz = store.f32[o+2];
        // Project world pos to NDC via VP matrix
        const vp = cam.vp;
        const cx = vp[0]*px + vp[4]*py + vp[8]*pz  + vp[12];
        const cy = vp[1]*px + vp[5]*py + vp[9]*pz  + vp[13];
        const cw = vp[3]*px + vp[7]*py + vp[11]*pz + vp[15];
        if (cw <= 0) continue;
        const sx = ((cx / cw) * 0.5 + 0.5) * labelCanvas.width;
        const sy = ((1 - cy / cw) * 0.5) * labelCanvas.height;
        labelCtx.fillStyle = 'rgba(0,0,0,0.55)';
        const tw = labelCtx.measureText(meta.called).width;
        labelCtx.fillRect(sx - tw/2 - 4, sy - 14 * dpr, tw + 8, 18 * dpr);
        labelCtx.fillStyle = '#ddd';
        labelCtx.fillText(meta.called, sx, sy);
      }
    } else if (!showLabels) {
      labelCtx.clearRect(0, 0, labelCanvas.width, labelCanvas.height);
    }
  }

  requestAnimationFrame(frame);

  // ============================================================
  // MINT PANEL LOGIC
  // ============================================================
  const MINT_ABI = [
    "function create(string tokenName, string tokenDescription, bytes[] tokenArtifact, uint32 tokenRenderer, uint128 tokenData)",
    "function prepareArtifact(uint256 tokenId, bytes[] tokenArtifact, bool clear)",
    "function latestTokenId() view returns (uint256)",
    "function registerRenderer(address renderer) returns (uint256)",
    "function renderers(uint256) view returns (address)",
    "function mintOpenUntil(uint256 tokenId) view returns (uint256)",
  ];

  // ── External palette sources ──────────────────────────────────────────────

  const CHECKS_ADDR    = '0x036721e5A769Cc48B3189EFbb9ccE4471E8A48B1';
  const PUNKS_ADDR     = '0x0955b58e38fa8794723ac7b5ac99d2df67d55741';
  const TERRAFORMS_ADDR = '0x4e1f41613c9084fdb9e34e11fae9412427480e56';

  const CHECKS_ABI = [
    'function colors(uint256 tokenId) view returns (string[] colors, uint256[] colorBands)'
  ];
  const PUNKS_ABI = [
    'function punkImage(uint16 punkId) view returns (bytes)',
    'function backgroundOf(uint16 punkId) view returns (bytes4)'
  ];
  const TERRAFORMS_ABI = [
    'function tokenSupplementalData(uint256 tokenId) view returns (tuple(uint256 tokenId, uint256 level, uint256 xCoordinate, uint256 yCoordinate, int256 elevation, int256 structureSpaceX, int256 structureSpaceY, int256 structureSpaceZ, string zoneName, string[10] zoneColors, string[9] characterSet) data)'
  ];

  // Resolve a read-only provider. Prefers the connected wallet (avoids CORS).
  // Falls back to window.ethereum (MetaMask) without requesting accounts.
  // Throws if neither is available so the caller can show a useful message.
  function getReadProvider() {
    if (mintProvider) return mintProvider;
    if (window.ethereum) return new ethers.BrowserProvider(window.ethereum);
    throw new Error('No wallet found — connect MetaMask first to read contract data.');
  }

  async function loadExternalPalette(source, tokenId) {
    const statusEl = document.getElementById('palette-load-status');
    statusEl.textContent = `Loading ${source} #${tokenId}…`;
    try {
      const provider = getReadProvider();
      let hexColors;

      if (source === 'checks') {
        const contract = new ethers.Contract(CHECKS_ADDR, CHECKS_ABI, provider);
        const [colors] = await contract.colors(tokenId);
        // colors is string[] of hex values like '#FF00AA'
        hexColors = Array.from(colors);

      } else if (source === 'punks') {
        const contract = new ethers.Contract(PUNKS_ADDR, PUNKS_ABI, provider);
        // punkImage returns raw RGBA pixel bytes (24×24 = 576 pixels = 2304 bytes)
        const imgBytes = ethers.getBytes(await contract.punkImage(tokenId));
        // Extract distinct non-transparent colors
        const seen = new Set();
        hexColors = [];
        for (let i = 0; i < imgBytes.length; i += 4) {
          const a = imgBytes[i + 3];
          if (a === 0) continue; // skip transparent
          const r = imgBytes[i].toString(16).padStart(2,'0');
          const g = imgBytes[i+1].toString(16).padStart(2,'0');
          const b = imgBytes[i+2].toString(16).padStart(2,'0');
          const hex = `#${r}${g}${b}`;
          if (!seen.has(hex)) { seen.add(hex); hexColors.push(hex); }
        }

      } else if (source === 'terraforms') {
        const contract = new ethers.Contract(TERRAFORMS_ADDR, TERRAFORMS_ABI, provider);
        const data = await contract.tokenSupplementalData(tokenId);
        // zoneColors is string[10] of hex strings
        hexColors = Array.from(data.zoneColors || data[9]);

      } else {
        // default: reset to built-in 80-color palette
        palette.reset();
        device.queue.writeBuffer(paletteBuf, 0, palette.toFloat32Array());
        buildPaletteGrid(palette);
        executor.paletteEditContext.onPaletteChanged?.();
        statusEl.textContent = 'Reset to default palette.';
        return;
      }

      if (!hexColors || hexColors.length === 0) throw new Error('No colors returned');

      palette.setColors(hexColors);
      device.queue.writeBuffer(paletteBuf, 0, palette.toFloat32Array());
      buildPaletteGrid(palette);
      executor.paletteEditContext.onPaletteChanged?.();
      statusEl.textContent = `Loaded ${hexColors.length} colors from ${source} #${tokenId}.`;

    } catch (err) {
      statusEl.textContent = `Error: ${err.message}`;
      console.error('[palette]', err);
    }
  }

  // ── Palette source UI wiring ──────────────────────────────────────────────

  const paletteSourceSelect = document.getElementById('palette-source-select');
  const paletteTokenIdInput = document.getElementById('palette-token-id');
  const btnLoadPalette = document.getElementById('btn-load-palette');

  // Max token supply per collection (approximate — for randomize range)
  const PALETTE_SOURCE_MAX = { checks: 16031, punks: 9999, terraforms: 11104 };

  // Hide token ID input when "default" is selected; sync prefix on change
  paletteSourceSelect.addEventListener('change', () => {
    const isDefault = paletteSourceSelect.value === 'default';
    paletteTokenIdInput.style.display = isDefault ? 'none' : '';
    document.getElementById('btn-randomize-palette').style.display = isDefault ? 'none' : '';
    syncCommandPrefix();
  });
  paletteSourceSelect.dispatchEvent(new Event('change'));

  paletteTokenIdInput.addEventListener('change', syncCommandPrefix);

  btnLoadPalette.addEventListener('click', async () => {
    const source = paletteSourceSelect.value;
    const tokenId = parseInt(paletteTokenIdInput.value.trim(), 10);
    if (source !== 'default' && isNaN(tokenId)) {
      document.getElementById('palette-load-status').textContent = 'Enter a token ID.';
      return;
    }
    syncCommandPrefix();
    await loadExternalPalette(source, isNaN(tokenId) ? 0 : tokenId);
  });

  document.getElementById('btn-randomize-palette').addEventListener('click', async () => {
    const source = paletteSourceSelect.value;
    if (source === 'default') return;
    const max = PALETTE_SOURCE_MAX[source] ?? 9999;
    const tokenId = Math.floor(Math.random() * (max + 1));
    paletteTokenIdInput.value = tokenId;
    syncCommandPrefix();
    await loadExternalPalette(source, tokenId);
  });

  const mintPanel = document.getElementById('mint-panel');
  const btnMintToggle = document.getElementById('btn-mint-toggle');
  const btnWallet = document.getElementById('btn-wallet');
  const walletStatus = document.getElementById('wallet-status');
  const mintNameInput = document.getElementById('mint-name');
  const mintDesc = document.getElementById('mint-desc');
  const mintCmdDisplay = document.getElementById('mint-command-display');
  const btnCapture = document.getElementById('btn-capture');
  const mintPreviewImg = document.getElementById('mint-preview-img');
  const btnMint = document.getElementById('btn-mint');
  const mintStatusEl = document.getElementById('mint-status');
  const mintCollection = document.getElementById('mint-collection');
  const mintRendererIdx = document.getElementById('mint-renderer-idx');

  let mintSigner = null;
  let mintProvider = null;
  let capturedImageURI = null;

  // Toggle panel
  btnMintToggle.addEventListener('click', () => {
    const isOpen = mintPanel.classList.toggle('active');
    btnMintToggle.textContent = isOpen ? 'Mint \u25C2' : 'Mint \u25B8';
    if (isOpen) updateMintCommand();
  });

  function updateMintCommand() {
    // Prefer the literal command bar input (preserves repeat notation like (dR,23)).
    // Fall back to condensing the keystroke sequence for interactively built compositions.
    const display = mintCommandString ||
      executor.condenseCommandString(executor.commandTree.getCurrentCommandSequence().join(''));
    mintCmdDisplay.textContent = display || '(empty \u2014 build something first)';
    validateMintReady();
  }

  function validateMintReady() {
    const hasCmd = mintCmdDisplay.textContent && !mintCmdDisplay.textContent.startsWith('(empty');
    const hasName = mintNameInput.value.trim().length > 0;
    const hasImage = !!capturedImageURI;
    const hasWallet = !!mintSigner;
    const hasCollection = mintCollection.value.trim().length === 42;
    btnMint.disabled = !(hasCmd && hasName && hasImage && hasWallet && hasCollection);
  }

  mintNameInput.addEventListener('input', validateMintReady);
  mintDesc.addEventListener('input', validateMintReady);
  mintCollection.addEventListener('input', validateMintReady);

  // Wallet connection
  btnWallet.addEventListener('click', async () => {
    try {
      if (!window.ethereum) { walletStatus.textContent = 'No wallet found. Install MetaMask.'; return; }
      mintProvider = new ethers.BrowserProvider(window.ethereum);
      mintSigner = await mintProvider.getSigner();
      const addr = await mintSigner.getAddress();
      const network = await mintProvider.getNetwork();
      btnWallet.textContent = addr.slice(0,6) + '...' + addr.slice(-4);
      walletStatus.textContent = 'Connected on chain ' + network.chainId;
      document.getElementById('mint-chain-id').value = network.chainId.toString();
      validateMintReady();
    } catch (err) { walletStatus.textContent = 'Error: ' + err.message; }
  });

  let fullResImageURI = null;

  // Preview capture — 256×256 PNG for artifact, full-res PNG for download
  btnCapture.addEventListener('click', async () => {
    mintStatusEl.innerHTML = '<span class="info">Capturing preview...</span>';
    const wasShowUI = showUI;
    showUI = false;
    store.deselectAll();
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    try {
      const src = canvas;

      // Full-res: square crop from canvas at native resolution
      const sq = Math.min(src.width, src.height);
      const fullCv = document.createElement('canvas');
      fullCv.width = fullCv.height = sq;
      const fullCx = fullCv.getContext('2d');
      fullCx.drawImage(src, (src.width - sq) / 2, (src.height - sq) / 2, sq, sq, 0, 0, sq, sq);
      fullResImageURI = fullCv.toDataURL('image/png');

      // Thumbnail: 256×256 for artifact
      const THUMB = 256;
      const offscreen = document.createElement('canvas');
      offscreen.width = THUMB; offscreen.height = THUMB;
      const ctx2d = offscreen.getContext('2d');
      ctx2d.drawImage(fullCv, 0, 0, sq, sq, 0, 0, THUMB, THUMB);
      capturedImageURI = offscreen.toDataURL('image/png');

      mintPreviewImg.src = capturedImageURI;
      mintPreviewImg.style.display = 'block';
      document.getElementById('btn-download-preview').disabled = false;
      reencodePreview();
      const kb = Math.round(capturedImageURI.length * 0.75 / 1024);
      const fullKb = Math.round(fullResImageURI.length * 0.75 / 1024);
      mintStatusEl.innerHTML = '<span class="success">Captured: ' + kb + ' KB artifact · ' + fullKb + ' KB full-res (' + sq + 'px).</span>';
    } catch (err) {
      mintStatusEl.innerHTML = '<span class="error">Capture failed: ' + err.message + '</span>';
    }
    showUI = wasShowUI;
    validateMintReady();
  });

  // PNG loader
  document.getElementById('btn-load-png').addEventListener('click', () => {
    document.getElementById('png-file-input').click();
  });

  document.getElementById('png-file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        // Square-crop centered, then encode at 256px for artifact
        const side = Math.min(img.width, img.height);
        const THUMB = 256;
        const cv = document.createElement('canvas');
        cv.width = cv.height = THUMB;
        cv.getContext('2d').drawImage(img,
          (img.width - side) / 2, (img.height - side) / 2, side, side,
          0, 0, THUMB, THUMB);
        fullResImageURI = ev.target.result; // keep original as full-res
        capturedImageURI = cv.toDataURL('image/png');
        mintPreviewImg.src = capturedImageURI;
        mintPreviewImg.style.display = 'block';
        document.getElementById('btn-download-preview').disabled = false;
        reencodePreview();
        const kb = (capturedImageURI.length * 0.75 / 1024).toFixed(1);
        mintStatusEl.innerHTML = '<span class="success">Image loaded (~' + kb + ' KB).</span>';
        validateMintReady();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  });

  document.getElementById('btn-download-preview').addEventListener('click', () => {
    const uri = fullResImageURI || capturedImageURI;
    if (!uri) return;
    const fmt = document.getElementById('compress-fmt').value;
    const ext = fmt === 'image/png' ? 'png' : fmt === 'image/jpeg' ? 'jpg' : 'webp';
    const a = document.createElement('a');
    a.download = 'frameworks-preview.' + ext;
    a.href = capturedImageURI; // always download the currently-encoded artifact version
    a.click();
  });

  // Image compression panel
  function reencodePreview() {
    const src = fullResImageURI || capturedImageURI;
    if (!src) return;
    const fmt  = document.getElementById('compress-fmt').value;
    const size = parseInt(document.getElementById('compress-size').value);
    const qual = parseFloat(document.getElementById('compress-quality').value);

    // Quality row only relevant for lossy formats
    document.getElementById('compress-quality-row').style.opacity =
      fmt === 'image/png' ? '0.3' : '1';

    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = cv.height = size;
      const cx = cv.getContext('2d');
      cx.drawImage(img, 0, 0, size, size);
      capturedImageURI = cv.toDataURL(fmt, qual);
      mintPreviewImg.src = capturedImageURI;

      const artifactKb = (capturedImageURI.length * 0.75 / 1024).toFixed(1);
      const fullKb = fullResImageURI
        ? (fullResImageURI.length * 0.75 / 1024).toFixed(0) + ' KB full-res'
        : '—';
      const fmtLabel = fmt.split('/')[1];
      document.getElementById('compress-artifact-kb').textContent =
        artifactKb + ' KB artifact (' + size + 'px ' + fmtLabel + ')';
      document.getElementById('compress-fullres-kb').textContent = fullKb;
      validateMintReady();
    };
    img.src = fullResImageURI || capturedImageURI;
  }

  document.getElementById('compress-fmt').addEventListener('change', reencodePreview);
  document.getElementById('compress-size').addEventListener('input', () => {
    document.getElementById('compress-size-val').textContent =
      document.getElementById('compress-size').value;
    reencodePreview();
  });
  document.getElementById('compress-quality').addEventListener('input', () => {
    document.getElementById('compress-quality-val').textContent =
      parseFloat(document.getElementById('compress-quality').value).toFixed(2);
    reencodePreview();
  });

  // Also update mint panel when Export is clicked
  const origExportHandler = btnExport.onclick;
  btnExport.addEventListener('click', () => {
    if (mintPanel.classList.contains('active')) setTimeout(updateMintCommand, 50);
  });

  // Mint token
  btnMint.addEventListener('click', async () => {
    if (!mintSigner || !capturedImageURI) return;
    const tokenName = mintNameInput.value.trim();
    const tokenDescription = mintDesc.value.trim();
    const commandStr = mintCommandString ||
      executor.condenseCommandString(executor.commandTree.getCurrentCommandSequence().join(''));
    const collectionAddr = mintCollection.value.trim();
    const rendererIdx = parseInt(mintRendererIdx.value) || 0;
    if (!tokenName || !commandStr || !collectionAddr) {
      mintStatusEl.innerHTML = '<span class="error">Fill in all required fields.</span>';
      return;
    }
    btnMint.disabled = true;
    mintStatusEl.innerHTML = '<span class="info">Encoding artifact...</span>';
    try {
      const abiCoder = new ethers.AbiCoder();
      const artifactHex = abiCoder.encode(['string', 'string'], [capturedImageURI, commandStr]);
      const mint = new ethers.Contract(collectionAddr, MINT_ABI, mintSigner);
      const MAX_CHUNK = 24000;
      const totalBytes = ethers.getBytes(artifactHex);
      const byteLength = totalBytes.length;
      mintStatusEl.innerHTML = '<span class="info">Artifact: ' + (byteLength / 1024).toFixed(1) + ' KB</span>';

      if (byteLength <= MAX_CHUNK) {
        mintStatusEl.innerHTML = '<span class="info">Sending create transaction...</span>';
        const tx = await mint.create(tokenName, tokenDescription, [artifactHex], rendererIdx, 0);
        mintStatusEl.innerHTML = '<span class="info">Tx: ' + tx.hash.slice(0,10) + '... confirming...</span>';
        await tx.wait();
        const tokenId = await mint.latestTokenId();
        mintStatusEl.innerHTML = '<span class="success">Minted! Token #' + tokenId + '<br>Tx: ' + tx.hash + '</span>';
      } else {
        const chunks = [];
        for (let i = 0; i < totalBytes.length; i += MAX_CHUNK) {
          chunks.push(ethers.hexlify(totalBytes.slice(i, i + MAX_CHUNK)));
        }
        const nextTokenId = (await mint.latestTokenId()) + 1n;
        mintStatusEl.innerHTML = '<span class="info">Large artifact (' + chunks.length + ' chunks). Preparing #' + nextTokenId + '...</span>';
        for (let i = 0; i < chunks.length; i++) {
          mintStatusEl.innerHTML = '<span class="info">Chunk ' + (i+1) + '/' + chunks.length + '...</span>';
          const tx = await mint.prepareArtifact(nextTokenId, [chunks[i]], i === 0);
          await tx.wait();
        }
        mintStatusEl.innerHTML = '<span class="info">Creating token...</span>';
        const tx = await mint.create(tokenName, tokenDescription, [], rendererIdx, 0);
        mintStatusEl.innerHTML = '<span class="info">Tx: ' + tx.hash.slice(0,10) + '... confirming...</span>';
        await tx.wait();
        const tokenId = await mint.latestTokenId();
        mintStatusEl.innerHTML = '<span class="success">Minted! Token #' + tokenId + '<br>Tx: ' + tx.hash + '</span>';
      }
    } catch (err) {
      console.error('Mint error:', err);
      let msg = err.message;
      if (err.reason) msg = err.reason;
      mintStatusEl.innerHTML = '<span class="error">' + msg + '</span>';
    }
    validateMintReady();
  });
}

main().catch(e => {
  console.error(e);
  document.getElementById('error-msg').style.display='block';
  document.getElementById('error-msg').textContent=e.message;
});
</script>
</body>
</html>
