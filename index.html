<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frameworks V3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
        }

        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            font-size: 12px;
            max-width: 300px;
            pointer-events: none;
        }

        #ui h3 {
            margin-bottom: 10px;
            color: #4ECDC4;
        }

        #ui .status {
            margin: 5px 0;
        }

        #ui .label {
            color: #888;
            display: inline-block;
            width: 100px;
        }

        #ui .value {
            color: #fff;
        }

        #command-history {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            font-size: 12px;
            max-width: 400px;
            max-height: 200px;
            overflow-y: auto;
            pointer-events: none;
        }

        #command-history h3 {
            margin-bottom: 10px;
            color: #4ECDC4;
        }

        #command-string {
            color: #FFA07A;
            word-wrap: break-word;
        }

        #help {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            font-size: 11px;
            max-width: 250px;
            pointer-events: none;
        }

        #help h3 {
            margin-bottom: 10px;
            color: #4ECDC4;
        }

        #help .cmd {
            margin: 3px 0;
        }

        #help .key {
            color: #FFA07A;
            display: inline-block;
            width: 30px;
        }

        #help .desc {
            color: #aaa;
        }
    </style>
</head>
<body>
    <div id="container"></div>

    <div id="ui">
        <h3>FRAMEWORKS V3</h3>
        <div class="status">
            <span class="label">Mode:</span>
            <span class="value" id="mode">normal</span>
        </div>
        <div class="status">
            <span class="label">Frames:</span>
            <span class="value" id="frame-count">0</span>
        </div>
        <div class="status">
            <span class="label">Selected:</span>
            <span class="value" id="selected-count">0</span>
        </div>
        <div class="status">
            <span class="label">Cursor:</span>
            <span class="value" id="cursor-pos">(0, 0, 0)</span>
        </div>
    </div>

    <div id="command-history">
        <h3>Command History</h3>
        <div id="command-string"></div>
    </div>

    <div id="help">
        <h3>Commands</h3>
        <div class="cmd"><span class="key">f</span><span class="desc">create frame</span></div>
        <div class="cmd"><span class="key">d</span><span class="desc">duplicate</span></div>
        <div class="cmd"><span class="key">t</span><span class="desc">translate mode</span></div>
        <div class="cmd"><span class="key">s/S</span><span class="desc">scale/scale all</span></div>
        <div class="cmd"><span class="key">ik</span><span class="desc">up/down (in mode)</span></div>
        <div class="cmd"><span class="key">jl</span><span class="desc">left/right (in t)</span></div>
        <div class="cmd"><span class="key">r/R</span><span class="desc">rotate 90°/45°</span></div>
        <div class="cmd"><span class="key">e/E</span><span class="desc">reflect H/V</span></div>
        <div class="cmd"><span class="key">a/A</span><span class="desc">select color/all</span></div>
        <div class="cmd"><span class="key">z</span><span class="desc">cursor to origin</span></div>
        <div class="cmd"><span class="key">space</span><span class="desc">snap to cursor</span></div>
        <div class="cmd"><span class="key">p</span><span class="desc">cycle color</span></div>
    </div>

    <!-- Three.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <!-- Frameworks modules -->
    <script src="src/core.js"></script>
    <script src="src/palette.js"></script>
    <script src="src/commands.js"></script>
    <script src="src/renderer.js"></script>

    <!-- Main application -->
    <script>
        // Initialize framework
        const framework = new Framework();
        const paletteManager = new PaletteManager('checks');
        const commandExecutor = new CommandExecutor(framework, paletteManager);
        const renderer = new FrameworksRenderer(framework, 'container');

        // Start rendering
        renderer.start();

        // UI update loop
        function updateUI() {
            document.getElementById('mode').textContent = framework.mode;
            document.getElementById('frame-count').textContent = framework.frames.length;
            document.getElementById('selected-count').textContent = framework.getSelectedFrames().length;
            document.getElementById('cursor-pos').textContent =
                `(${framework.cursor.x.toFixed(1)}, ${framework.cursor.y.toFixed(1)}, ${framework.cursor.z.toFixed(1)})`;
            document.getElementById('command-string').textContent =
                framework.commandHistory.join(' ') || '(no commands yet)';

            requestAnimationFrame(updateUI);
        }
        updateUI();

        // Keyboard input
        document.addEventListener('keydown', (e) => {
            console.log('Key pressed:', e.key);

            // Prevent default for keys we're using
            if (['f', 'd', 't', 's', 'S', 'r', 'R', 'e', 'E', 'a', 'A', 'z', 'p',
                 'i', 'j', 'k', 'l', ' ', 'Escape'].includes(e.key)) {
                e.preventDefault();
            }

            // Execute command
            commandExecutor.executeKey(e.key);
        });

        // Export command string function (for later use)
        window.exportCommandString = function() {
            const cmdString = framework.commandHistory.join('');
            console.log('Command string:', cmdString);
            return cmdString;
        };

        // Auto-execute command string (for replay)
        window.autoExecuteCommand = function(cmdString) {
            console.log('Executing:', cmdString);
            commandExecutor.executeCommandString(cmdString);
        };

        console.log('Frameworks V3 initialized');
        console.log('Type "f" to create a frame, "t ijkl" to move');
        console.log('Use exportCommandString() to get command history');
    </script>
</body>
</html>
