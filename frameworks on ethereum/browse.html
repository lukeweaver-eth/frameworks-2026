<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Frameworks — browser</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<style>
  :root {
    --bg:#0c0c0d; --fg:#e8e8e8; --dim:#7a7a80; --line:#26262a;
    --accent:#7dd3a0; --warn:#d9a05b;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#fbfbfa; --fg:#1a1a1c; --dim:#77777e; --line:#e2e2e0;
            --accent:#1a7f4e; --warn:#a06520; }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:13px/1.55 ui-monospace,'SF Mono',Menlo,monospace;
    display:grid; grid-template-columns:340px 1fr; height:100vh;
  }
  #rail { border-right:1px solid var(--line); overflow-y:auto; padding:14px; }
  #main { overflow-y:auto; padding:22px 26px; }
  h1 { font-size:13px; margin:0 0 3px; letter-spacing:.09em; text-transform:uppercase; }
  .sub { color:var(--dim); font-size:11px; margin-bottom:14px; word-break:break-all; }
  .grp { color:var(--dim); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
         margin:16px 0 6px; }
  .item { padding:7px 9px; border:1px solid var(--line); border-radius:5px;
          margin-bottom:5px; cursor:pointer; background:transparent; width:100%;
          text-align:left; color:inherit; font:inherit; }
  .item:hover { border-color:var(--accent); }
  .item.on { border-color:var(--accent); background:color-mix(in srgb,var(--accent) 9%,transparent); }
  .item b { color:var(--accent); font-weight:600; }
  .item .meta { color:var(--dim); font-size:11px; }
  .row { display:flex; gap:10px; padding:5px 0; border-bottom:1px solid var(--line); }
  .row .k { color:var(--dim); min-width:130px; }
  .row .v { flex:1; word-break:break-all; }
  pre { background:color-mix(in srgb,var(--fg) 5%,transparent); padding:11px 13px;
        border-radius:6px; overflow-x:auto; margin:9px 0; font-size:12px; }
  button.go { background:var(--accent); color:var(--bg); border:0; padding:8px 15px;
        border-radius:5px; cursor:pointer; font:inherit; font-weight:600; margin:14px 8px 0 0; }
  button.go:disabled { opacity:.4; cursor:default; }
  .tree { margin:6px 0 0 4px; }
  .tree div { padding:2px 0 2px 14px; border-left:1px solid var(--line); }
  .badge { display:inline-block; padding:1px 7px; border-radius:9px; font-size:10px;
        border:1px solid var(--line); color:var(--dim); margin-left:6px; }
  #status { color:var(--dim); font-size:11px; padding:8px 0; }
  a { color:var(--accent); }
</style>
</head>
<body>

<div id="rail">
  <h1>Frameworks</h1>
  <div class="sub">0x5ae53901…830b880f<br>sepolia</div>
  <div id="status">loading…</div>
  <div id="list"></div>
</div>

<div id="main"><div id="detail" class="sub">select a frame</div></div>

<script>
const ADDR = '0x5ae53901f5a39528ac4bc8e8cba54deb830b880f';
const REND = '0x281C60Fafa8eaDCdfa16d58e919a1e3507eFA140';
const RPC  = 'https://ethereum-sepolia-rpc.publicnode.com';

const FW_ABI = [
  'function count() view returns (uint256)',
  'function chars(uint256) view returns (string)',
  'function contents(uint256) view returns (bytes32)',
  'function context(uint256,uint256) view returns (uint256)',
  'function componentCount(uint256) view returns (uint256)',
  'function componentAt(uint256,uint256) view returns (uint256)',
  'function author(uint256) view returns (address)',
];
const RD_ABI = [
  'function frameNames(uint256) view returns (string[])',
  'function uri(uint256) view returns (string)',
];

const provider = new ethers.JsonRpcProvider(RPC);
const fw = new ethers.Contract(ADDR, FW_ABI, provider);
const rd = new ethers.Contract(REND, RD_ABI, provider);

const CTX_CALLED = 0, CTX_COMMAND_SET = 4;
const b32 = h => { const s = ethers.toUtf8String(h).replace(/\0+$/,''); return s; };

// Chunked reads — firing 150 eth_calls at once gets you rate-limited.
async function batch(items, fn, size = 6) {
  const out = [];
  for (let i = 0; i < items.length; i += size)
    out.push(...await Promise.all(items.slice(i, i + size).map(fn)));
  return out;
}

let frames = [];   // { id, chars, comps, name, isComposition, isSet }

async function load() {
  const n = Number(await fw.count());
  document.getElementById('status').textContent = `reading ${n} frames…`;
  const ids = Array.from({length:n}, (_,i) => i+1);

  const chars = await batch(ids, i => fw.chars(i));
  const comps = await batch(ids, i => fw.componentCount(i));
  const named = await batch(ids, i => fw.context(i, CTX_CALLED));
  const names = await batch(named, id => id === 0n ? '' : fw.contents(id).then(b32));

  frames = ids.map((id,k) => ({
    id, chars: chars[k], comps: Number(comps[k]), name: names[k],
    isComposition: chars[k].length > 0,
    isSet: Number(comps[k]) > 20 && chars[k].length === 0,
  }));

  document.getElementById('status').textContent = `${n} frames`;
  render();
}

function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  const groups = [
    ['compositions', frames.filter(f => f.isComposition)],
    ['command sets', frames.filter(f => f.isSet)],
    ['named frames', frames.filter(f => f.name && !f.isComposition && !f.isSet)],
    ['all',          frames],
  ];
  for (const [label, set] of groups) {
    if (!set.length) continue;
    const h = document.createElement('div');
    h.className = 'grp'; h.textContent = `${label} (${set.length})`;
    list.appendChild(h);
    for (const f of set) {
      const btn = document.createElement('button');
      btn.className = 'item';
      btn.innerHTML = `<b>#${f.id}</b> ${f.name || '<span class="meta">unnamed</span>'}`
        + `<div class="meta">${f.comps} components`
        + (f.isComposition ? ` · ${f.chars.length} chars` : '') + `</div>`;
      btn.onclick = () => show(f.id, btn);
      list.appendChild(btn);
    }
  }
}

async function show(id, btn) {
  document.querySelectorAll('.item').forEach(e => e.classList.remove('on'));
  if (btn) btn.classList.add('on');
  const d = document.getElementById('detail');
  d.className = ''; d.innerHTML = 'reading…';

  const f = frames.find(x => x.id === id);
  const [author, cmdSet, nComp] = await Promise.all([
    fw.author(id), fw.context(id, CTX_COMMAND_SET), fw.componentCount(id),
  ]);

  const kids = await batch(Array.from({length:Number(nComp)},(_,i)=>i),
                           i => fw.componentAt(id, i));
  const kidNames = await batch(kids, k => fw.context(k, CTX_CALLED)
      .then(c => c === 0n ? fw.contents(k).then(v => '“'+b32(v)+'”') : fw.contents(c).then(b32)));

  let html = `<div class="row"><span class="k">frame</span><span class="v">#${id}`
    + (f?.name ? ` — <b style="color:var(--accent)">${f.name}</b>` : '') + `</span></div>`
    + `<div class="row"><span class="k">author</span><span class="v">${author}</span></div>`
    + `<div class="row"><span class="k">components</span><span class="v">${nComp}</span></div>`;

  if (cmdSet !== 0n)
    html += `<div class="row"><span class="k">command set</span><span class="v">`
          + `<a href="#" onclick="show(${cmdSet});return false">#${cmdSet}</a></span></div>`;

  if (f?.isComposition) {
    html += `<div class="row"><span class="k">char string</span><span class="v"></span></div>`
          + `<pre>${f.chars.replace(/</g,'&lt;')}</pre>`;
    const names = await rd.frameNames(id);
    html += `<div class="row"><span class="k">frameNames()</span>`
          + `<span class="v">[${names.map(n=>`"${n}"`).join(', ')}]</span></div>`;
    html += `<button class="go" onclick="openArtifact(${id},this)">open artifact</button>`
          + `<span class="badge">reads uri() from chain · WebGPU</span>`;
  }

  if (kids.length) {
    html += `<div class="grp">components</div><div class="tree">`;
    kids.forEach((k,i) => {
      html += `<div><a href="#" onclick="show(${k});return false">#${k}</a> `
            + `<span class="meta">${kidNames[i]}</span></div>`;
    });
    html += `</div>`;
  }

  d.innerHTML = html;
}

async function openArtifact(id, btn) {
  btn.disabled = true; btn.textContent = 'reading uri()…';
  try {
    const uri  = await rd.uri(id);
    const meta = JSON.parse(atob(uri.split('base64,')[1]));
    const html = atob(meta.animation_url.split('base64,')[1]);
    const w = window.open('', '_blank');
    w.document.write(html); w.document.close();
    btn.textContent = 'open artifact';
  } catch (e) {
    btn.textContent = 'failed: ' + e.message.slice(0,40);
  }
  btn.disabled = false;
}

window.show = show; window.openArtifact = openArtifact;
load().catch(e => document.getElementById('status').textContent = 'error: ' + e.message);
</script>
</body>
</html>
