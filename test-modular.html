<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frameworks V3 - Modular Test</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: monospace;
        }
        #container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="info">
        <strong>Frameworks V3 - Modular Test Environment</strong><br>
        Press 'h' to toggle help<br>
        <span id="command-display"></span>
    </div>
    <div id="container"></div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r147/three.min.js"></script>

    <!-- Load modular Frameworks components in order -->
    <script src="src/core.js"></script>
    <script src="src/palette.js"></script>
    <script src="src/context-color.js"></script>
    <script src="src/context-camera.js"></script>
    <script src="src/context-selection.js"></script>
    <script src="src/command-tree.js"></script>
    <script src="src/commands.js"></script>
    <script src="src/renderer-instanced.js"></script>

    <!-- Initialize -->
    <script>
        // Test command history
        const TEST_COMMANDS = 'ftil(dR,8)';

        // Initialize Frameworks
        const framework = new Framework();
        const paletteManager = new PaletteManager('eightyColors');
        const renderer = new FrameworksInstancedRenderer(framework, 'container');
        const colorContext = new ColorContext(framework, paletteManager);
        const cameraContext = new CameraContext(framework, renderer);
        const selectionContext = new FrameSelectionContext(framework);
        const commandTree = new CommandTree();
        const commandExecutor = new CommandExecutor(
            framework,
            paletteManager,
            renderer,
            commandTree,
            colorContext,
            cameraContext,
            selectionContext
        );

        // Start rendering
        renderer.start();

        // Execute test commands if any
        if (TEST_COMMANDS) {
            commandExecutor.executeCommandString(TEST_COMMANDS);
        }

        // Keyboard handler
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                return;
            }

            const key = e.key;
            const isShift = e.shiftKey;
            commandExecutor.executeKey(key, isShift);

            // Update command display
            document.getElementById('command-display').textContent =
                'Commands: ' + commandTree.getCurrentCommandSequence().join('');
        });

        console.log('✅ Frameworks V3 loaded in modular development mode');
        console.log('📝 Edit files in src/ and refresh to see changes');
    </script>
</body>
</html>
